<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a6fa8">
<meta name="robots" content="noindex">
<title>오송고 면접 부스</title>
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<style>
  /* 면접 부스 전용 — 이 파일 안에서만 쓴다 (style.css 는 건드리지 않음)
     부스 모니터(1920×1080)를 기준으로, 1280px 노트북에서도 깨지지 않게 */
  html, body { height: 100%; }
  body.booth { font-size: 17px; background: var(--bg); overflow: hidden; }
  .bbar { height: 64px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid var(--line); background: #fff; }
  .bbar .brand { font-size: 1.15rem; font-weight: 800; white-space: nowrap; }
  .hmid { display: flex; align-items: center; gap: 16px; min-width: 0; }
  .hbar { width: 180px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
  .hbar i { display: block; height: 100%; width: 0; background: var(--accent-fill); }
  .htime, .hnote { font-size: .9rem; color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .htime b { color: var(--ink); }
  .bbar .who { font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

  #app { height: calc(100% - 64px); }
  .room { height: 100%; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(420px, 1fr); }
  .room[hidden], .full[hidden] { display: none; }
  .full { height: 100%; overflow-y: auto; }
  .scene { position: relative; background: #3b3430; overflow: hidden; min-height: 0; }
  .self { position: absolute; right: 20px; top: 14px; z-index: 3; width: min(19%, 240px); aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden;
    background: #cfd6de; border: 2px solid rgba(255,255,255,.85); box-shadow: 0 4px 14px rgba(0,0,0,.3); }
  .self video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .self .rec { position: absolute; left: 8px; top: 5px; display: none; align-items: center; gap: 5px; color: #fff; font-size: .72rem; font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  .self .rec::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #e0493f; }   /* 깜빡이지 않음 — 녹화 중일 때만 보임 */
  .self.recording .rec { display: flex; }

  .panel { background: #fff; border-left: 1px solid var(--line); padding: 44px 44px 28px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; min-height: 0; }
  .panel .grow { flex: 1; }
  .phase-l { font-size: .9rem; font-weight: 700; color: var(--accent); }
  .phase-l.danger { color: var(--danger); }
  .ttl { font-size: clamp(1.5rem, 1.1rem + 1vw, 2rem); font-weight: 800; line-height: 1.38; letter-spacing: -0.025em; margin: 0; }
  .ttl.big { font-size: clamp(1.8rem, 1.3rem + 1.2vw, 2.3rem); }
  .ttl small { font-size: .52em; color: var(--ink-3); font-weight: 700; margin-left: 6px; letter-spacing: 0; }
  .sub { color: var(--ink-3); line-height: 1.6; margin: 0; }
  .qtext { font-size: clamp(1.45rem, 1.1rem + 1vw, 2.05rem); font-weight: 800; line-height: 1.42; letter-spacing: -0.025em; color: var(--ink); }
  .qtext.sm { font-size: clamp(1.15rem, 1rem + .5vw, 1.4rem); font-weight: 700; }
  .qtext.dim { color: var(--ink-3); }
  .qprev { font-size: .92rem; color: var(--ink-3); line-height: 1.5; }
  .hint { font-size: .9rem; color: var(--ink-3); line-height: 1.6; margin: 0; }
  .lstat { display: flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--ink-3); margin: 0; }
  .lstat i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); flex: none; }
  .lstat i.ok { background: var(--ok); }
  .ico { width: 34px; height: 34px; border-radius: 50%; background: var(--accent-fill); color: #fff; display: grid; place-items: center; flex: none; }
  .ico svg { width: 18px; height: 18px; }

  /* 말로 하는 안내·버튼 세 개 */
  .sayto { border: 1px solid var(--accent-line); background: var(--accent-faint); border-radius: 14px; padding: 16px 18px; display: grid; gap: 12px; }
  .sayto-h { display: flex; align-items: center; gap: 10px; font-weight: 700; }
  .chips-say { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips-say span { border: 1px solid var(--accent-line); background: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 700; color: var(--accent); }
  .chips-say span.mute { color: var(--ink-2); border-color: var(--line); }
  .acts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .acts3 > div { display: grid; gap: 6px; }
  .acts3 button { min-height: 60px; font-size: 1.1rem; font-weight: 700; border-radius: 10px; width: 100%; justify-content: center; text-align: center; }
  .acts3 button.end { color: var(--danger); }
  .acts3 span { text-align: center; font-size: .8rem; color: var(--ink-3); }

  /* 로그인 */
  .form label { display: block; font-weight: 700; margin: 0 0 6px; }
  .form input { font-size: 1.2rem; padding: 12px 14px; min-height: 52px; }
  .form .field + .field { margin-top: 16px; }
  .form .btn-lg { width: 100%; margin-top: 20px; min-height: 58px; font-size: 1.15rem; justify-content: center; }
  .err { color: var(--danger); font-size: .95rem; min-height: 1.4em; margin: 8px 0 0; }
  .note-i { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-faint); border-radius: 12px; padding: 14px 16px; font-size: .9rem; line-height: 1.6; color: var(--ink-2); }
  .note-i svg { flex: none; width: 18px; height: 18px; margin-top: 3px; color: var(--accent); }

  /* 장비 점검 */
  .ck { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .ck li { display: flex; gap: 12px; align-items: center; }
  .ck .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .85rem; font-weight: 700; background: var(--chip); color: var(--ink-2); }
  .ck li.ok .n { background: var(--ok-bg); color: var(--ok); }
  .ck li.ok .n::before { content: "✓"; } .ck li.ok .n span { display: none; }
  .ck li.now .n { background: var(--accent-soft); color: var(--accent); }
  .ck li.bad .n { background: var(--warn-bg); color: var(--warn); }
  .ck .d { color: var(--ink-3); }
  .meter { height: 10px; border-radius: 5px; background: var(--line-3); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .1s linear; }
  .heard { background: var(--accent-faint); border-radius: 10px; padding: 12px 16px; min-height: 48px; color: var(--ink-2); }

  /* 면접 시간 */
  .tcards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tcard { min-height: 104px; border-radius: 14px; display: grid; place-content: center; gap: 4px; background: #fff; }
  .tcard b { font-size: 1.9rem; font-weight: 800; }
  .tcard span { font-size: .8rem; color: var(--ink-3); }
  .tcard.on { border: 2px solid var(--accent-fill); background: var(--accent-faint); color: var(--accent); }
  .info { background: var(--accent-faint); border-radius: 12px; padding: 14px 16px; display: grid; gap: 8px; font-size: .92rem; line-height: 1.6; }
  .info p { margin: 0; } .info .m { color: var(--ink-3); }

  /* 질문·생각·답변 */
  .clock-row { display: flex; align-items: baseline; gap: 10px; }
  .clock { font-size: 3.2rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; line-height: 1; }
  .clock-s { font-size: 1rem; font-weight: 600; color: var(--ink-3); }
  .track { height: 8px; background: var(--line-3); border-radius: 4px; overflow: hidden; }
  .track i { display: block; height: 100%; width: 0; background: var(--accent-fill); transition: width .25s linear; }
  .track-l { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .cmds { background: var(--accent-faint); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
  .cmds-h { font-size: .9rem; font-weight: 700; }
  .cmds-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .cmds-g > div { background: #fff; border: 1px solid var(--accent-line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 2px; }
  .cmds-g b { color: var(--accent); } .cmds-g span { font-size: .8rem; color: var(--ink-3); }
  .cmds-g > div.used { opacity: .45; }
  .live { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--bg); display: grid; gap: 8px; }
  .live-h { display: flex; align-items: center; gap: 8px; font-size: .88rem; font-weight: 700; color: var(--ok); }
  .live-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .live p { margin: 0; line-height: 1.65; color: var(--ink-2); max-height: 8.3em; overflow: hidden; }
  .live p span { color: var(--ink-3); }
  .hush { background: var(--warn-bg); border-radius: 14px; padding: 18px 20px; display: grid; gap: 10px; }
  .hush > b { font-size: 1.35rem; line-height: 1.45; }
  .hush-n { display: flex; gap: 12px; align-items: center; color: var(--warn); }
  .hush-n span { font-size: 2.2rem; font-weight: 800; }
  .hush-n p { margin: 0; font-size: .9rem; line-height: 1.5; }
  .listen.hushing .clock { font-size: 2.2rem; color: var(--ink-3); }

  /* 종료 확인·막힘 */
  .ccards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .ccard { text-align: left; display: grid; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #fff; min-height: 78px; }
  .ccard b { font-size: 1.1rem; } .ccard span { font-size: .85rem; color: var(--ink-3); font-weight: 400; }
  .ccard.on { background: var(--accent-faint); border-color: var(--accent-line); color: var(--accent); }
  .cnt { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
  .cnt p { margin: 0; font-size: .92rem; line-height: 1.5; color: var(--ink-2); }
  .cnum { font-size: 1.8rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .cnum.danger { color: var(--danger); }
  .blk-i { width: 52px; height: 52px; border-radius: 50%; background: #fbe9e7; color: var(--danger); display: grid; place-items: center; }
  .blk-i svg { width: 22px; height: 22px; }
  .help { background: var(--chip); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
  .help p { margin: 0; font-size: .9rem; color: var(--ink-3); line-height: 1.6; }
  .blk-go { width: 100%; min-height: 54px; justify-content: center; text-align: center; }

  /* 부스 PC 잠금·관리자 등록 */
  .lockv { min-height: 100%; display: grid; place-items: center; padding: 32px 20px; position: relative; }
  .lock-card { width: min(560px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 36px 36px 30px; display: grid; gap: 16px; }
  .lock-card .ico { width: 52px; height: 52px; } .lock-card .ico svg { width: 24px; height: 24px; }
  .lock-card .btn-lg { min-height: 56px; justify-content: center; text-align: center; font-size: 1.1rem; }
  .lock-card a.btn-lg { display: flex; align-items: center; text-decoration: none; border-radius: 10px; }
  .lock-admin { position: absolute; right: 20px; bottom: 16px; background: none; border: none; color: var(--ink-3); font-size: .85rem; text-decoration: underline; min-height: 36px; }
  .lock-back { background: none; border: none; color: var(--ink-3); font-size: .9rem; text-decoration: underline; justify-self: center; }

  /* 면접관 고르기 */
  .pick { max-width: 1280px; margin: 0 auto; padding: 22px 48px 24px; display: flex; flex-direction: column; gap: 18px; min-height: 100%; }
  .pick-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .say-pill { display: flex; align-items: center; gap: 10px; border: 1px solid var(--accent-line); background: var(--accent-faint); border-radius: 999px;
    padding: 8px 16px 8px 8px; font-weight: 700; color: var(--accent); font-size: .92rem; }
  .pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .pcard { padding: 0; text-align: left; border-radius: 16px; overflow: hidden; background: #fff; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; font-weight: 400; min-height: 0; }
  .pcard .pimg { display: block; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: #cdbfae; }
  .pcard img { width: 100%; height: 100%; object-fit: cover; display: block; }   /* 원본 16:9 그대로 (자르지 않음) */
  .pcard .pbody { display: grid; gap: 4px; padding: 12px 16px 16px; width: 100%; justify-items: start; }
  .pcard b { font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
  .pcard em { font-style: normal; font-size: .75rem; background: var(--accent-fill); color: #fff; border-radius: 999px; padding: 2px 10px; }
  .pcard small { color: var(--ink-3); font-size: .85rem; line-height: 1.45; }
  .pcard.on { box-shadow: 0 0 0 3px var(--accent-fill); border-color: var(--accent-fill); }
  .pcard.on .pbody { background: var(--accent-faint); } .pcard.on b { color: var(--accent); }
  .pick-foot { display: flex; align-items: flex-end; gap: 24px; justify-content: space-between; margin-top: auto; }
  .pick-foot .acts3 { width: min(480px, 100%); flex: none; }

  /* 결과 */
  .results .inner { max-width: 1180px; margin: 0 auto; padding: 28px 28px 60px; display: grid; gap: 18px; }
  .rtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .rcount { display: flex; gap: 12px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
  .rcount b { font-size: 1.7rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .rcount span { font-size: .85rem; color: var(--ink-2); line-height: 1.5; }
  .notice-dl { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 18px 20px; display: flex; gap: 14px; align-items: center; }
  .notice-dl > svg { flex: none; width: 24px; height: 24px; align-self: flex-start; margin-top: 2px; }
  .notice-dl > div { flex: 1; }
  .notice-dl b { font-size: 1.05rem; } .notice-dl p { margin: 6px 0 0; font-size: .9rem; line-height: 1.65; }
  .notice-dl p b { font-size: inherit; }
  .btn-dl { background: var(--warn); color: #fff; border-color: var(--warn); min-height: 52px; font-weight: 700; font-size: 1.05rem; padding: 0 20px; flex: none; }
  .sumline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .sumline > div { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .sumline b { display: block; font-size: 1.5rem; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .sumline b small { font-size: .6em; color: var(--ink-3); }
  .sumline span { font-size: .85rem; color: var(--ink-3); }
  .tchart, .res { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }
  .tchart-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .tchart-h h2 { margin: 0; font-size: 1.2rem; }
  .legend { display: flex; gap: 14px; font-size: .85rem; color: var(--ink-3); flex-wrap: wrap; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .tbar { display: flex; height: 40px; border-radius: 8px; overflow: hidden; background: var(--line-3); }
  .tbar i { display: grid; place-items: center; color: #fff; font-size: .8rem; font-weight: 700; font-style: normal; min-width: 0; overflow: hidden; white-space: nowrap; }
  .s-think { background: #dfe7f1; } .s-ans { background: #2e4a7a; } .s-fol { background: #8fa8cf; } .s-gap { background: #f1ecea; } .s-rest { background: #f6f2f0; }
  .taxis { display: flex; justify-content: space-between; font-size: .8rem; color: var(--ink-3); margin-top: 6px; font-variant-numeric: tabular-nums; }
  .ttable { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: .95rem; }
  .ttable th { text-align: left; font-size: .82rem; color: var(--ink-3); font-weight: 700; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .ttable td { padding: 10px 8px; border-bottom: 1px solid var(--line-3); font-variant-numeric: tabular-nums; }
  .ttable td.q { width: 42%; } .ttable td.n { font-weight: 700; }
  .ttable .tag { font-size: .75rem; background: var(--warn-bg); color: var(--warn); border-radius: 999px; padding: 1px 8px; margin-left: 6px; white-space: nowrap; }
  .ttable .mini { height: 8px; background: var(--line-3); border-radius: 4px; overflow: hidden; min-width: 120px; }
  .ttable .mini i { display: block; height: 100%; background: var(--accent-fill); }
  .tnote { font-size: .88rem; color: var(--ink-3); margin: 12px 0 0; line-height: 1.6; }
  .res .pair { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 22px; }
  .res .pair + .pair { border-top: 1px solid var(--line-3); padding-top: 18px; margin-top: 18px; }
  .res video { width: 100%; aspect-ratio: 16 / 9; background: #1f2023; border-radius: 10px; display: block; }
  .res .novid { aspect-ratio: 16 / 9; border-radius: 10px; background: var(--line-3); display: grid; place-items: center; color: var(--ink-3); }
  .res .qn { font-size: .88rem; font-weight: 700; color: var(--accent); }
  .res .qt { font-size: 1.1rem; font-weight: 700; line-height: 1.45; margin: 4px 0 8px; }
  .res .ans { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; line-height: 1.65; white-space: pre-wrap; }
  .chips-m { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
  .chips-m span { border-radius: 999px; padding: 5px 12px; font-size: .85rem; background: var(--chip); color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .chips-m span.good { background: var(--ok-bg); color: var(--ok); }
  .chips-m span.note { background: var(--warn-bg); color: var(--warn); }
  .dl { margin-top: 10px; }
  .foot-r { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }

  /* ════════ 면접관 — 원본 사진(16:9) + 상태 영상 ════════
     한 명이면 크게, 두 명이면 위아래. 사진과 영상은 같은 칸·같은 크기로 겹쳐 레이아웃이 움직이지 않음 */
  .ivs { position:absolute; inset:0; overflow:hidden; background:#2f2a27; container-type:size; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2cqh; }
  .ivs::before { content:""; position:absolute; inset:-5%; background: var(--ivs-bg) center / cover no-repeat; filter: blur(24px) brightness(.55) saturate(.9); }
  .ivp { position:relative; flex:none; width:min(94cqw, calc(90cqh * 16 / 9)); aspect-ratio:16 / 9; overflow:hidden; border-radius:14px; background:#cdbfae; box-shadow:0 10px 32px rgba(0,0,0,.35); }
  .ivs[data-count="2"] .ivp { width:min(94cqw, calc(45cqh * 16 / 9)); }
  /* 사진·영상을 칸보다 2% 크게 '고정'해 두어, 아주 작은 움직임에도 가장자리 틈이 보이지 않게 (움직이는 확대 아님) */
  .ivp-photo, .ivp-vid { position:absolute; left:-1%; top:-1%; width:102%; height:102%; object-fit:cover; display:block; user-select:none; -webkit-user-drag:none; }
  .ivp-vid { opacity:0; transition: opacity .35s ease; background:transparent; }
  .ivp.vid-on .ivp-vid { opacity:1; }
  /* 영상이 없을 때만: 말할 때 아주 미세한 위아래, 들을 때 가끔 약한 끄덕임 (세기 = --ivp-amp) */
  .ivp[data-state="speaking"]:not(.vid-on) .ivp-photo { animation: ivp-talk 4s ease-in-out infinite; }
  .ivp.nod:not(.vid-on) .ivp-photo { animation: ivp-nod 1.4s ease-in-out 1; }
  @keyframes ivp-talk { 0%,100% { transform: translateY(0); } 50% { transform: translateY(calc(var(--ivp-amp, 1) * -0.15%)); } }

/* 새 버전 확인 (수정 금지 · 모든 화면 공통)

   화면 코드를 실행하기 전에 쓰는 파일을 서버에 한 번씩 확인(재검증)해 항상 같은 버전으로 맞추고,

(function () {
  var q = new URLSearchParams(location.search);

    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}

  function deps(text) { var out = [], m; RX.lastIndex = 0; while ((m = RX.exec(text))) out.push(m[1] || m[2]); return out; }
  // 느린 네트워크·응답 없는 서버에서 화면 준비가 영영 끝나지 않는 것을 막는다

      var t = setTimeout(function () {

    files = files.filter(function (f) { if (seen[f]) return false; seen[f] = 1; return true; });
    if (!files.length) return Promise.resolve();
    return Promise.all(files.map(function (f) {
      return fetchT(f, 8000).then(function (r) {
        sig[f] = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return /\.js$/.test(f) ? r.text().then(deps) : [];
      }).catch(function () { return []; });
    })).then(function (lists) { return check([].concat.apply([], lists), seen, sig); });
  }

  var failShown = false;
  function failBar(msg) {

    var text = String(msg || "");

  var blockedFirebase = false;

    var d = document.createElement("div");

    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }

    var mains = [].slice.call(document.querySelectorAll('script[type="app-module"]'));
    var page = location.pathname.split("/").pop() || "index.html";
    var initial = ["style.css", page];
    mains.forEach(function (s) { initial = initial.concat(deps(s.textContent)); });
    var sig = {}, done = false;
    function go() {
      if (done) return; done = true;

        }

        if (reloading) return;

        try {

        if (css && sig["style.css"]) css.href = "style.css?v=" + encodeURIComponent(sig["style.css"]).replace(/%/g, "");
        mains.forEach(function (old) { var s = document.createElement("script"); s.type = "module"; s.textContent = old.textContent; old.replaceWith(s); });

    setTimeout(function () {

const IV_MOTION = { A: 1, B: 1, C: 1, D: 1 };
const IV_VOICE = {
  A: { gender: "m", rate: 0.92, pitch: 0.86, prefer: ["InJoon", "BongJin", "GookMin", "Hyunsu"] },
  B: { gender: "m", rate: 1.02, pitch: 0.98, prefer: ["Hyunsu", "InJoon", "GookMin"] },
  C: { gender: "f", rate: 0.94, pitch: 0.92, prefer: ["SeoHyeon", "SoonBok", "YuJin", "Heami", "SunHi", "Google"] },
  D: { gender: "f", rate: 1.0, pitch: 1.04, prefer: ["SunHi", "Heami", "Google", "JiMin", "Yuna"] }

const ivUrl = (id, file) => `${IV_BASE}${id}/${file}`;

async function loadManifest() {

  } catch (e) { console.warn("면접관 manifest 를 읽지 못했어요 — 사진만 씁니다", e); }
}
// 미리 받은 영상: 원래 주소 → blob 주소. <video> 는 blob 주소를 그대로 써서 다시 받지 않는다
const ivBlobs = new Map(), ivWait = new Map();     // ivWait: 받는 중인 파일 → 끝나면 풀리는 약속
function preloadVideos(letters) {
  if (IV_REDUCED) return;
  for (const L of letters) {
    const id = CHARACTERS[L]?.id, m = IV_MANIFEST[id] || {};
    for (const st of IV_STATES) {
      if (!m[st]) continue;
      const u = ivUrl(id, m[st]);
      if (ivBlobs.has(u)) continue;
      ivBlobs.set(u, null);
      ivWait.set(u, fetch(u).then((r) => (r.ok ? r.blob() : null)).then((b) => {
        if (b && ivBlobs.has(u)) ivBlobs.set(u, URL.createObjectURL(b)); else ivBlobs.delete(u);

}
function releaseVideos() { ivBlobs.forEach((b) => { if (b) URL.revokeObjectURL(b); }); ivBlobs.clear(); ivWait.clear(); }

// ---------- 그리기: 사진을 항상 밑에 깔고, 상태 영상이 있으면 재생이 시작된 뒤 위로 서서히 ----------
class PhotoRenderer {
  constructor(L) { this.L = L; this.el = null; this.vid = null; this.timer = null; this.state = null; }
  mount(parent) {
    const el = document.createElement("div");
    el.className = "ivp";
    el.innerHTML = `<img class="ivp-photo" alt="" draggable="false"><div class="ivp-name"></div>`;
    parent.appendChild(el); this.el = el; this.photo = el.querySelector(".ivp-photo");
    el.addEventListener("animationend", this._onEnd = (e) => { if (e.animationName === "ivp-nod") el.classList.remove("nod"); });
    return this;
  }
  setCharacter(L) {
    this.L = L; this.id = CHARACTERS[L].id;
    this.photo.src = masterUrl(L);
    this.el.querySelector(".ivp-name").textContent = CHARACTERS[L].label;
    this.el.setAttribute("role", "img"); this.el.setAttribute("aria-label", CHARACTERS[L].label);
    this.el.style.setProperty("--ivp-amp", String(IV_MOTION[L] ?? 1));
    this.el.dataset.who = L;
    if (this.vid) { this.hideVideo(); this.vid.poster = masterUrl(L); this.vid.dataset.u = ""; this.vid.removeAttribute("src"); this.vid.load(); }
  }
  _video() {                 // 사람마다 하나만 만들어 계속 재사용
    if (this.vid || IV_REDUCED) return this.vid;
    const v = document.createElement("video");
    v.className = "ivp-vid"; v.muted = true; v.playsInline = true; v.preload = "auto";
    v.setAttribute("muted", ""); v.setAttribute("playsinline", ""); v.disablePictureInPicture = true;
    v.poster = masterUrl(this.L);
    v.addEventListener("playing", () => { if (v.dataset.want === "1") { clearTimeout(this.timer); this.el.classList.add("vid-on"); } });
    v.addEventListener("error", () => this.hideVideo());
    this.el.insertBefore(v, this.el.querySelector(".ivp-name"));
    return (this.vid = v);
  }
  apply(s) {
    if (!this.el) return;
    if (s.state !== undefined) this.show(s.state);
    if (s.nod && !this.el.classList.contains("vid-on")) { this.el.classList.remove("nod"); void this.el.offsetWidth; this.el.classList.add("nod"); }
    if (s.asking !== undefined) this.el.classList.toggle("asking", s.asking);
  }
  show(state) {
    this.state = state; this.el.dataset.state = state;
    const file = IV_REDUCED ? null : IV_MANIFEST[this.id]?.[state];
    if (!file) return this.hideVideo();
    const v = this._video(), u = ivUrl(this.id, file);
    v.dataset.want = "1"; v.loop = IV_LOOP[state];
    clearTimeout(this.timer);   // 늦게 오거나 실패하면 사진으로 그대로 진행 (검은 화면 없음)
    this.timer = setTimeout(() => { if (!this.el?.classList.contains("vid-on")) this.hideVideo(); }, 1500);
    const start = () => {
      if (!this.el || this.state !== state || v.dataset.want !== "1") return;
      if (v.dataset.u !== u) { this.el.classList.remove("vid-on"); v.dataset.u = u; v.src = ivBlobs.get(u) || u; }   // 미리 받은 blob 우선
      else if (v.ended || !IV_LOOP[state]) { try { v.currentTime = 0; } catch (_) {} }
      try { v.play()?.catch?.(() => this.hideVideo()); } catch (_) { this.hideVideo(); }
    };
    const wait = ivWait.get(u);
    if (wait && v.dataset.u !== u) { this.el.classList.remove("vid-on"); wait.then(start); }   // 미리 받는 중이면 기다렸다 그 파일로 (다시 받지 않음)
    else start();
  }
  hideVideo() {
    clearTimeout(this.timer);
    this.el?.classList.remove("vid-on");
    if (this.vid) { this.vid.dataset.want = "0"; try { this.vid.pause(); } catch (_) {} }
  }
  pause() { this.hideVideo(); }
  resume() { if (this.state) this.show(this.state); }
  destroy() {
    clearTimeout(this.timer);
    if (this.vid) { try { this.vid.pause(); this.vid.removeAttribute("src"); this.vid.load(); } catch (_) {} }
    if (this.el) { this.el.removeEventListener("animationend", this._onEnd); this.el.remove(); }
    this.el = this.vid = null;
  }
}

// ---------- 상태·타이머 (그리는 방법은 모름 — 렌더러만 바꾸면 다른 방식으로 교체 가능) ----------
const rnd = (a, b) => a + Math.random() * (b - a);
class Interviewer {
  constructor(L, renderer) {
    this.id = L; this.character = CHARACTERS[L]; this.renderer = renderer || new PhotoRenderer(L);
    this.state = null; this.timers = {}; this.paused = false; this.stats = { nods: 0 };
  }
  mount(parent) { this.renderer.mount(parent); this.setCharacter(this.id); this.setState("idle"); return this; }
  setCharacter(L) {
    if (!CHARACTERS[L]) return;
    this.id = L; this.character = CHARACTERS[L]; this.renderer.setCharacter(L);
    const s = this.state; this.state = null; if (s) this.setState(s);
  }
  _after(n, ms, fn) { clearTimeout(this.timers[n]); this.timers[n] = setTimeout(() => { this.timers[n] = null; fn(); }, ms); }
  _clear(n) { clearTimeout(this.timers[n]); this.timers[n] = null; }
  _clearAll() { for (const k in this.timers) clearTimeout(this.timers[k]); this.timers = {}; }
  setState(s) {
    if (!IV_STATES.includes(s) || s === this.state) return;
    this.state = s; this._clear("nod");
    if (this.paused) return;
    this.renderer.apply({ state: s });
    if (s === "listening") this._scheduleNod();
  }
  _scheduleNod() {           // 듣는 동안 10~20초마다 아주 약한 끄덕임 (영상이 있으면 영상이 대신)
    if (IV_REDUCED || !(IV_MOTION[this.id] > 0)) return;
    this._after("nod", rnd(10000, 20000), () => { if (this.state !== "listening") return; this.stats.nods++; this.renderer.apply({ nod: true }); this._scheduleNod(); });
  }
  pause() { this.paused = true; this._clearAll(); this.renderer.pause(); }
  resume() { if (!this.paused) return; this.paused = false; const s = this.state; this.state = null; this.setState(s); }
  pendingTimers() { return Object.values(this.timers).filter(Boolean).length; }
  destroy() { this._clearAll(); this.renderer.destroy(); this.renderer = { apply() {}, destroy() {}, pause() {}, setCharacter() {} }; }
}

// ---------- 목소리 (외모에 맞게 자동 선택 — 성별 맞는 목소리가 없으면 높낮이로 구분) ----------
const VOICE_MALE = /InJoon|Hyunsu|BongJin|GookMin|Minjun|male|남성|남자/i;
const VOICE_FEMALE = /SunHi|Heami|JiMin|SeoHyeon|SoonBok|YuJin|Yuna|Google|female|여성|여자/i;
function pickVoice(profile, voices, taken = []) {
  const ko = (voices || []).filter((v) => /^ko/i.test(v.lang || ""));
  if (!ko.length) return { voice: null, pitch: profile.pitch, rate: profile.rate, matched: false };
  const score = (v) => { let s = 0; const i = profile.prefer.findIndex((p) => v.name.includes(p)); if (i >= 0) s += 20 - i;
    const g = VOICE_MALE.test(v.name) ? "m" : VOICE_FEMALE.test(v.name) ? "f" : ""; if (g === profile.gender) s += 10; else if (g) s -= 10;
    if (/Natural|Online|Neural/i.test(v.name)) s += 3; if (taken.includes(v.name)) s -= 4; return s; };
  const best = [...ko].sort((a, b) => score(b) - score(a))[0];
  const g = VOICE_MALE.test(best.name) ? "m" : VOICE_FEMALE.test(best.name) ? "f" : "", matched = g === profile.gender;
  const pitch = matched ? profile.pitch : profile.gender === "m" ? Math.min(profile.pitch, 0.72) : Math.max(profile.pitch, 1.08);
  return { voice: best, pitch, rate: profile.rate, matched };
}
// 긴 글은 문장 단위로 끊어 읽는다 (크롬 온라인 목소리는 긴 글을 중간에 끊는 일이 있다)
function splitSpeech(text) {
  const out = String(text || "").split(/(?<=[.?!。])\s+/).map((s) => s.trim()).filter(Boolean);
  return out.length ? out : [""];
}

// ---------- 면접실: 1~2명, 번갈아 묻기, 누가 물었는지 ----------
class InterviewPanel {
  constructor(host) {
    this.members = []; this.turn = 0; this.utter = null; this.voices = []; this.sayToken = null;
    this.root = document.createElement("div"); this.root.className = "ivs";
    this.root.innerHTML = `<div class="ivs-cap"></div>`; host.appendChild(this.root);
    this.cap = this.root.querySelector(".ivs-cap");
    this._onVis = () => this.members.forEach((m) => (document.hidden ? m.pause() : m.resume()));
    document.addEventListener("visibilitychange", this._onVis);
    if ("speechSynthesis" in window) {

      speechSynthesis.addEventListener?.("voiceschanged", this._loadVoices); this._loadVoices();
    }
  }
  setInterviewers(ids) {          // 1~2명. 비어 있으면 4명 중 2명 무작위
    if (!ids || !ids.length) ids = Object.keys(CHARACTERS).sort(() => Math.random() - 0.5).slice(0, 2);
    ids = [...new Set(ids)].filter((id) => CHARACTERS[id]).slice(0, 2);
    this.stop(); this.members.forEach((m) => m.destroy());
    this.members = ids.map((id) => new Interviewer(id).mount(this.root));
    this.root.dataset.count = String(this.members.length);
    this.root.style.setProperty("--ivs-bg", `url("${masterUrl(ids[0])}")`);
    this.turn = 0; this._assignVoices(); this.caption("");
    return this.members.map((m) => m.id);
  }
  _assignVoices() { const taken = []; this.members.forEach((m) => { m.voice = pickVoice(IV_VOICE[m.id], this.voices, taken); if (m.voice.voice) taken.push(m.voice.voice.name); }); }
  caption(t, kind = "") { this.cap.textContent = t; this.cap.dataset.kind = kind; }
  all(s) { this.members.forEach((m) => { m.setState(s); m.renderer.apply({ asking: false }); }); }
  member(id) { return this.members.find((x) => x.id === id) || this.members[0]; }
  nextSpeaker() { const m = this.members[this.turn % this.members.length]; this.turn++; return m; }
  say(text, { by, cap } = {}) {   // → Promise<{ askedBy }>
    const m = by ? this.member(by) : this.nextSpeaker();
    if (!m) return Promise.resolve({ askedBy: null });
    this.stop();
    this.members.forEach((x) => { x.setState(x === m ? "speaking" : "listening"); x.renderer.apply({ asking: x === m }); });
    this.caption(`${m.character.label} · ${cap || "질문하는 중"}`, "speaking");
    const token = this.sayToken = {};
    return (async () => {
      for (const chunk of splitSpeech(text)) { if (this.sayToken !== token) break; await this._utter(chunk, m); }
      if (this.sayToken === token) { this.sayToken = null; m.setState("idle"); m.renderer.apply({ asking: false }); }

    })();
  }
  _utter(text, m) {

      let done = false, u = null;
      const fin = () => { if (done) return; done = true; clearTimeout(guard); if (this.utter === u) this.utter = null; resolve(); };
      const guard = setTimeout(fin, Math.max(3500, text.length * 190 + 2000));   // 끝 신호가 안 오는 경우 대비

        u.voice = m.voice?.voice || null; u.pitch = m.voice?.pitch ?? 1; u.rate = m.voice?.rate ?? 1;

      } catch (_) { fin(); }
    });
  }
  listen() { this.stop(); this.all("listening"); this.caption("듣고 있어요", "listening"); }
  idle() { this.stop(); this.all("idle"); this.caption(""); }
  end() { this.stop(); this.all("ending"); this.caption("수고했어요", "ending"); }
  stop() {
    this.sayToken = null;
    const u = this.utter; this.utter = null;
    if (u && "speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch (_) {} }
    this._fin?.(); this._fin = null;
  }
  destroy() { this.stop(); this.members.forEach((m) => m.destroy()); this.members = []; document.removeEventListener("visibilitychange", this._onVis);
    if (this._loadVoices) speechSynthesis.removeEventListener?.("voiceschanged", this._loadVoices); this.root.remove(); }
}

// ---------- 사건 (버튼·카드·받아쓰기) — 상태마다 next() 로 하나씩 받는다 ----------
const evq = []; let wake = null;
function emit(e) {
  if (aborted) return;
  if (ttsBusy && (e.type === "btn" || e.type === "card")) panel.stop();   // 누르면 읽던 말을 멈춘다
  evq.push(e); if (evq.length > 300) evq.splice(0, evq.length - 300);
  wake?.();
}
function next(ms) {      // 사건 하나 → 없이 ms 가 지나면 { type: "tick" }
  return new Promise((resolve, reject) => {
    let t = null;
    const take = () => {
      if (aborted) { clearTimeout(t); wake = null; reject(new Abort()); return true; }
      if (!evq.length) return false;
      clearTimeout(t); wake = null; resolve(evq.shift()); return true;
    };
    if (take()) return;
    wake = take;
    if (ms != null) t = setTimeout(() => { if (wake === take) wake = null; resolve({ type: "tick" }); }, Math.max(0, ms));
  });
}
const nextUntil = (until) => next((until - now()) * 1000 / FAST);   // 흐름 시계로 until 까지
function setPhase(name, keep = false) { phase = name; document.body.dataset.phase = name; if (!keep) evq.length = 0; }
const dropText = () => { for (let i = evq.length - 1; i >= 0; i--) if (evq[i].type === "text") evq.splice(i, 1); };
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-btn],[data-card]"); if (!b || b.disabled) return;
  if (b.dataset.btn) emit({ type: "btn", name: b.dataset.btn }); else emit({ type: "card", value: b.dataset.card });
});

// ---------- 명령어 — 상태마다 알아듣는 말을 제한 ----------
const CMDS = {
  end: ["면접종료", "면접끝", "종료", "그만하겠습니다", "그만할게요", "그만", "끝낼게요"],
  no: ["아니에요", "아니요", "아니오", "아뇨", "아니", "계속할게요", "이어서할게요", "이어서"],
  again: ["다시말해주세요", "다시들려주세요", "질문다시", "다시한번", "다시요", "다시", "한번더"],
  wait: ["잠시만기다려주세요", "잠시만요", "잠깐만요", "잠시만", "잠깐만", "잠깐"],
  next: ["다음질문", "다음이요", "다음요", "다음", "넘어갈게요", "넘어가요", "다했습니다", "다했어요", "이상입니다"],
  yes: ["면접시작", "시작하겠습니다", "시작할게요", "시작", "좋아요", "네", "예", "넵", "응"],
  random: ["상관없습니다", "상관없어요", "상관없", "아무나", "아무거나", "누구든", "누구나", "랜덤", "무작위", "알아서"]

const ALL_CMD = Object.values(CMDS).flat();
const norm = (t) => String(t || "").normalize("NFKC").toLowerCase().replace(/[\s.,?!~…'"“”‘’·\-()]/g, "");
// strict: 그 말만 따로 짧게 했을 때만 (명령어 ±2글자). 아니면 짧은 대답 안에 들어 있으면
function cmdOf(text, allowed, strict = true) {
  const n = norm(text); if (!n) return null;
  for (const k of ["end", "no", "again", "wait", "next", "yes", "random"]) {
    if (!allowed.includes(k)) continue;
    for (const s of CMDS[k]) if (n.includes(s) && n.length <= s.length + (strict ? 2 : 8)) return k;
  }
  return null;
}
const maybeCmd = (text) => { const n = norm(text); return !n || ALL_CMD.some((s) => s.startsWith(n) || (n.includes(s) && n.length <= s.length + 2)); };
// 면접관 고르기: "B 교수랑 D 교수", "비디", "삐 교수", "D" … → ["B","D"] / "아무나" → "random"
const PICK_SYN = { A: ["에이", "에이스", "애이", "a", "에"], B: ["비", "삐", "피", "b"], C: ["씨", "시", "쒸", "c"], D: ["디", "띠", "티", "뒤", "d"] };
function parsePick(text) {
  if (cmdOf(text, ["random"], false)) return "random";
  let s = String(text || "").normalize("NFKC").toLowerCase().replace(/[.,?!~…'"“”‘’·\-()]/g, " ");
  s = s.replace(/면접관님|면접관|교수님|교수|선생님|이랑요|이랑|그리고|하고요|하고|할게요|해\s?주세요|주세요|랑|님|와|과|으로|로|이요|요|및/g, " ");
  const find = (tok) => Object.keys(PICK_SYN).find((k) => PICK_SYN[k].includes(tok));
  const out = [];
  for (const tok of s.split(/\s+/).filter(Boolean)) {
    const one = find(tok);
    if (one) out.push(one);
    else if (tok.length === 2 && find(tok[0]) && find(tok[1])) out.push(find(tok[0]), find(tok[1]));
  }
  return [...new Set(out)].slice(0, 2);
}
function parseMin(text) {
  const n = norm(text); if (!n || n.length > 8) return 0;
  const m = /20|이십|스무/.test(n) ? 20 : /15|십오|열다섯/.test(n) ? 15 : /10|십|열/.test(n) ? 10 : 0;
  return CONFIG.planMin.includes(m) ? m : 0;
}

// ---------- 받아쓰기 — 면접관이 말하는 동안은 끈다 (스피커 소리를 되받지 않게) ----------
const stt = {
  on: false, paused: false, r: null, gen: 0, interim: "",
  start() { this.on = true; this._open(); },
  stop() { this.on = false; this._close(); },
  pause(flush) { if (flush) this.flush(); this.paused = true; this._close(); },
  resume() { this.paused = false; this._open(); },
  flush() { const t = this.interim.trim(); this.interim = ""; if (t) emit({ type: "text", text: t, final: true }); },
  _open() {
    if (!SR || !sttOk || !this.on || this.paused || this.r || aborted) return;
    const g = ++this.gen, r = new SR();
    r.lang = "ko-KR"; r.continuous = true; r.interimResults = true;
    r.onresult = (ev) => {
      if (g !== this.gen) return;
      let interim = "";
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const t = ev.results[i][0].transcript;
        if (ev.results[i].isFinal) { if (t.trim()) emit({ type: "text", text: t.trim(), final: true }); }
        else interim += t;
      }
      this.interim = interim;
      if (interim.trim()) emit({ type: "text", text: interim.trim(), final: false });
    };
    r.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") sttOk = false; };
    r.onend = () => { if (this.r === r) this.r = null; if (g === this.gen) setTimeout(() => this._open(), 60); };   // 크롬은 조용하면 스스로 끊는다 → 다시 켬
    try { r.start(); this.r = r; } catch (e) { console.warn("stt", e); }
  },
  _close() { const r = this.r; this.r = null; this.gen++; this.interim = ""; if (r) { try { r.stop(); } catch (_) {} } }
};

// ---------- 소리 크기 (침묵 판정) ----------
class Meter {
  constructor(s) {
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ac = new AC();
    const src = this.ac.createMediaStreamSource(s);
    this.an = this.ac.createAnalyser(); this.an.fftSize = 1024;
    src.connect(this.an);
    this.buf = new Float32Array(this.an.fftSize);
  }
  level() {
    this.an.getFloatTimeDomainData(this.buf);
    let s = 0; for (const v of this.buf) s += v * v;
    return Math.sqrt(s / this.buf.length);
  }
}
const pct = (arr, p) => { if (!arr.length) return 0; const a = [...arr].sort((x, y) => x - y); return a[Math.min(a.length - 1, Math.floor(a.length * p))]; };
let loudRun = 0, lastLoud = 0, frameSink = null, ttsBusy = false, ttsEnd = 0;
setInterval(() => {
  if (!meter) return;
  let loud = false;
  try { loud = !(ttsBusy || performance.now() - ttsEnd < 400) && meter.level() > threshold; } catch (_) {}
  loudRun = loud ? loudRun + 1 : 0;
  if (loud) lastLoud = performance.now();
  frameSink?.(loud);
}, 100);
const voiceOn = (ms = CONFIG.voiceOnMs) => loudRun * 100 >= ms;

// ---------- 면접관이 말하기 ----------
async function say(text, { by, cap } = {}) {
  if (aborted) throw new Abort();
  stt.pause(phase === "listen");        // 답변 중이면 받아쓰던 말은 답변에 넣고 끈다
  ttsBusy = true; document.body.dataset.tts = "1";
  let r = { askedBy: null };
  try { r = await panel.say(text, { by, cap }); }
  finally { ttsBusy = false; ttsEnd = performance.now(); document.body.dataset.tts = "0"; }
  if (aborted) throw new Abort();
  stt.resume();
  return r;
}

// ---------- 녹화 ----------
function pickMime() {
  const list = ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp8,opus", "video/webm"];
  return list.find((m) => window.MediaRecorder?.isTypeSupported?.(m)) || "";
}
function startRec() {
  if (!stream || !window.MediaRecorder) return null;
  const chunks = [], mime = pickMime();
  let mr;
  try { mr = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 1_500_000 } : undefined); }
  catch (e) { console.warn("recorder", e); return null; }
  const done = new Promise((ok) => {
    mr.ondataavailable = (e) => { if (e.data?.size) chunks.push(e.data); };
    mr.onstop = () => ok(chunks.length ? new Blob(chunks, { type: mr.mimeType || mime || "video/webm" }) : null);
  });
  try { mr.start(1000); } catch (e) { console.warn("recorder", e); return null; }
  recorders.add(mr); $("#self").classList.add("recording");
  return { mr, done };
}
async function stopRec(rec, keep, it, which) {
  if (!rec) return;
  try { if (rec.mr.state !== "inactive") rec.mr.stop(); } catch (_) {}
  recorders.delete(rec.mr); if (!recorders.size) $("#self")?.classList.remove("recording");
  const blob = await Promise.race([rec.done, sleepReal(4000).then(() => null)]);
  if (keep && blob) clips.push({ it, which, blob, url: URL.createObjectURL(blob), ext: /mp4/.test(blob.type) ? "mp4" : "webm" });
}

// ---------- AI 자리 (V1 은 이 컴퓨터에서만 계산 — V2 에서 이 묶음만 바꾼다) ----------
const ai = {
  nextFollowUp(q) { const fu = (q.followUps || []).filter(Boolean); return fu.length ? fu[Math.floor(Math.random() * fu.length)] : ""; },
  analyze(frames, text) {
    const first = frames.indexOf(true), last = frames.lastIndexOf(true);
    const out = { firstSec: null, speakSec: 0, pauses: 0, cpm: null, fillers: {} };
    if (first >= 0) {
      out.firstSec = Math.round(first / 10 * 10) / 10;
      out.speakSec = Math.round((last - first + 1) / 10);
      let run = 0;
      for (let i = first; i <= last; i++) { if (!frames[i]) run++; else { if (run >= 30) out.pauses++; run = 0; } }
    }
    const chars = text.replace(/[\s.,?!~'"…·\-()]/g, "").length;
    if (chars && out.speakSec >= 5) out.cpm = Math.round(chars / out.speakSec * 60);
    for (const w of text.split(/\s+/)) { const k = w.replace(/[.,?!~…]/g, ""); if (FILLERS.includes(k)) out.fillers[k] = (out.fillers[k] || 0) + 1; }
    return out;
  },
  report() { return null; }
};

async function sha256hex(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}

}

  } catch (e) {
    const n = e?.name || "";
    block(n === "NotAllowedError" || n === "SecurityError" ? "denied" : n === "NotFoundError" || n === "OverconstrainedError" ? "notfound"
      : n === "NotReadableError" ? "busy" : "camera", e?.message || n);
    return false;
  }
  $("#self").hidden = false;
  const v = $("#selfVid"); v.srcObject = stream; v.play?.().catch(() => {});
  try { meter = new Meter(stream); meter.ac.resume?.(); } catch (e) { console.warn("meter", e); }
  stream.getTracks().forEach((t) => t.addEventListener("ended", () => { if (!resetting && !aborted) block("device"); }));
  return true;
}

async function loadPool() {
  const p = ctx.profile;
  try {
    const [pq, bank, ivs] = await Promise.all([
      getDocs(collection(db, "students", p.studentNo, "personalQuestions")).then((s) => s.docs.map((d) => ({ id: d.id, ...d.data() }))).catch((e) => { console.warn(e); return []; }),
      cachedCollection("questions").catch((e) => { console.warn(e); return []; }),
      loadInterviewsFor(p.studentNo).catch(() => [])
    ]);
    const depts = ivs.map((u) => u.dept || "").filter(Boolean);
    const modes = recommendedModes(p);
    const relevant = (q) => !q.majors?.length || depts.some((d) => q.majors.some((m) => d.includes(m)));
    const personal = pq.filter((q) => q.text).map((q) => ({ ...q, source: "personal", type: "document" }));
    // 트랙에 맞는 질문을 먼저, 기본 인성 질문은 모자랄 때 채우는 용도 (제시문은 준비 10분이라 부스에서 뺌)
    const rank = (q) => {
      if (q.type === "document") return modes.includes("document") && relevant(q) ? 1 : 0;
      if (q.type === "personality") return modes.includes("personality") ? 1 : 2;
      if (q.type === "mmi") return (p.special || "").includes("MMI") ? 1 : 0;
      return 0;
    };
    const bankQ = bank.filter((q) => q.text && !q.passage).map((q) => ({ ...q, source: "bank", rank: rank(q) })).filter((q) => q.rank);
    pool = [...shuffle(personal), ...shuffle(bankQ.filter((q) => q.rank === 1)), ...shuffle(bankQ.filter((q) => q.rank === 2))];
  } catch (e) { showError(e, "질문 불러오기"); pool = []; }
}
function makeItem(q) {

    prepSec: 0, thinkSec: CONFIG.think, answerSec: Math.round(q.answerSec ?? t.answer),
    followUp: ai.nextFollowUp(q), prepMemo: "", answer: "", usedSec: 0, followAnswer: "", followUsedSec: 0, m: null, followM: null,
    askedBy: null, thinkUsedSec: 0
  };
}

async function sample(ms, onTick, onEvent) {
  const end = performance.now() + ms; let last = 0;
  while (performance.now() < end) {
    const e = await next(Math.max(10, Math.min(100, end - performance.now())));
    if (performance.now() - last >= 95) { last = performance.now(); onTick?.(); }
    if (e.type === "btn") return e.name;
    if (e.type === "text") { const r = onEvent?.(e); if (r) return r; }
  }
  return "time";
}

// ---------- 질문 루프 ----------
const leftSec = () => planSec - (now() - tStart);
async function runInterview(min) {
  planSec = min * 60; tStart = now();
  clearInterval(hdTimer); hdTimer = setInterval(drawHeader, 250); drawHeader();
  let reason = "";
  while (!reason) {
    if (items.length && leftSec() < CONFIG.minLeft) { reason = "time"; break; }
    const q = pool.shift();
    if (!q) { reason = "questions"; break; }
    const it = makeItem(q); items.push(it); it._t0 = now();
    it.askedBy = panel.nextSpeaker().id;                     // 두 명이면 질문마다 번갈아
    const r = await askPhase(it, "main", items.length === 1);
    if (r !== "done") { items.pop(); reason = r === "end" ? "asked" : "noreply"; break; }
    it.answered = true; saveProgress();
    if (it.followUp && leftSec() >= CONFIG.minLeft) {       // 꼬리질문도 남은 시간 안에서만, 본 질문을 한 사람이 묻는다
      it.followAskedBy = it.askedBy;
      const f = await askPhase(it, "follow");
      if (f !== "done") { clearFollow(it); reason = f === "end" ? "asked" : "noreply"; }
      saveProgress();
    } else it.followUp = "";
    it._t1 = now();
  }
  await finish(reason);
}
function clearFollow(it) { it.followUp = ""; it.followAnswer = ""; it.followUsedSec = 0; it.followM = null; delete it.followAskedBy; }

// 질문 하나(또는 꼬리질문): 읽기 → (생각) → 답변. '면접 종료' → 확인 → 아니요면 그 질문부터 다시 (영상은 이어 찍음)
async function askPhase(it, which, first = false) {
  const isF = which === "follow", by = isF ? it.followAskedBy : it.askedBy, text = isF ? it.followUp : it.text;
  let rec = null;
  while (true) {
    setPhase("ask"); renderAsk(it, which);
    await say(text, { by, cap: "질문하는 중" });
    dropText();
    if (!rec) rec = startRec();                              // 읽기가 끝난 순간부터 녹화 (생각 중 첫 마디도 담기게)
    stt.start();
    let r = isF ? { go: "listen" } : await thinkPhase(it, by, first);
    first = false;
    if (r?.go === "listen") r = await listenPhase(it, which, by, r.carry || [], !!r.started);
    if (r === "again") continue;
    if (r === "end") {
      const n = items.filter((x) => x.answered).length;
      const c = await confirmPhase({ by, n, qn: isF ? `꼬리질문 ${qNo(it)}` : `질문 ${qNo(it)}` });
      if (c === "yes") { await stopRec(rec, false); return "end"; }
      await say(SAY.resume, { by, cap: "이어서 하기" });
      continue;
    }
    if (r === "noreply") { await stopRec(rec, false); return "noreply"; }
    await stopRec(rec, true, it, which);
    return "done";
  }
}
function renderAsk(it, which) {
  const isF = which === "follow";
  side(`<div class="phase-l" id="phaseL">${isF ? "꼬리질문" : "질문"} ${qNo(it)}${!isF && it.source === "personal" ? " · 내 예상질문" : ""}</div>
    ${isF ? `<div class="qprev">앞 질문 — ${esc(it.text)}</div>` : ""}
    <div class="qtext" id="qtext">${esc(isF ? it.followUp : it.text)}</div>
    ${lstat("질문을 읽는 동안은 마이크를 잠시 꺼 둬요", false)}`);
}

async function thinkPhase(it, by, first) {
  setPhase("think", true);
  side(`<div class="phase-l" id="phaseL">질문 ${qNo(it)} · 생각할 시간</div>
    <div class="qtext sm">${esc(it.text)}</div>
    <div class="clock-row"><span class="clock" id="clock">${fmtSec(CONFIG.think)}</span><span class="clock-s">남음 · 말을 시작하면 바로 답변으로</span></div>
    <div class="track"><i id="trk"></i></div>
    ${sttOk ? `<div class="cmds"><div class="cmds-h">이렇게 말해도 돼요</div><div class="cmds-g">
      <div><b>“다시”</b><span>질문 다시 듣기</span></div>
      <div id="cmdWait" class="${it.thinkMore ? "used" : ""}"><b>“잠시만요”</b><span>${CONFIG.thinkMore}초 더 (한 번)</span></div>
      <div><b>“다음”</b><span>바로 답변</span></div></div></div>` : ""}`);
  panel.idle(); panel.caption("생각할 시간");
  if (first) { await say(SAY.think, { by, cap: "생각할 시간 안내" }); panel.caption("생각할 시간"); }
  const t0 = now(); let until = t0 + CONFIG.think;
  const fin = (v) => { it.thinkUsedSec = Math.round(now() - t0); return v; };
  while (true) {
    const left = until - now();
    const c1 = $("#clock"); if (c1) c1.textContent = fmtSec(Math.max(0, Math.ceil(left)));
    const tr = $("#trk"); if (tr) tr.style.width = Math.min(100, (now() - t0) / (until - t0) * 100) + "%";
    if (left <= 0) return fin({ go: "listen" });
    // 받아쓰기가 없으면 소리로, 있으면 받아쓴 말로 '말 시작'을 안다 (명령어와 헷갈리지 않게)
    if (!sttOk ? voiceOn() : voiceOn(2000)) return fin({ go: "listen", started: true });
    const e = await next(Math.min(100, left * 1000 / FAST));
    if (e.type === "btn") {
      if (e.name === "again") return fin("again");
      if (e.name === "next") return fin({ go: "listen" });
      if (e.name === "end") return fin("end");
    }
    if (e.type === "text") {
      const c = cmdOf(e.text, ["again", "wait", "next", "end"], true);
      if (c) {
        if (!e.final) continue;
        if (c === "again") return fin("again");
        if (c === "next") return fin({ go: "listen" });
        if (c === "end") return fin("end");
        if (c === "wait" && !it.thinkMore) {
          it.thinkMore = true; $("#cmdWait")?.classList.add("used");
          await say(SAY.thinkMore, { by, cap: "생각할 시간" }); panel.caption("생각할 시간");
          until = Math.max(until, now()) + CONFIG.thinkMore;
        }
        continue;
      }
      if (e.final || (norm(e.text).length >= 4 && !maybeCmd(e.text))) return fin({ go: "listen", started: true, carry: e.final ? [e.text] : [] });
    }
  }
}

async function listenPhase(it, which, by, carry, started) {
  const isF = which === "follow", text = isF ? it.followUp : it.text, limit = isF ? 60 : it.answerSec;
  setPhase("listen", true);
  side(`<div class="listen" style="display:contents">
    <div class="phase-l" id="phaseL">${isF ? "꼬리질문" : "질문"} ${qNo(it)} · 답변</div>
    <div class="qtext sm" id="qtext">${esc(text)}</div>
    <div id="hush" class="hush" hidden><b>더 하실 말씀이 없으면<br>“다음”이라고 말해 주세요</b>
      <div class="hush-n"><span id="hushN">${CONFIG.hushNext}</span><p>초 뒤 다음 질문으로 넘어가요.<br>이어서 말하면 그대로 계속 들어요.</p></div></div>
    <div class="clock-row"><span class="clock" id="clock">0:00</span><span class="clock-s">답변한 시간</span></div>
    <div id="ansTrack"><div class="track"><i id="trk"></i></div>
      <div class="track-l"><span>0:00</span><span>보통 ${fmtSec(limit)} 안팎</span><span>${fmtSec(CONFIG.answerMax)} 최대</span></div></div>
    ${sttOk ? `<div class="live" id="live"><div class="live-h" id="sttS"><i></i>받아쓰는 중</div><p id="liveT"></p></div>
      <p class="hint" id="lhint">다 말했으면 “다음”이라고 따로 짧게 말해 주세요. 문장 속 ‘다음’은 명령으로 듣지 않아요.</p>`
      : `<p class="hint" id="lhint">받아쓰기 없이 진행하고 있어요. 다 말했으면 <b>다음</b>을 눌러 주세요.</p>`}</div>`);
  panel.listen();
  const parts = [...carry], frames = [];
  frameSink = (b) => frames.push(b);
  const t0 = now();
  let first = started || parts.length > 0, lastSound = now(), quietFrom = now(), misses = 0, hush = null, seenLoud = lastLoud, out = "done", el = 0;
  const live = (interim = "") => { const p = $("#liveT"); if (p) { p.innerHTML = `<span style="color:inherit">${esc(parts.join(" "))}</span>${interim ? ` <span>${esc(interim)}</span>` : ""}`; p.scrollTop = p.scrollHeight; } };
  const hushOff = () => { hush = null; const h = $("#hush"); if (h) h.hidden = true; $(".listen")?.classList.remove("hushing"); $("#qtext")?.classList.remove("dim"); panel.listen(); };
  const sound = () => { first = true; lastSound = now(); if (hush) hushOff(); };
  const reread = async () => { if (hush) hushOff(); await say(text, { by, cap: "질문하는 중" }); panel.listen(); quietFrom = lastSound = now(); misses = 0; seenLoud = lastLoud; };
  live();
  try {
    while (true) {
      if (lastLoud > seenLoud) { seenLoud = lastLoud; if (first || voiceOn()) sound(); }
      el = now() - t0;
      const c1 = $("#clock"); if (c1) c1.textContent = fmtSec(el);
      const tr = $("#trk"); if (tr) tr.style.width = Math.min(100, el / CONFIG.answerMax * 100) + "%";
      if (el >= CONFIG.answerMax) break;
      if (!first) {
        if (now() - quietFrom >= CONFIG.preSilence) {
          if (++misses >= CONFIG.noReplyMax) { out = "noreply"; break; }
          await say(SAY.preSilence, { by, cap: "다시 들려드릴까요?" }); panel.listen();
          quietFrom = now(); seenLoud = lastLoud; continue;
        }
      } else if (!hush && now() - lastSound >= CONFIG.hushAsk) {
        const h = $("#hush"); if (h) h.hidden = false;
        $(".listen")?.classList.add("hushing"); $("#qtext")?.classList.add("dim");
        await say(SAY.hush, { by, cap: "더 하실 말씀 있나요?" });
        panel.all("listening"); panel.caption(`${label(by)} · 더 하실 말씀 있나요?`, "speaking");
        hush = { until: now() + CONFIG.hushNext }; seenLoud = lastLoud; lastSound = now();
        continue;
      } else if (hush) {
        const n = $("#hushN"); if (n) n.textContent = Math.max(0, Math.ceil(hush.until - now()));
        if (now() >= hush.until) break;
      }
      const e = await next(100);
      if (e.type === "btn") {
        if (e.name === "next") break;
        if (e.name === "end") { out = "end"; break; }
        if (e.name === "again") await reread();
        continue;
      }
      if (e.type === "text") {
        const c = cmdOf(e.text, first ? ["next", "end"] : ["next", "end", "again"], true);
        if (c) {
          if (!e.final) continue;
          if (c === "next") break;
          if (c === "end") { out = "end"; break; }
          if (c === "again") { await reread(); continue; }
        }
        if (e.final) parts.push(e.text);
        live(e.final ? "" : e.text); sound();
      }
    }
  } finally { frameSink = null; }
  if (out !== "done") return out;
  const used = Math.round(el);
  // 마지막 말이 받아쓰기에 들어올 시간을 조금 준다
  if (sttOk) { await sleepReal(700); if (aborted) throw new Abort(); }
  const isCmd = (t) => cmdOf(t, ["next", "end", "again"], true);
  for (const e of evq.splice(0)) if (e.type === "text" && e.final && !isCmd(e.text)) parts.push(e.text);
  const pend = stt.interim.trim(); stt.interim = "";
  if (pend && !isCmd(pend)) parts.push(pend);
  const answer = parts.join(" ").trim(), m = ai.analyze(frames, answer);
  if (isF) { it.followAnswer = answer; it.followUsedSec = used; it.followM = m; }
  else { it.answer = answer; it.usedSec = used; it.m = m; }
  return "done";
}

// ---------- '면접 종료' 확인 — "네" 또는 대답 없음 → 종료, "아니요"만 이어서 ----------
async function confirmPhase({ pre = false, by, n = 0, qn = "" }) {
  setPhase("confirm");
  const endText = pre || !n ? "처음 화면으로" : "여기까지 하고 결과 보기";
  side(`<div class="phase-l danger">면접 종료</div>
    <h1 class="ttl">${pre ? "처음 화면으로 돌아갈까요?" : "면접을 끝낼까요?"}</h1>
    <p class="sub">${pre ? "면접을 시작하기 전이라 저장되는 것은 없어요." : n ? `지금까지 답한 ${n}문항으로 결과를 보여 드려요.` : "아직 답한 질문이 없어서 저장하지 않고 처음 화면으로 돌아가요."}</p>
    <div class="ccards"><button type="button" class="ccard on" data-card="yes"><b>“네” 또는 대답 없음</b><span>${endText}</span></button>
      <button type="button" class="ccard" data-card="no"><b>“아니요”</b><span>${pre ? "이어서 하기" : `${esc(qn)}부터 이어서`}</span></button></div>
    <div class="cnt"><span class="cnum danger" id="cfN">${CONFIG.confirm}</span><p>초 뒤 ${pre ? "처음 화면으로 돌아가요" : "면접을 마쳐요"}.<br>이어서 하려면 “아니요”라고 말해 주세요.</p></div>`);
  stt.start();
  const ask = () => say(pre ? SAY.quit : SAY.confirm, { by, cap: "확인하는 중" });
  await ask();
  let until = now() + CONFIG.confirm;
  while (true) {
    const left = until - now();
    const c1 = $("#cfN"); if (c1) c1.textContent = Math.max(0, Math.ceil(left));
    if (left <= 0) return "yes";
    const e = await next(Math.min(100, left * 1000 / FAST));
    const c = e.type === "btn" ? (e.name === "again" ? "again" : "yes") : e.type === "card" ? e.value
      : e.type === "text" && e.final ? cmdOf(e.text, ["end", "no", "again", "next", "yes"], false) : null;
    if (c === "no") return "no";
    if (c === "yes" || c === "end" || c === "next") return "yes";
    if (c === "again") { await ask(); until = now() + CONFIG.confirm; }
  }
}
async function quitConfirm(by) {
  if ((await confirmPhase({ pre: true, by })) === "yes") { resetBooth(); throw new Abort(); }
}

// ---------- 마침 ----------
async function finish(reason) {
  endReason = reason; usedTotalSec = Math.round(now() - tStart);
  clearInterval(hdTimer); stt.stop();
  items.forEach((it) => { if (it._t1 == null) it._t1 = now(); });
  const answered = items.filter((it) => it.answered).length;
  const by = panel.members[0].id;
  setPhase("closing");
  if (reason === "noreply") {      // 학생이 자리를 떠난 것으로 본다 → 답한 게 있으면 제출하고 처음으로
    side(`<div class="grow"></div><h1 class="ttl">대답이 없어서 면접을 마칠게요</h1><p class="sub">${answered ? "지금까지 답한 내용은 선생님께 제출해요." : "답한 질문이 없어 저장하지 않아요."}</p><div class="grow"></div>`, false);
    await say(SAY.noreply, { by, cap: "마치는 중" });
    if (answered) { try { await submit(true, "noreply"); } catch (e) { console.warn(e); } }
    return resetBooth();
  }
  if (!answered) return resetBooth();
  side(`<div class="grow"></div><h1 class="ttl big">수고했어요</h1><p class="sub">결과를 준비하고 있어요…</p><div class="grow"></div>`, false);
  await say(SAY.bye[reason] || SAY.bye.asked, { by, cap: "인사하는 중" });
  panel.end(); await sleepV(1.2);
  showResults();
}

// 6. 결과 — 질문별 시간 · 영상 받아 가기 · 1분 뒤 자동 제출

function clipFor(it, which) { return clips.find((c) => c.it === it && c.which === which); }
function fileName(i, which) {
  const d = new Date(), ymd = `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
  return `면접부스_${ctx.profile.studentNo}_${ymd}_Q${i + 1}${which === "follow" ? "-꼬리" : ""}`;
}
function vidBlock(it, which) {
  const c = clipFor(it, which);
  if (!c) return `<div class="novid">녹화된 영상이 없어요</div>`;
  return `<video class="clip" src="${c.url}" controls playsinline preload="metadata"></video>
    <div class="dl"><button type="button" class="btn-sm" data-dl="${items.indexOf(it)}:${which}">이 영상 받기</button></div>`;
}
function chips(m, used, limit) {
  if (!m) return "";

  if (m.cpm != null) {

  else c.push(`<span class="${m.pauses >= 2 ? "note" : "good"}">3초 넘게 멈춤 ${m.pauses}번</span>`);
  topFillers(m.fillers).forEach(([w, n]) => c.push(`<span class="note">“${esc(w)}” ${n}번</span>`));
  return `<div class="chips-m">${c.join("")}</div>`;
}
function timeChart(done) {
  const rows = done.map((it) => {
    const th = it.thinkUsedSec || 0, a = it.usedSec || 0, f = it.followUsedSec || 0;
    const span = Math.max(th + a + f, (it._t1 ?? 0) - (it._t0 ?? 0));
    return { it, th, a, f, gap: Math.max(0, span - th - a - f), sum: th + a + f };
  });
  const total = Math.max(planSec, rows.reduce((s, r) => s + r.sum + r.gap, 0));
  const w = (v) => `${v / total * 100}%`;
  const bar = rows.map((r, i) => [
    r.th ? `<i class="s-think" style="width:${w(r.th)}"></i>` : "",
    `<i class="s-ans" style="width:${w(r.a)}">${r.a / total > 0.04 ? `Q${i + 1}` : ""}</i>`,
    r.f ? `<i class="s-fol" style="width:${w(r.f)}"></i>` : "",
    r.gap ? `<i class="s-gap" style="width:${w(r.gap)}"></i>` : ""].join("")).join("") + `<i class="s-rest" style="flex:1"></i>`;
  const maxSum = Math.max(1, ...rows.map((r) => r.sum)), longest = rows.length > 1 ? rows.findIndex((r) => r.sum === maxSum) : -1;
  const axis = [0, 1, 2, 3].map((k) => `<span>${fmtSec(total * k / 3)}</span>`).join("");
  const leftAtEnd = Math.max(0, planSec - usedTotalSec);
  const why = endReason === "time" ? `남은 시간 ${fmtSec(leftAtEnd)} — 다음 질문을 받기엔 부족해서 여기서 마쳤어요.`
    : endReason === "questions" ? "준비된 질문을 모두 해서 마쳤어요." : "‘면접 종료’로 여기서 마쳤어요.";
  const more = rows.map((r, i) => r.it.thinkMore ? `Q${i + 1}` : "").filter(Boolean);
  return `<section class="tchart"><div class="tchart-h"><h2>질문별로 쓴 시간</h2>
      <div class="legend"><span><i class="s-think"></i>생각</span><span><i class="s-ans"></i>답변</span><span><i class="s-fol"></i>꼬리질문 답변</span><span><i class="s-gap"></i>질문 읽기 등</span><span><i class="s-rest"></i>남은 시간</span></div></div>
    <div class="tbar">${bar}</div><div class="taxis">${axis}</div>
    <table class="ttable"><thead><tr><th>문항</th><th>질문</th><th>생각</th><th>답변</th><th>꼬리 답변</th><th>합계</th><th></th></tr></thead><tbody>
      ${rows.map((r, i) => `<tr><td class="n">Q${i + 1}</td><td class="q">${esc(r.it.text)}${i === longest ? `<span class="tag">가장 길게 씀</span>` : ""}</td>
        <td>${fmtSec(r.th)}</td><td>${fmtSec(r.a)}</td><td>${r.it.followUp ? fmtSec(r.f) : "–"}</td><td class="n">${fmtSec(r.sum)}</td>
        <td><div class="mini"><i style="width:${r.sum / maxSum * 100}%"></i></div></td></tr>`).join("")}
    </tbody></table>
    <p class="tnote">${why}${more.length ? ` ${more.join("·")} 의 생각 시간에는 “잠시만요” ${CONFIG.thinkMore}초가 들어 있어요.` : ""}</p></section>`;
}

  panel.end();
  side(`<div class="grow"></div><h1 class="ttl big">제출했어요</h1>
    <p class="sub">선생님이 피드백을 남기면 면접 스튜디오의 <b>피드백</b> 탭에서 볼 수 있어요.</p>
    ${clips.length ? `<p class="hint" style="color:var(--warn)">영상을 받았다면 다운로드 폴더에서 지웠는지 한 번 더 확인해 주세요.</p>` : ""}
    <div class="grow"></div><button type="button" class="btn-primary btn-lg blk-go" id="byeNow">마치기</button><p class="hint" id="byeT"></p>`, false);
  $("#byeNow").onclick = resetBooth;
  countdownThen("#byeT", CONFIG.doneBack, (s) => `${s}초 뒤 자동으로 로그아웃해요.`, resetBooth);
}

// =====================================================================
// 7. 막혔을 때 · 처음으로 · 대기 화면 새로고침
// =====================================================================
const BLOCK = {
  denied: ["카메라·마이크 사용이 막혀 있어요.", "주소창 왼쪽 아이콘에서 카메라·마이크 ‘허용’ → 새로고침. 윈도우 설정 → 개인 정보 → 카메라·마이크 → ‘데스크톱 앱 접근 허용’도 확인"],
  notfound: ["카메라나 마이크를 찾지 못했어요.", "카메라·마이크 선이 꽂혀 있는지 확인 → 새로고침"],
  busy: ["다른 프로그램이 카메라를 쓰고 있어요.", "화상 회의 같은 다른 프로그램을 닫고 → 새로고침"],
  camera: ["카메라·마이크를 켜지 못했어요.", "선이 꽂혀 있는지 확인 → 브라우저를 모두 닫았다가 다시 열기"],
  mic: ["마이크가 잡히지 않아요.", "마이크 선이 꽂혀 있는지 확인 → 주소창 왼쪽 아이콘에서 카메라·마이크 ‘허용’ → 새로고침"],
  device: ["카메라나 마이크 연결이 끊겼어요.", "선이 빠졌는지 확인 → 다시 꽂고 새로고침"],
  app: ["화면에 문제가 생겼어요.", "새로고침 → 계속되면 관리 선생님께 알려 주세요"]
};
async function block(kind, detail = "") {
  if (aborted || resetting) return;
  aborted = true; wake?.();
  try { panel.stop(); } catch (_) {}
  stt.stop(); clearInterval(hdTimer); frameSink = null;
  recorders.forEach((mr) => { try { mr.stop(); } catch (_) {} }); recorders.clear();
  $("#self")?.classList.remove("recording");
  document.body.dataset.phase = phase = "blocked";
  const [msg, help] = BLOCK[kind] || BLOCK.app;
  panel.idle(); panel.caption("잠깐 멈췄어요");
  side(`<div class="blk-i">${I_MICOFF}</div>
    <h1 class="ttl" id="blkMsg">${esc(msg)}<br>선생님께 알려 주세요.</h1>
    <div class="help"><b>선생님용 해결 방법</b><p>${esc(help)}</p>${detail ? `<p style="font-size:.78rem">${esc(String(detail).slice(0, 120))}</p>` : ""}</div>
    <p class="hint" id="blkSaved"></p>
    <div class="grow"></div>
    <div class="cnt"><span class="cnum" id="blkT">${fmtSec(CONFIG.blockedBack)}</span><p>뒤 로그아웃하고 처음 화면으로 돌아가요.<br>다음 학생이 바로 쓸 수 있어요.</p></div>
    <button type="button" class="btn-lg blk-go" id="blkGo">지금 처음으로</button>`, false);
  $("#blkGo").onclick = resetBooth;
  countdownThen("#blkT", CONFIG.blockedBack, (s, f) => f, resetBooth);
  // 면접 중이었으면 답한 데까지 제출 (한 문항도 없으면 저장하지 않음)
  if (items.some((it) => it.answered) && !finished) {
    endReason = "error"; usedTotalSec = Math.round(now() - tStart);
    try { if (await submit(true, "error")) { const s = $("#blkSaved"); if (s) s.textContent = "지금까지 답한 내용은 선생님께 제출했어요."; } } catch (e) { console.warn(e); }
  }
}

async function resetBooth() {
  if (resetting) return; resetting = true;
  aborted = true; wake?.();
  clearInterval(keepAlive); clearInterval(hdTimer);
  try { stt.stop(); } catch (_) {}
  try { panel.stop(); if ("speechSynthesis" in window) speechSynthesis.cancel(); } catch (_) {}
  recorders.forEach((mr) => { try { mr.stop(); } catch (_) {} });
  try { stream?.getTracks().forEach((t) => t.stop()); } catch (_) {}
  clips.forEach((c) => { try { URL.revokeObjectURL(c.url); } catch (_) {} });
  try { releaseVideos(); } catch (_) {}   // 미리 받은 면접관 영상도 메모리에서 비움
  try { await Promise.race([storeQ, sleepReal(4000)]); } catch (_) {}
  try { await signOut(auth); } catch (_) {}
  try { clearDataCache(); sessionStorage.clear(); localStorage.removeItem("keepLogin"); } catch (_) {}
  const keep = URLQ.get("fast");
  location.replace("booth.html" + (keep ? "?fast=" + encodeURIComponent(keep) : ""));
}

// 대기 화면에서 몇 시간마다 새로고침해 메모리·연결 문제를 비운다 (면접 중엔 안 함)
let lastInput = Date.now();
["pointerdown", "keydown"].forEach((ev) => document.addEventListener(ev, () => { lastInput = Date.now(); }, { capture: true, passive: true }));
setInterval(() => {
  if (phase === "login" && now() > CONFIG.reloadHours * 3600 && Date.now() - lastInput > 60000 && !$("#lid")?.value) location.reload();
}, 10000);

// ---------- 시작: 공용 PC이므로 들어올 때마다 남은 로그인을 지운다
const unsub = onAuthStateChanged(auth, async (u) => {
  unsub();
  if (u) { try { await signOut(auth); } catch (_) {} try { clearDataCache(); sessionStorage.clear(); } catch (_) {} }
  await loadManifest();                      // 면접관 사진·영상 목록
  if (!getKey()) return renderLocked();      // 등록하지 않은 기기 → 잠금 화면만
  if (!SR) toast("이 브라우저는 받아쓰기를 지원하지 않아요. 크롬이나 엣지로 열어 주세요.", "error", 8000);
  renderLogin();
});
</script>
