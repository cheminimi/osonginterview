<script>
/* 새 버전 확인 (수정 금지 · 모든 화면 공통)
   GitHub Pages는 파일을 10분간 캐시해서, 업데이트 직후 옛 파일과 새 파일이 섞이면 화면이 멈출 수 있다.
   화면 코드를 실행하기 전에 쓰는 파일을 서버에 한 번씩 확인(재검증)해 항상 같은 버전으로 맞추고,
   열어 둔 화면은 10분마다 확인해 새 버전이 올라오면 새로고침 안내를 띄운다.
   index.html?reset=1 → 이 사이트에 저장된 데이터(로그인 포함)를 지우고 처음부터 다시 연다. */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("reset")) {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    var jobs = [];
    try { if (window.indexedDB) jobs.push(new Promise(function (ok) { var r = indexedDB.deleteDatabase("firebaseLocalStorageDb"); r.onsuccess = r.onerror = r.onblocked = function () { ok(); }; })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(function () { location.replace(location.pathname + "?resetdone=1"); });
    return;
  }
  var RX = /(?:import|export)\s[^;]*?from\s*["'](\.\/[^"']+)["']|import\(\s*["'](\.\/[^"']+)["']\s*\)/g;
  function deps(text) { var out = [], m; RX.lastIndex = 0; while ((m = RX.exec(text))) out.push(m[1] || m[2]); return out; }
  // 느린 네트워크·응답 없는 서버에서 화면 준비가 영영 끝나지 않는 것을 막는다
  function fetchT(url, ms) {
    var ctl = null;
    try { if (window.AbortController) ctl = new AbortController(); } catch (e) {}
    return new Promise(function (ok, no) {
      var settled = false;
      var t = setTimeout(function () {
        if (settled) return; settled = true;
        try { if (ctl) ctl.abort(); } catch (e) {}
        no(new Error("시간 초과: " + url));
      }, ms);
      var opt = { cache: "no-cache" };
      if (ctl) opt.signal = ctl.signal;
      fetch(url, opt).then(function (r) { if (settled) return; settled = true; clearTimeout(t); ok(r); },
        function (e) { if (settled) return; settled = true; clearTimeout(t); no(e); });
    });
  }
  function check(files, seen, sig) {
    files = files.filter(function (f) { if (seen[f]) return false; seen[f] = 1; return true; });
    if (!files.length) return Promise.resolve();
    return Promise.all(files.map(function (f) {
      return fetchT(f, 8000).then(function (r) {
        sig[f] = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return /\.js$/.test(f) ? r.text().then(deps) : [];
      }).catch(function () { return []; });
    })).then(function (lists) { return check([].concat.apply([], lists), seen, sig); });
  }
  // 화면 코드가 오류로 멈추면 안내 (하얀 화면·눌리지 않는 화면 방지)
  var failShown = false;
  function failBar(msg) {
    if (failShown) return; failShown = true;
    var lock = document.querySelector(".login.loading");
    if (lock) lock.classList.remove("loading");   // 로그인 화면은 일단 쓸 수 있게
    var sub = document.getElementById("submit"); if (sub) sub.disabled = false;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#c2453c;color:#fff;padding:10px 14px;font-size:.92rem;line-height:1.5";
    d.innerHTML = '화면을 제대로 불러오지 못했어요. <b>새로고침</b>해 보고, 그래도 같으면 <a href="index.html?reset=1" style="color:#fff">여기를 눌러 초기화</a>하세요.<br><span style="opacity:.85;font-size:.85rem"></span>';
    var text = String(msg || "");
    if (/gstatic|googleapis|firebase/i.test(text) || blockedFirebase) {
      d.querySelector("b").insertAdjacentHTML("afterend", " · 브라우저 확장 프로그램(광고 차단 등)이나 보안 프로그램이 firebase 파일을 막고 있을 수 있어요.");
    }
    d.querySelector("span").textContent = text.slice(0, 140);
    (document.body || document.documentElement).appendChild(d);
  }
  // Firebase 파일을 받을 수 있는지 미리 확인 (확장 프로그램·보안 프로그램 차단 진단용)
  var blockedFirebase = false;
  try {
    fetch("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js", { method: "GET", mode: "no-cors" })
      .catch(function () { blockedFirebase = true; });
  } catch (e) { blockedFirebase = true; }
  addEventListener("error", function (e) { if (e && (e.message || e.error)) failBar(e.message || e.error); }, true);
  addEventListener("unhandledrejection", function (e) { failBar(e.reason && (e.reason.message || e.reason)); });
  function sigText(sig) { return Object.keys(sig).sort().map(function (k) { return k + "=" + sig[k]; }).join("|"); }
  function banner() {
    if (document.getElementById("newVersionBar")) return;
    var d = document.createElement("div");
    d.id = "newVersionBar";
    d.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#24262a;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.92rem;max-width:92vw";
    d.innerHTML = '<span>새 버전이 올라왔어요. 저장할 내용이 있으면 먼저 저장하세요.</span><button type="button" style="background:#fff;color:#24262a;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap">새로고침</button>';
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  function start() {
    var mains = [].slice.call(document.querySelectorAll('script[type="app-module"]'));
    var page = location.pathname.split("/").pop() || "index.html";
    var initial = ["style.css", page];
    mains.forEach(function (s) { initial = initial.concat(deps(s.textContent)); });
    var sig = {}, done = false;
    function go() {
      if (done) return; done = true;
      var first = sigText(sig);
      // 화면(HTML) 자체가 옛 버전이면 한 번만 새로 불러온다
      fetchT(page, 6000).then(function (r) { return r.text(); }).then(function (html) {
        var cur = mains.map(function (s) { return s.textContent.trim(); }).join("\n");
        var key = "reloadedFor:" + page;
        if (cur && html.indexOf(cur) < 0 && sessionStorage.getItem(key) !== sig[page]) {
          sessionStorage.setItem(key, sig[page] || "1");
          location.reload();
          return true;
        }
      }).catch(function () {}).then(function (reloading) {
        if (reloading) return;
        // 앱 파일이 바뀌면 이 기기에 저장해 둔 화면용 데이터를 비운다 (옛 형식이 남아 생기는 오류 방지)
        try {
          var sigKey = "appSig:" + page, prevSig = localStorage.getItem(sigKey);
          if (prevSig && prevSig !== first) {   // 이 화면이 업데이트됐을 때만 정리
            [localStorage, sessionStorage].forEach(function (st) {
              Object.keys(st).filter(function (k) { return k.indexOf("c1:") === 0; }).forEach(function (k) { st.removeItem(k); });
            });
          }
          if (prevSig !== first) localStorage.setItem(sigKey, first);
        } catch (e) {}
        var css = document.querySelector('link[rel="stylesheet"][href^="style.css"]');
        if (css && sig["style.css"]) css.href = "style.css?v=" + encodeURIComponent(sig["style.css"]).replace(/%/g, "");
        mains.forEach(function (old) { var s = document.createElement("script"); s.type = "module"; s.textContent = old.textContent; old.replaceWith(s); });
        setInterval(function () {
          if (document.visibilityState !== "visible" || document.getElementById("newVersionBar")) return;
          var s2 = {};
          check(initial, {}, s2).then(function () { if (Object.keys(s2).length && sigText(s2) !== first) banner(); });
        }, 10 * 60 * 1000);
      });
    }
    check(initial, {}, sig).then(go, go);
    setTimeout(go, 5000);
    // 10초가 지나도 화면이 비어 있으면 안내
    setTimeout(function () {
      var m = document.querySelector("main");
      var filled = m && m.querySelector(".card, .q-item, table, .stage, .mode, #app > *");
      if (m && !filled) failBar("화면 내용을 불러오지 못했습니다.");
    }, 10000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>

<body class="nd">

<nav class="tabbar" id="tabs" hidden></nav>

<main class="wrap" id="main" hidden>
  <div class="apphead"><div class="ah-tx"><b id="ahTitle"></b><span id="ahSub"></span></div><div class="ah-pill" id="ahPill"></div><div class="row" id="acct"></div></div>

      <div id="mine"></div>
    </div>

</main>

<div class="modal-bg" id="modal" hidden><div class="modal">

  <div id="mBody"></div>
</div></div>

<script type="app-module">
import {
  db, requireRole, mountAccountMenu, collection, doc, setDoc, getDocs, query, where, onSnapshot, esc, $, $$, toast, showError, loadInterviewsFor, cachedCollection,
  CRITERIA, STAGES, TYPES, fmtDate, fmtDay, typeBadge, dday, nextInterview, recommendedModes, icon, isoDay, initials,
  railHead, railFoot, tabButton, wireRailMe, setHead, writeBatch, serverTimestamp, confirmBox, pqStats, isStudentPq
} from "./common.js";
import { mountSchedule, BOOK_STAGES, stageTeachers, ACTIVE, DONE, STATUS } from "./schedule.js";
import { isBoothSession, boothViewHtml, aiReportState, replaceAiReport } from "./booth-view.js";
import { registerSW, mountInstallTip, showInstallTipAgain, isStandalone } from "./pwa.js";
import { pushState, pushOn, enablePush, disablePush, refreshPush, wasAsked, markAsked, onPushOpen } from "./push.js";

const ctx = await requireRole("student");
const { user, profile: me } = ctx;

let personal = [], bank = [], sessions = [], meetings = [], reviews = [];
try {
  // 연습 기록·대면 피드백은 아래 실시간 구독이 처음 한 번 읽어 온다 (중복 읽기 없음)
  const [pq, qb, iv, rv] = await Promise.all([
    getDocs(collection(db, "students", me.studentNo, "personalQuestions")),
    cachedCollection("questions"),   // 질문은행: 바뀌었을 때만 서버에서 받음
    loadInterviewsFor(me.studentNo),
    getDocs(query(collection(db, "reviews"), where("studentNo", "==", String(me.studentNo))))
  ]);
  me.universities = iv;
  const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  personal = rows(pq); bank = qb; reviews = rows(rv);
} catch (e) { showError(e, "데이터 불러오기"); }
$("#main").hidden = false;
$("#tabs").hidden = false;

// ---- 계정 메뉴 (오른쪽 위 동그라미)
const teacherLine = BOOK_STAGES.map((sg) => { const t = stageTeachers(me, sg.key); return t.length ? `${sg.short} ${t.join("·")}` : ""; }).filter(Boolean).join(", ");
// 알림 상태가 바뀌면 메뉴 글씨도 같이 바뀌어야 해서 다시 그릴 수 있게 함수로 둔다
function mountMenu() {
  mountAccountMenu(ctx, $("#acct"), {
    subtitle: `${me.studentNo}${me.track ? " · " + me.track : ""}`,
    items: [
      teacherLine ? { icon: "user", label: "내 담당 선생님", desc: teacherLine, info: true } : null,
      me.sheetUrl ? { icon: "sheet", label: "내 준비 시트 열기", href: me.sheetUrl } : null,
      { icon: "chat", label: pushOn() ? "휴대폰 알림 끄기" : "휴대폰 알림 켜기",
        desc: pushOn() ? "일정 확정·피드백을 휴대폰으로 받고 있어요" : "일정이 확정되면 휴대폰으로 알려드려요",
        id: "pushToggle", onClick: () => togglePush() },
      isStandalone() ? null : { icon: "phone", label: "홈 화면에 앱으로 추가", onClick: () => { switchTab("home"); showInstallTipAgain($("#pwaTip")); } }
    ]
  });
}
mountMenu();

// ---- 휴대폰 알림
async function togglePush() {
  if (pushOn()) { await disablePush(); mountMenu(); return; }
  const st = pushState();
  if (!st.can) {
    toast(st.why, "error", 10000);
    if (st.needInstall) { switchTab("home"); showInstallTipAgain($("#pwaTip")); }
    return;
  }
  await enablePush(ctx);
  mountMenu();
}
// 이미 켜 둔 사람은 조용히 토큰만 갱신 (권한을 다시 묻지 않음) → 끝나면 메뉴 글씨도 맞춘다
refreshPush(ctx).then(mountMenu, mountMenu);
// 알림을 눌러서 들어오면 해당 탭으로
onPushOpen((url) => {
  if (/feedback/.test(url)) switchTab("feedback");
  else if (/schedule/.test(url)) switchTab("schedule");
  else switchTab("home");
});

// ---- 연습 모드
const relevant = (q) => !q.majors?.length || (me.universities || []).some((u) => q.majors.some((m) => (u.dept || "").includes(m)));
const rec = recommendedModes(me);
const modes = [
  { mode: "personal", title: "내 생기부 면접", desc: "선생님이 준비한 질문과 내가 만든 질문", n: personal.length, badge: "document" },
  { mode: "document", title: "학생부 공통 질문", desc: "지원동기·학업계획·활동 질문", n: bank.filter((q) => q.type === "document" && relevant(q)).length, badge: "document" },
  { mode: "passage", title: "제시문 면접", desc: "준비시간 동안 제시문 읽고 답변", n: bank.filter((q) => q.type === "passage").length, badge: "passage" },
  { mode: "personality", title: "기본 인성 · MMI", desc: "가치관·경험·상황 판단 질문", n: bank.filter((q) => q.type === "personality" || q.type === "mmi").length, badge: "personality" }
].sort((a, b) => (rec.includes(b.mode) ? 1 : 0) - (rec.includes(a.mode) ? 1 : 0));
const MODE_IC = { personal: "note", document: "book", passage: "list", personality: "heart" };
const secTxt = (n) => n >= 60 && n % 60 === 0 ? `${n / 60}분` : `${n}초`;
const MODE_TIME = {
  personal: `답변 ${secTxt(TYPES.document.answer)}씩`, document: `답변 ${secTxt(TYPES.document.answer)}씩`,
  passage: `준비 ${secTxt(TYPES.passage.prep)} · 답변 ${secTxt(TYPES.passage.answer)}`,
  personality: `답변 ${secTxt(TYPES.personality.answer)} · MMI 준비 ${secTxt(TYPES.mmi.prep)}`
};
// 선생님이 넣은 예상질문 (학생이 만든 것 제외)
const teacherPq = () => personal.filter((q) => !isStudentPq(q));
let featMode = "";
function renderModes() {
modes.find((m) => m.mode === "personal").n = personal.length;
featMode = (modes.find((m) => m.mode === "personal" && m.n) || modes.find((m) => m.n))?.mode;
$("#modes").innerHTML = [...modes].sort((a, b) => (b.mode === featMode) - (a.mode === featMode)).map((m) => `
  <button type="button" class="mode ${m.mode === featMode ? "feat" : ""} ${m.n ? "" : "dim disabled"}" data-mode="${m.mode}" ${m.n ? "" : "disabled"}>
    <span class="mi2">${icon(MODE_IC[m.mode], 20)}</span>
    ${m.mode === "personal" && teacherPq().length ? '<span class="by">선생님이 준비</span>' : rec.includes(m.mode) ? '<span class="by">내 트랙 추천</span>' : ""}
    <h4>${m.title}</h4><p>${m.desc}</p>
    <span class="tm">${m.n ? MODE_TIME[m.mode] : "아직 질문이 없어요"}</span>
    <span class="mf"><span class="cnt">${m.n}<small>문항</small></span><span class="sp"></span><span class="go2">${icon("arrow", 16)}</span></span>
  </button>`).join("");
$$("#modes .mode").forEach((el) => el.onclick = () => location.href = `interview.html?mode=${el.dataset.mode}`);
}
renderModes();

// 연습 탭 아래 줄: 내 예상질문 · 지난 연습 기록 (같은 탭 안 하위 화면) + AI 연습 (앱 밖)
// 바깥 주소는 관리자가 config/schedule 의 aiUrl 로 바꿀 수 있다. 비어 있으면 아래 기본값.
// aiUrl 을 "off" 로 적어 두면 줄이 사라진다 (사이트가 죽었을 때 배포 없이 끌 수 있게).
const AI_URL_DEFAULT = "https://aico-six.vercel.app/";
let aiUrl = AI_URL_DEFAULT;
function safeHttp(u, fb) {
  try { const x = new URL(String(u)); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : fb; }
  catch (_) { return fb; }
}
function applyAiUrl(v) {
  const next = !v ? AI_URL_DEFAULT : (v === "off" ? "" : safeHttp(v, AI_URL_DEFAULT));
  if (next === aiUrl) return;
  aiUrl = next;
  renderPracLinks();
}
function renderPracLinks() {
  const rows = [
    { sub: "mine", ic: "list", t: "내 예상질문", d: personal.length ? `${personal.length}개 · 실전 연습 전엔 꼬리질문을 가려 둬요` : "아직 올라온 질문이 없어요" },
    { sub: "hist", ic: "history", t: "지난 연습 기록", d: sessions.length ? `${sessions.length}회${sessions[0]?.startedAt ? " · 마지막 " + fmtDay(sessions[0].startedAt) : ""}` : "아직 연습 기록이 없어요" }
  ].map((x) => `<button type="button" class="list-row lrow" data-sub="${x.sub}">
      <span class="r-ic li">${icon(x.ic, 19)}</span>
      <span class="r-tx"><b>${x.t}</b><span class="muted">${x.d}</span></span>
      <span class="r-end">${icon("chevron", 18)}</span></button>`);

// 차수별 진행 상태 (여정 · 할 일이 같이 씀)
function stageStates() {
  return BOOK_STAGES.map((sg) => {
    const done = meetings.find((m) => Number(m.stage) === sg.key);
    const all = (bookings || []).filter((b) => b.stage === sg.key && ACTIVE(b.status))
      .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
    const bk = all.find((b) => !DONE(b));       // 아직 안 본 면접
    const bkDone = all.find((b) => DONE(b));    // 선생님이 완료 처리한 면접
    const teachers = stageTeachers(me, sg.key);
    if (done) return { sg, teachers, cls: "done", label: `완료 · ${fmtDay(done.date).replace(/\(.\)$/, "")}` };
    if (bkDone && !bk) return { sg, teachers, cls: "done", label: `완료 · ${fmtDay(bkDone.date).replace(/\(.\)$/, "")}` };
    if (bk) {
      const n = dday(bk.date);
      return { sg, teachers, cls: "now", label: `${fmtDay(bk.date)} ${bk.status === "confirmed" ? "예정" : "요청 중"}${n === 0 ? " · 오늘" : n === 1 ? " · 내일" : ""}` };
    }
    return { sg, teachers, cls: "", label: teachers.length ? "아직 신청 전" : "선생님 미배정" };
  });
}

// 후기 알림 띠 — 안 쓴 후기가 있을 때만 (컴퓨터·휴대폰 공통, 인사말 바로 아래)
function bandHtml() {
  const u = nudgeReviews()[0];
  if (!u) return "";
  const dt = new Date(String(u.date).replace(/-/g, "/"));
  const gap = Math.round((new Date(isoDay()).getTime() - dt.getTime()) / 86400000);
  const when = gap <= 1 ? "어제" : `${dt.getMonth() + 1}/${dt.getDate()}`;
  return `<div class="band rv-call">
    <span class="bi">${icon("pen", 19)}</span>
    <div class="bt"><b>${when} ${esc(u.univ || "")} 면접, 어땠나요?</b>
      <small>${WIDE.matches ? "받은 질문과 느낀 점을 적어 두면 선생님이 다음 준비를 도와줄 수 있어요. 5분이면 됩니다." : "기억날 때 적어 두면 좋아요 · 5분"}</small></div>
    <div class="acts"><button type="button" class="go2" data-rv="${esc(u.id)}">후기 쓰기 →</button>
      <button type="button" class="later" data-rvlater="${esc(u.id)}">나중에</button></div></div>`;
}

// 지원 대학 오른쪽 끝 (D-day / 후기 쓰기 / 후기 작성함)
function uniEnd(u, withDate) {
  const today = isoDay();
  const past = u.date && isoDay(u.date) < today;
  const d = dday(u.date);
  if (reviewOf(u)) return `<button type="button" class="uem ok" data-rv="${esc(u.id)}" title="후기 다시 보기">후기 작성함</button>`;
  if (past) return `<button type="button" class="uem rv" data-rv="${esc(u.id)}">후기 쓰기</button>`;
  if (d == null) return "";
  const dl = d === 0 ? "D-DAY" : "D-" + d;
  const dt = toDateSafe(u.date);
  return `<em class="uem ${d <= 7 ? "hot" : ""}">${dl}${withDate && dt ? ` · ${dt.getMonth() + 1}/${dt.getDate()}` : ""}</em>`;
}

  $$("#feedback [data-sid]").forEach((el) => el.onclick = () => openSession(sessions.find((x) => x.id === el.dataset.sid)));
}
function toDateSafe(v) { const m = String(v || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }

// ---- 연습 기록
function avgScore(s) {
  const sc = s.teacherFeedback?.scores; if (!sc || !s.reviewedAt) return null;
  const v = CRITERIA.map((c) => sc[c.key]).filter((x) => typeof x === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function renderHistory() {
  if (!sessions.length) { $("#history").innerHTML = `<div class="card empty">아직 연습 기록이 없어요. 위에서 말하기 연습을 시작해 보세요.</div>`; return; }
  $("#history").innerHTML = `<div class="card table-wrap"><table>
    <thead><tr><th>날짜</th><th>유형</th><th>문항</th><th>상태</th><th>점수</th></tr></thead>
    <tbody>${sessions.map((s) => {
      const st = s.status !== "submitted" ? `<span class="badge badge-gray">미완료</span>`
        : s.reviewedAt ? `<span class="badge badge-green">피드백 도착</span>` : `<span class="badge badge-orange">검토 대기</span>`;
      const avg = avgScore(s);
      return `<tr class="clickable" data-id="${s.id}"><td>${fmtDate(s.startedAt)}</td><td>${esc(s.modeLabel || s.mode)}</td>
        <td>${(s.items || []).filter((i) => i.answer).length}/${(s.items || []).length}</td><td>${st}</td><td>${avg != null ? avg.toFixed(1) : "-"}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  $$("#history tr[data-id]").forEach((tr) => tr.onclick = () => openSession(sessions.find((s) => s.id === tr.dataset.id)));
}
renderHistory();
renderFeedback();
homeReady = true; renderHome();

// 열려 있는 기록 (부스 기록의 AI 피드백이 실시간으로 오면 그 자리만 바꾸려고)
let openSid = null;

// ---- 새로고침 없이 피드백 반영 (선생님이 공개하면 바로 뜸)
{
  let firstS = true, firstM = true;
  const notify = () => toast("선생님 피드백이 도착했어요. 아래 '피드백' 탭을 확인하세요.", "ok", 6000);
  onSnapshot(query(collection(db, "sessions"), where("studentUid", "==", user.uid)), (snap) => {
    const before = new Set(sessions.filter((x) => x.reviewedAt).map((x) => x.id));
    sessions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.startedAt?.seconds || 0) - (a.startedAt?.seconds || 0));
    if (!firstS && sessions.some((x) => x.reviewedAt && !before.has(x.id))) notify();
    firstS = false; renderHistory(); renderFeedback(); renderPracLinks(); renderHome();
    // 열려 있는 부스 기록의 AI 피드백이 준비 중 → 완료로 바뀌면 그 상자만 다시 그림
    const cur = openSid && !$("#modal").hidden ? sessions.find((x) => x.id === openSid) : null;
    if (cur && isBoothSession(cur)) {
      const box = $("#bvAi");
      if (box && (box.dataset.st || "") !== aiReportState(cur)) replaceAiReport($("#mBody"), cur);
    }
  }, (e) => console.warn("연습 피드백 실시간", e));
  onSnapshot(query(collection(db, "meetings"), where("studentUid", "==", user.uid), where("shared", "==", true)), (snap) => {
    const before = new Set(meetings.map((x) => x.id));
    meetings = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    if (!firstM && meetings.some((x) => !before.has(x.id))) notify();
    firstM = false; renderFeedback(); renderHome();
  }, (e) => console.warn("대면 피드백 실시간", e));
}

function openSession(s) {
  if (!s) return;
  openSid = s.id;
  $("#mTitle").textContent = `${s.modeLabel || s.mode} · ${fmtDate(s.startedAt)}`;
  const fb = s.reviewedAt ? (s.teacherFeedback || {}) : {};
  const scores = fb.scores ? `<div class="grid grid-4" style="margin:6px 0 4px">${CRITERIA.map((c) =>
      `<div><div class="muted">${c.label}</div><div class="stat">${fb.scores[c.key] ?? "-"}<span class="muted">/5</span></div></div>`).join("")}</div>` : "";
  $("#modal .modal").classList.toggle("bv-wide", isBoothSession(s));
  if (isBoothSession(s)) {
    // 면접 부스 기록: 부스 결과 화면과 같은 내용(영상 제외). 선생님 피드백은 맨 위, 문항별 선생님 코멘트는 각 문항 카드 맨 아래
    const top = s.reviewedAt
      ? `<div class="fb-box" style="margin:0"><h3>선생님 피드백</h3>${scores}${fb.comment ? `<div class="pre">${esc(fb.comment)}</div>` : ""}</div>
        ${s.aiFeedback ? `<div class="fb-box" style="margin:0;background:#f8f5ff;border-color:#e6dcfb"><h3>선생님이 보낸 AI 피드백</h3><div class="pre">${esc(s.aiFeedback)}</div></div>` : ""}`
      : `<div class="bv-status"><span class="badge ${s.status === "submitted" ? "badge-orange" : "badge-gray"}">${s.status === "submitted" ? "선생님 검토 대기" : "완료되지 않은 기록"}</span></div>`;
    $("#mBody").innerHTML = boothViewHtml(s, {
      top,
      itemExtra: (i) => fb.itemComments?.[i] ? `<div class="bv-tc"><div class="fb-box"><b>선생님</b> <span class="pre">${esc(fb.itemComments[i])}</span></div></div>` : ""
    });
    $("#modal").hidden = false;
    return;
  }
  $("#mBody").innerHTML = `
    ${s.reviewedAt ? `<div class="fb-box"><h3>선생님 피드백</h3>${scores}${fb.comment ? `<div class="pre">${esc(fb.comment)}</div>` : ""}</div>` : `<p class="muted">${s.status === "submitted" ? "선생님 검토를 기다리는 중이에요." : "완료되지 않은 연습입니다."}</p>`}
    ${s.reviewedAt && s.aiFeedback ? `<div class="fb-box" style="background:#f8f5ff;border-color:#e6dcfb"><h3>AI 피드백</h3><div class="pre">${esc(s.aiFeedback)}</div></div>` : ""}
    ${(s.items || []).map((it, i) => `
      <div class="q-item" style="margin-top:12px">
        <div class="row">${typeBadge(it.type)} <span class="muted">Q${i + 1} · ${it.usedSec ?? 0}초 사용 / 제한 ${it.answerSec}초</span></div>
        <div class="q-text pre" style="margin-top:6px">${esc(it.text)}</div>
        <div class="ans">${esc(it.answer) || '<span class="muted">(답변 없음)</span>'}</div>
        ${it.followUp ? `<div style="margin-top:8px"><b>꼬리질문</b> ${esc(it.followUp)}</div><div class="ans">${esc(it.followAnswer) || '<span class="muted">(답변 없음)</span>'}</div>` : ""}
        ${fb.itemComments?.[i] ? `<div class="fb-box"><b>선생님</b> <span class="pre">${esc(fb.itemComments[i])}</span></div>` : ""}
      </div>`).join("")}
    ${s.reflection ? `<div class="q-item" style="margin-top:12px"><b>나의 돌아보기</b><div class="pre muted">잘한 점: ${esc(s.reflection.good)}\n아쉬운 점: ${esc(s.reflection.improve)}</div></div>` : ""}`;
  $("#modal").hidden = false;
}
const closeSession = () => { $("#modal").hidden = true; openSid = null; };
$("#mClose").onclick = closeSession;
$("#modal").onclick = (e) => { if (e.target.id === "modal") closeSession(); };

// ---- 내 예상질문 (선생님이 준비 + 내가 만든 질문). 내가 만든 질문은 검토 전(reviewedAt 없음)에만 고치기·지우기
let pqFilter = "all";
const pqLocked = (q) => !isStudentPq(q) || !!q.reviewedAt;
const pqSort = (a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0);   // 최근에 넣은 것부터
function renderMine() {
  const show = $("#showIntent").checked;
  const mineN = personal.filter(isStudentPq).length;
  $("#pqAdd").innerHTML = `${icon("plus", 17)} 질문 추가`;
  $("#pqFilter").innerHTML = [["all", "전체", personal.length], ["teacher", "선생님", personal.length - mineN], ["mine", "내가 만든", mineN]]
    .map(([k, t, n]) => `<button type="button" class="${pqFilter === k ? "on" : ""}" data-pqf="${k}">${t} ${n}</button>`).join("");
  $$("#pqFilter [data-pqf]").forEach((b) => b.onclick = () => { pqFilter = b.dataset.pqf; renderMine(); });
  const list = [...personal].sort(pqSort).filter((q) => pqFilter === "all" || (pqFilter === "mine") === isStudentPq(q));
  if (!personal.length) { $("#mine").innerHTML = `<div class="card empty">아직 예상질문이 없어요. 생기부를 보며 직접 추가해 보세요.</div>`; return; }
  if (!list.length) { $("#mine").innerHTML = `<div class="card empty">${pqFilter === "mine" ? "아직 내가 만든 질문이 없어요." : "선생님이 준비한 질문이 아직 없어요."}</div>`; return; }
  $("#mine").innerHTML = list.map((q) => {
    const me2 = isStudentPq(q);
    const tags = me2
      ? `<span class="pq-tag mine">내가 만든 질문</span>${!q.reviewedAt ? '<span class="pq-tag wait">새로 넣음 · 검토 대기</span>'
        : q.editedByTeacher ? `<span class="pq-tag edited">${icon("lock", 13)} 선생님이 다듬음</span>` : `<span class="pq-tag ok">${icon("lock", 13)} 선생님 확인</span>`}`
      : '<span class="pq-tag teacher">선생님이 준비</span>';
    const meta = me2 ? (q.basis ? `생기부 근거 · ${esc(q.basis)}` : "") : [q.category, q.basis].filter(Boolean).map(esc).join(" · ");
    return `<div class="q-item pq-card" data-qid="${esc(q.id)}">
      <div class="pq-tags">${tags}</div>
      <div class="q-text pre">${esc(q.text)}</div>
      ${meta ? `<div class="q-meta">${meta}</div>` : ""}
      ${show && q.followUps?.length ? `<ul class="follow">${q.followUps.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
      ${me2 && !q.reviewedAt ? `<div class="pq-acts"><button type="button" class="btn-sm" data-pqe="${esc(q.id)}">고치기</button><button type="button" class="btn-sm pq-del" data-pqd="${esc(q.id)}">지우기</button></div>`
        : me2 ? '<div class="pq-lock">선생님이 확인한 질문은 고치거나 지울 수 없어요.</div>' : ""}
    </div>`;
  }).join("");
  $$("#mine [data-pqe]").forEach((b) => b.onclick = () => openPqSheet(personal.find((q) => q.id === b.dataset.pqe)));
  $$("#mine [data-pqd]").forEach((b) => b.onclick = () => deletePq(personal.find((q) => q.id === b.dataset.pqd)));
}
$("#showIntent").onchange = renderMine;
$("#pqAdd").onclick = () => openPqSheet(null);

// 질문 추가·고치기 창 (아래에서 올라옴, 컴퓨터는 가운데)
function openPqSheet(q) {
  if (q && pqLocked(q)) { toast("선생님이 확인한 질문은 고치거나 지울 수 없어요.", "error"); return; }
  document.getElementById("pqSheet")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div class="pq-sheet-bg" id="pqSheet"><form class="pq-sheet" role="dialog" aria-modal="true" aria-labelledby="pqT" novalidate>
    <div class="pq-grip"></div>
    <div class="pq-sh-head"><h3 id="pqT">${q ? "질문 고치기" : "질문 추가"}</h3><button type="button" class="pq-x" id="pqX" aria-label="닫기">${icon("x", 18)}</button></div>
    <label class="pq-l" for="pqText">면접에서 나올 것 같은 질문 <em>*</em></label>
    <textarea id="pqText" maxlength="300">${esc(q?.text || "")}</textarea>
    <label class="pq-l" for="pqBasis">생기부 근거 <em>*</em></label>
    <input id="pqBasis" maxlength="200" value="${esc(q?.basis || "")}">
    <div class="pq-hint">이 질문이 생기부의 어디에서 나올지 짧게 적어요.<br>예) 2학년 화학Ⅱ 세특 – 촉매 실험 보고서</div>
    <label class="pq-l" for="pqFollow">꼬리질문 <span>(선택 · 한 줄에 하나)</span></label>
    <textarea id="pqFollow" class="sm">${esc((q?.followUps || []).join("\n"))}</textarea>
    <div class="pq-info">${icon("info", 18)}<span>넣자마자 <b>'내 생기부 면접'</b> 연습에 나와요. 선생님이 확인하면 <b>면접 부스</b>에서도 나와요. 선생님이 확인한 뒤에는 고치거나 지울 수 없어요.</span></div>
    <div class="pq-btns"><button type="button" id="pqCancel">취소</button><button type="submit" class="btn-primary" id="pqSave">${q ? "저장하기" : "추가하기"}</button></div>
  </form></div>`);
  const bg = $("#pqSheet");
  requestAnimationFrame(() => bg.classList.add("on"));
  const close = () => { bg.remove(); document.removeEventListener("keydown", onKey, true); };
  const onKey = (e) => { if (e.key === "Escape") { e.stopPropagation(); close(); } };
  document.addEventListener("keydown", onKey, true);
  bg.onclick = (e) => { if (e.target === bg) close(); };
  $("#pqX").onclick = close; $("#pqCancel").onclick = close;
  $("#pqText").focus();
  $(".pq-sheet", bg).onsubmit = async (e) => {
    e.preventDefault();
    const text = $("#pqText").value.trim(), basis = $("#pqBasis").value.trim();
    const followUps = $("#pqFollow").value.split("\n").map((x) => x.trim()).filter(Boolean).slice(0, 10);
    if (!text) { toast("질문을 적어 주세요.", "error"); $("#pqText").focus(); return; }
    if (!basis) { toast("생기부 근거를 적어 주세요. 이 질문이 생기부의 어디에서 나올지 짧게 적으면 돼요.", "error", 5000); $("#pqBasis").focus(); return; }
    $("#pqSave").disabled = true;
    try { await savePq(q, { text, basis, followUps }); close(); toast(q ? "고쳤어요." : "추가했어요. '내 생기부 면접' 연습에 바로 나와요."); }
    catch (err) { $("#pqSave").disabled = false; showError(err, q ? "질문 고치기" : "질문 추가"); }
  };
}
// 질문 저장과 개수(pqCount·pqMine·pqPending) 갱신을 한 번에
async function savePq(q, data) {
  const col = collection(db, "students", me.studentNo, "personalQuestions");
  const ref = q ? doc(col, q.id) : doc(col);
  const row = q ? { ...q, ...data } : { id: ref.id, ...data, category: "", type: "document", by: "student", addedBy: me.name || "", source: "student", createdAt: { seconds: Date.now() / 1000 } };
  const next = q ? personal.map((x) => (x.id === q.id ? row : x)) : [...personal, row];
  const b = writeBatch(db);
  if (q) b.update(ref, data);
  else b.set(ref, { ...data, category: "", type: "document", by: "student", addedBy: me.name || "", source: "student", createdAt: serverTimestamp() });
  b.update(doc(db, "students", me.studentNo), pqStats(next));
  await b.commit();
  personal = next;
  afterPqChange();
}
async function deletePq(q) {
  if (!q || pqLocked(q)) return;
  const ok = await confirmBox({ title: "이 질문을 지울까요?", what: `<b>${esc(q.text)}</b>`, note: "지우면 연습에도 더 나오지 않아요.", yes: "지우기" });
  if (!ok) return;
  const next = personal.filter((x) => x.id !== q.id);
  try {
    const b = writeBatch(db);
    b.delete(doc(db, "students", me.studentNo, "personalQuestions", q.id));
    b.update(doc(db, "students", me.studentNo), pqStats(next));
    await b.commit();
    personal = next;
    afterPqChange();
    toast("지웠어요.");
  } catch (e) { showError(e, "질문 지우기"); }
}
function afterPqChange() { renderMine(); renderModes(); renderPracLinks(); renderHome(); }
renderMine();
</script>
</body>
</html>
