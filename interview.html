<!doctype html>
<html lang="ko">
<head>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<style>
  body { background: #eef0f4; }
  .stage { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  .progress { display: flex; gap: 4px; margin: 4px 0 16px; }
  .progress span { flex: 1; height: 5px; border-radius: 3px; background: #d7dbe3; }
  .progress span.done { background: var(--accent); }
  .progress span.now { background: #8aa6ee; }
  .phase { font-size: .8rem; font-weight: 700; letter-spacing: .04em; color: var(--accent); }
  .question { font-size: 1.35rem; font-weight: 700; line-height: 1.5; margin: 8px 0 4px; }
  .passage { background: #fbfaf6; border: 1px solid #ebe6d6; border-radius: 10px; padding: 16px 18px; white-space: pre-wrap; line-height: 1.8; max-height: 48vh; overflow-y: auto; font-size: .98rem; }
  .timer-wrap { display: flex; align-items: center; gap: 18px; }
  .ring { width: 96px; height: 96px; position: relative; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .ring.warn .num { color: var(--warn); } .ring.over .num { color: var(--danger); }
  .answer-box { min-height: 170px; font-size: 1rem; line-height: 1.7; }
  .interim { color: var(--ink-3); font-size: .9rem; min-height: 1.4em; }
  .mic { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--ink-3); }
  .mic .dot { width: 9px; height: 9px; border-radius: 50%; background: #c3c8d2; }
  .mic.on .dot { background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  .save-state { font-size: .8rem; color: var(--ink-3); }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .opt:last-child { border-bottom: none; }
  .opt input[type=checkbox] { width: 18px; height: 18px; flex: none; }
  .opt .grow { flex: 1; }
  .opt select { width: auto; }
  /* 생기부 근거: 답을 다 한 뒤 확인 화면에서만 */
  .basis-box { display: flex; gap: 8px; align-items: flex-start; background: #f0f5fa; border: 1px dashed #bccee5; border-radius: 10px; padding: 9px 12px; margin: 6px 0 8px; font-size: .9rem; color: #41639b; }
  .basis-box svg { flex: none; margin-top: 2px; }
  .basis-box b { font-weight: 700; }
  /* 제시문 · MMI: 둘 중 하나 고르기 */
  .kind-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 12px 0 4px; }
  .kind-pick button { font: inherit; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 16px; padding: 12px 14px; display: grid; gap: 3px; cursor: pointer; min-width: 0; color: var(--ink); }
  .kind-pick button b { font-size: 1rem; } .kind-pick button span { font-size: .78rem; color: var(--ink-3); font-weight: 400; }
  .kind-pick button em { font-style: normal; font-size: .74rem; font-weight: 700; justify-self: start; border-radius: 99px; padding: 1px 8px; }
  .kind-pick .k-passage { background: #efe9f4; color: #6a4e86; } .kind-pick .k-mmi { background: var(--warn-bg); color: var(--warn); }
  .kind-pick button.on { border-color: var(--black, var(--accent-fill)); background: var(--accent-faint); box-shadow: inset 0 0 0 1px var(--black, var(--accent-fill)); }
  .kind-pick button:disabled { opacity: .45; cursor: default; }
  /* 제시문 세트: 학교·전형 카드 · 문항 단계 (2026-10-26) */
  .school-pick { display: grid; gap: 8px; margin: 10px 0 4px; }
  .school-pick button { font: inherit; text-align: left; border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 11px 14px; display: grid; gap: 2px; cursor: pointer; color: var(--ink); min-width: 0; }
  .school-pick button b { font-size: .98rem; } .school-pick button span { font-size: .8rem; color: var(--ink-3); }
  .school-pick button.on { border-color: var(--black, var(--accent-fill)); background: var(--accent-faint); box-shadow: inset 0 0 0 1px var(--black, var(--accent-fill)); }
  .school-pick .mine { font-size: .7rem; font-weight: 700; background: var(--ok-bg); color: var(--ok); border-radius: 99px; padding: 1px 7px; vertical-align: 2px; margin-left: 4px; }
  .p-steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
  .p-steps span { font-size: .8rem; font-weight: 700; border-radius: 99px; padding: 3px 11px; background: #e3e6ec; color: var(--ink-3); }
  .p-steps span.done { background: #dfe8f6; color: var(--accent); } .p-steps span.now { background: var(--accent); color: #fff; } .p-steps span.skip { text-decoration: line-through; }
  .p-head { font-size: .86rem; color: var(--ink-2); } .p-head b { color: var(--ink); }
  .p-list { margin: 0; padding-left: 26px; line-height: 1.7; } .p-list li::marker { font-weight: 700; color: var(--accent); }
  .p-end { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 12px 14px; font-weight: 700; }
  .kind-pick .rec { font-size: .68rem; font-weight: 700; background: var(--lime, var(--ok-bg)); color: var(--black, var(--ok)); border-radius: 99px; padding: 1px 7px; vertical-align: 2px; }
</style>
<script>
/* 새 버전 확인 (수정 금지 · 모든 화면 공통)
   GitHub Pages는 파일을 10분간 캐시해서, 업데이트 직후 옛 파일과 새 파일이 섞이면 화면이 멈출 수 있다.
   화면 코드를 실행하기 전에 쓰는 파일을 서버에 한 번씩 확인(재검증)해 항상 같은 버전으로 맞추고,
   열어 둔 화면은 10분마다 확인해 새 버전이 올라오면 새로고침 안내를 띄운다.
   index.html?reset=1 → 이 사이트에 저장된 데이터(로그인 포함)를 지우고 처음부터 다시 연다. */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("reset")) {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    var jobs = [];
    try { if (window.indexedDB) jobs.push(new Promise(function (ok) { var r = indexedDB.deleteDatabase("firebaseLocalStorageDb"); r.onsuccess = r.onerror = r.onblocked = function () { ok(); }; })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(function () { location.replace(location.pathname + "?resetdone=1"); });
    return;
  }
  var RX = /(?:import|export)\s[^;]*?from\s*["'](\.\/[^"']+)["']|import\(\s*["'](\.\/[^"']+)["']\s*\)/g;
  function deps(text) { var out = [], m; RX.lastIndex = 0; while ((m = RX.exec(text))) out.push(m[1] || m[2]); return out; }
  // 느린 네트워크·응답 없는 서버에서 화면 준비가 영영 끝나지 않는 것을 막는다
  function fetchT(url, ms) {
    var ctl = null;
    try { if (window.AbortController) ctl = new AbortController(); } catch (e) {}
    return new Promise(function (ok, no) {
      var settled = false;
      var t = setTimeout(function () {
        if (settled) return; settled = true;
        try { if (ctl) ctl.abort(); } catch (e) {}
        no(new Error("시간 초과: " + url));
      }, ms);
      var opt = { cache: "no-cache" };
      if (ctl) opt.signal = ctl.signal;
      fetch(url, opt).then(function (r) { if (settled) return; settled = true; clearTimeout(t); ok(r); },
        function (e) { if (settled) return; settled = true; clearTimeout(t); no(e); });
    });
  }
  function check(files, seen, sig) {
    files = files.filter(function (f) { if (seen[f]) return false; seen[f] = 1; return true; });
    if (!files.length) return Promise.resolve();
    return Promise.all(files.map(function (f) {
      return fetchT(f, 8000).then(function (r) {
        sig[f] = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return /\.js$/.test(f) ? r.text().then(deps) : [];
      }).catch(function () { return []; });
    })).then(function (lists) { return check([].concat.apply([], lists), seen, sig); });
  }
  // 화면 코드가 오류로 멈추면 안내 (하얀 화면·눌리지 않는 화면 방지)
  var failShown = false;
  function failBar(msg) {
    if (failShown) return; failShown = true;
    var lock = document.querySelector(".login.loading");
    if (lock) lock.classList.remove("loading");   // 로그인 화면은 일단 쓸 수 있게
    var sub = document.getElementById("submit"); if (sub) sub.disabled = false;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#c2453c;color:#fff;padding:10px 14px;font-size:.92rem;line-height:1.5";
    d.innerHTML = '화면을 제대로 불러오지 못했어요. <b>새로고침</b>해 보고, 그래도 같으면 <a href="index.html?reset=1" style="color:#fff">여기를 눌러 초기화</a>하세요.<br><span style="opacity:.85;font-size:.85rem"></span>';
    var text = String(msg || "");
    if (/gstatic|googleapis|firebase/i.test(text) || blockedFirebase) {
      d.querySelector("b").insertAdjacentHTML("afterend", " · 브라우저 확장 프로그램(광고 차단 등)이나 보안 프로그램이 firebase 파일을 막고 있을 수 있어요.");
    }
    d.querySelector("span").textContent = text.slice(0, 140);
    (document.body || document.documentElement).appendChild(d);
  }
  // Firebase 파일을 받을 수 있는지 미리 확인 (확장 프로그램·보안 프로그램 차단 진단용)
  var blockedFirebase = false;
  try {
    fetch("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js", { method: "GET", mode: "no-cors" })
      .catch(function () { blockedFirebase = true; });
  } catch (e) { blockedFirebase = true; }
  addEventListener("error", function (e) { if (e && (e.message || e.error)) failBar(e.message || e.error); }, true);
  addEventListener("unhandledrejection", function (e) { failBar(e.reason && (e.reason.message || e.reason)); });
  function sigText(sig) { return Object.keys(sig).sort().map(function (k) { return k + "=" + sig[k]; }).join("|"); }
  function banner() {
    if (document.getElementById("newVersionBar")) return;
    var d = document.createElement("div");
    d.id = "newVersionBar";
    d.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#24262a;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.92rem;max-width:92vw";
    d.innerHTML = '<span>새 버전이 올라왔어요. 저장할 내용이 있으면 먼저 저장하세요.</span><button type="button" style="background:#fff;color:#24262a;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap">새로고침</button>';
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  function start() {
    var mains = [].slice.call(document.querySelectorAll('script[type="app-module"]'));
    var page = location.pathname.split("/").pop() || "index.html";
    var initial = ["style.css", page];
    mains.forEach(function (s) { initial = initial.concat(deps(s.textContent)); });
    var sig = {}, done = false;
    function go() {
      if (done) return; done = true;
      var first = sigText(sig);
      // 화면(HTML) 자체가 옛 버전이면 한 번만 새로 불러온다
      fetchT(page, 6000).then(function (r) { return r.text(); }).then(function (html) {
        var cur = mains.map(function (s) { return s.textContent.trim(); }).join("\n");
        var key = "reloadedFor:" + page;
        if (cur && html.indexOf(cur) < 0 && sessionStorage.getItem(key) !== sig[page]) {
          sessionStorage.setItem(key, sig[page] || "1");
          location.reload();
          return true;
        }
      }).catch(function () {}).then(function (reloading) {
        if (reloading) return;
        // 앱 파일이 바뀌면 이 기기에 저장해 둔 화면용 데이터를 비운다 (옛 형식이 남아 생기는 오류 방지)
        try {
          var sigKey = "appSig:" + page, prevSig = localStorage.getItem(sigKey);
          if (prevSig && prevSig !== first) {   // 이 화면이 업데이트됐을 때만 정리
            [localStorage, sessionStorage].forEach(function (st) {
              Object.keys(st).filter(function (k) { return k.indexOf("c1:") === 0; }).forEach(function (k) { st.removeItem(k); });
            });
          }
          if (prevSig !== first) localStorage.setItem(sigKey, first);
        } catch (e) {}
        var css = document.querySelector('link[rel="stylesheet"][href^="style.css"]');
        if (css && sig["style.css"]) css.href = "style.css?v=" + encodeURIComponent(sig["style.css"]).replace(/%/g, "");
        mains.forEach(function (old) { var s = document.createElement("script"); s.type = "module"; s.textContent = old.textContent; old.replaceWith(s); });
        setInterval(function () {
          if (document.visibilityState !== "visible" || document.getElementById("newVersionBar")) return;
          var s2 = {};
          check(initial, {}, s2).then(function () { if (Object.keys(s2).length && sigText(s2) !== first) banner(); });
        }, 10 * 60 * 1000);
      });
    }
    check(initial, {}, sig).then(go, go);
    setTimeout(go, 5000);
    // 10초가 지나도 화면이 비어 있으면 안내
    setTimeout(function () {
      var m = document.querySelector("main");
      var filled = m && m.querySelector(".card, .q-item, table, .stage, .mode, #app > *");
      if (m && !filled) failBar("화면 내용을 불러오지 못했습니다.");
    }, 10000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</head>
<body>
<header class="topbar"><div class="inner">
  <a class="brand" href="student.html" style="text-decoration:none;color:inherit">면접 스튜디오<small id="modeLabel">모의면접</small></a>
  <div class="spacer"></div>
  <span class="save-state" id="saveState"></span>
  <button class="btn-sm" id="quit">그만하기</button>
  <button class="btn-sm" id="logoutBtn">로그아웃</button>
</div></header>

<main class="stage" id="app"></main>

<script type="app-module">
import {
  db, requireRole, collection, doc, getDocs, addDoc, updateDoc, serverTimestamp, loadInterviewsFor, cachedCollection,
  esc, $, toast, showError, TYPES, typeBadge, fmtSec, shuffle, icon, pmKindOf, passageReady, passageItems, passageSchool, univName
} from "./common.js";
import { mathHtml, speakText } from "./math.js";   // 제시문 수식 (2026-10-28)

const { user, profile } = await requireRole("student");
document.getElementById("logoutBtn").onclick = async () => {
  if (confirm("로그아웃할까요? 진행 중인 연습은 지금까지 자동 저장된 곳까지 남습니다.")) (await import("./common.js")).logout();
};
let depts = [], myUnivs = [];
try {
  const ivs = await loadInterviewsFor(profile.studentNo);
  depts = ivs.map((u) => u.dept || "").filter(Boolean);
  myUnivs = ivs.filter((u) => u.announceResult !== "fail").map((u) => univName(u.univ)).filter(Boolean);      // 제시문 학교 고르기의 '내 지원 대학' (1차 불합격 대학은 빼기)
} catch (e) { console.warn(e); }
// mode: personal · document · pm(제시문 · MMI — 들어와서 kind 로 둘 중 하나) · personality(기본 인성만)
// 예전 주소 mode=passage / mode=mmi 는 pm 으로 열고 그쪽을 고른 상태로
const modeParam = new URLSearchParams(location.search).get("mode") || "document";
const isPm = ["pm", "passage", "mmi"].includes(modeParam);
let mode = isPm ? "passage" : modeParam;          // 기록에 남는 실제 유형 (pm 이면 고른 쪽)
let kind = modeParam === "mmi" ? "mmi" : modeParam === "passage" ? "passage" : pmKindOf(profile);
const MODE_LABEL = { personal: "내 생기부 면접", document: "학생부 공통 질문", passage: "제시문 면접", mmi: "MMI 면접", personality: "기본 인성", pm: "제시문 · MMI" };
$("#modeLabel").textContent = MODE_LABEL[isPm ? "pm" : mode] || mode;
const app = $("#app");

// ---------- 음성 기능 지원 여부
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const hasTTS = "speechSynthesis" in window;

// ---------- 질문 불러오기
let pool = [];
const pmPools = { passage: [], mmi: [] };      // 제시문 · MMI: 둘을 따로 담아 두고 고른 쪽을 pool 로
try {
  if (mode === "personal") {
    const snap = await getDocs(collection(db, "students", profile.studentNo, "personalQuestions"));
    pool = snap.docs.map((d) => ({ id: d.id, source: "personal", type: "document", ...d.data() }));
  } else {
    const all = await cachedCollection("questions");   // 질문은행: 바뀌었을 때만 서버에서 받음
    const relevant = (q) => !q.majors?.length || depts.some((d) => q.majors.some((m) => d.includes(m)));
    const bankQ = all.map((q) => ({ ...q, source: "bank" }));
    if (isPm) {
      pmPools.passage = bankQ.filter(passageReady);     // 학교·주제·문항·시간이 모두 있는 제시문만 (예전 양식은 쓰지 않음)
      pmPools.mmi = bankQ.filter((q) => q.type === "mmi");
      if (!pmPools[kind].length) kind = kind === "mmi" ? "passage" : "mmi";   // 고른 쪽에 질문이 없으면 다른 쪽
      mode = kind; pool = pmPools[kind];
    } else pool = bankQ.filter((q) => {
      if (mode === "personality") return q.type === "personality";        // 기본 인성만 (MMI 는 제시문 · MMI 쪽으로)
      return q.type === mode && relevant(q);
    });
  }
} catch (e) { showError(e, "질문 불러오기"); }

if (!pool.length) {
  app.innerHTML = `<div class="card empty">이 유형에 준비된 질문이 없어요.<br><br><a class="btn" href="student.html">돌아가기</a></div>`;
  throw new Error("no questions");
}

// ---------- 설정 화면 (제시문 · MMI 는 맨 위에서 둘 중 하나를 고르고, 고르면 다시 그린다)
const settings = { count: Math.min(5, pool.length), follow: true, tts: hasTTS, stt: !!SR, timeScale: 1 };
const KIND = {
  passage: { title: "제시문 면접", time: "학교별 · 문항 차례로" },
  mmi: { title: "MMI", time: `상황 읽고 준비 ${TYPES.mmi.prep / 60}분 · 답변 ${TYPES.mmi.answer / 60}분` }
};
const kindPick = () => !isPm ? "" : `<div class="kind-pick">${["passage", "mmi"].map((k) => `
  <button type="button" class="${k === kind ? "on" : ""}" data-kind="${k}" ${pmPools[k].length ? "" : "disabled"}>
    <b>${KIND[k].title}${k === pmKindOf(profile) && (profile.special || "").match(/제시문|MMI/) ? ' <span class="rec">내 트랙</span>' : ""}</b>
    <span>${pmPools[k].length ? KIND[k].time : "아직 질문이 없어요"}</span><em class="k-${k}">${pmPools[k].length}${k === "passage" ? "개" : "문항"}</em></button>`).join("")}</div>`;
// ---------- 제시문: 학교·전형 묶음 (같은 학교·전형끼리 한 카드)
const minTxt = (sec) => { const n = Math.round(Number(sec) || 0), m = Math.floor(n / 60), r = n % 60; return m && r ? `${m}분 ${r}초` : m ? `${m}분` : `${r}초`; };
const rangeTxt = (list, k) => { const v = [...new Set(list.map((q) => Number(q[k])))].sort((a, b) => a - b); return v.length > 1 ? `${minTxt(v[0])}~${minTxt(v[v.length - 1])}` : minTxt(v[0]); };
function schoolGroups() {
  const by = new Map();
  pool.forEach((q) => { const key = `${univName(q.univ)}|${String(q.admission || "").trim()}`; if (!by.has(key)) by.set(key, { key, univ: univName(q.univ), name: passageSchool(q), list: [] }); by.get(key).list.push(q); });
  const mine = (g) => myUnivs.includes(g.univ);
  return [...by.values()].sort((a, b) => (mine(b) ? 1 : 0) - (mine(a) ? 1 : 0) || a.name.localeCompare(b.name, "ko")).map((g) => ({ ...g, mine: mine(g) }));
}
function schoolPick() {
  const gs = schoolGroups();
  if (settings.group == null || (settings.group && !gs.some((g) => g.key === settings.group))) settings.group = (gs.find((g) => g.mine) || (gs.length === 1 ? gs[0] : null))?.key || "";
  const card = (g) => `<button type="button" class="${settings.group === g.key ? "on" : ""}" data-group="${esc(g.key)}"><b>${esc(g.name)}${g.mine ? '<span class="mine">내 지원 대학</span>' : ""}</b>
    <span>제시문 ${g.list.length}개 · 숙독 ${rangeTxt(g.list, "prepSec")} · 답변 ${rangeTxt(g.list, "answerSec")}</span></button>`;
  if (gs.length === 1) return `<div class="opt" style="display:block"><b>학교·전형</b><div class="muted">${esc(gs[0].name)} · 제시문 ${gs[0].list.length}개 · 숙독 ${rangeTxt(gs[0].list, "prepSec")} · 답변 ${rangeTxt(gs[0].list, "answerSec")}</div></div>`;
  return `<div class="opt" style="display:block"><b>어느 학교 제시문으로 할까요?</b>
    <div class="school-pick">${gs.map(card).join("")}
      <button type="button" class="${settings.group === "" ? "on" : ""}" data-group=""><b>아무거나</b><span>모든 제시문 중 하나</span></button></div></div>`;
}

    <div style="margin-top:18px"><button class="btn-primary btn-lg" id="start">${isPm ? (kind === "mmi" ? "MMI 면접 시작" : "제시문 면접 시작") : "면접 시작"}</button></div>

document.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => {

$("#start").onclick = async () => {

}
// 제시문: 문항 수·시간은 고르지 않음 — 고른 학교·전형의 제시문 하나를 선생님이 정한 시간(숙독+답변)으로
function renderPassageSetup() {

renderSetup();

// ---------- 세션
let sessionRef = null;
let items = [];
let idx = 0;
const LS_KEY = () => `interview-backup-${sessionRef?.id}`;

async function begin() {
  const picked = shuffle(pool).slice(0, settings.count);
  items = picked.map((q) => {
    const t = TYPES[q.type] || TYPES.document;
    const followPick = settings.follow && q.followUps?.length ? q.followUps[Math.floor(Math.random() * q.followUps.length)] : "";
    return {
      source: q.source, qid: q.id, type: q.type || "document", text: q.text || "", passage: q.passage || "",
      prepSec: Math.round((q.prepSec ?? t.prep) * settings.timeScale),
      answerSec: Math.round((q.answerSec ?? t.answer) * settings.timeScale),
      followUp: followPick, prepMemo: "", answer: "", usedSec: 0, followAnswer: "", followUsedSec: 0
    };
  });
  try {
    sessionRef = await addDoc(collection(db, "sessions"), {
      studentUid: user.uid, studentName: profile.name || "", studentNo: profile.studentNo,
      major: depts.join(", "), track: profile.track || "",
      mode, modeLabel: MODE_LABEL[mode] || mode, status: "in_progress",
      items, startedAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  } catch (e) {
    showError(e, "면접 기록 생성");
    $("#start").disabled = false;
    return;
  }
  idx = 0;
  runItem();
}

let saving = Promise.resolve();
function save() {
  try { localStorage.setItem(LS_KEY(), JSON.stringify(items)); } catch (_) {}
  $("#saveState").textContent = "저장 중…";
  saving = updateDoc(sessionRef, { items, updatedAt: serverTimestamp() })
    .then(() => { $("#saveState").textContent = "저장됨"; })
    .catch((e) => { $("#saveState").textContent = "⚠ 저장 실패 (기기에 임시 보관 중)"; showError(e, "답변 저장"); throw e; });
  return saving;
}

// ---------- 제시문 세트 (2026-10-26): 숙독 → 1번부터 한 문항씩 → 답변 시간(세트 합)이 다 되면 끊고 남은 문항 건너뜀 → 시간이 1분 넘게 남으면 꼬리질문
// 기록: 문항마다 items 한 줄(type "passage" · pNo · pOf, 1번 줄에만 passage·prepSec·prepUsedSec, answerSec = 세트 답변 시간)
//       + 맨 위 passageSet { qid, univ, admission, topic, n, readSec, readUsedSec, answerSec, answerUsedSec, done, timeUp } — 부스 기록과 같은 모양
const FOLLOW_MIN_LEFT = 60;           // 세트 끝 꼬리질문: 남은 답변 시간이 이 초 이상일 때만
const TIME_UP_LINE = "시간이 다 돼서 여기까지 할게요.";
let pset = null, phaseDone = false;
async function beginPassage() {
  const gs = schoolGroups();
  const cand = settings.group ? (gs.find((g) => g.key === settings.group)?.list || pool) : pool;
  const q = shuffle(cand)[0];
  const qs = passageItems(q).map((x) => x.q);
  pset = { src: q, q: qs, n: qs.length, used: 0, followNow: false,
    rec: { qid: q.id, univ: univName(q.univ), admission: String(q.admission || "").trim(), topic: String(q.topic || "").trim(), n: qs.length,
      readSec: Number(q.prepSec), readUsedSec: 0, answerSec: Number(q.answerSec), answerUsedSec: 0, done: false, timeUp: false } };
  items = [];
  try {
    sessionRef = await addDoc(collection(db, "sessions"), {
      studentUid: user.uid, studentName: profile.name || "", studentNo: profile.studentNo,
      major: depts.join(", "), track: profile.track || "",
      mode: "passage", modeLabel: MODE_LABEL.passage, status: "in_progress",
      items, passageSet: pset.rec, startedAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  } catch (e) {
    showError(e, "면접 기록 생성");
    $("#start").disabled = false;
    return;
  }
  readPhase();
}
const saveSet = () => { if (!sessionRef) return Promise.resolve(); return updateDoc(sessionRef, { passageSet: pset.rec, updatedAt: serverTimestamp() }).catch((e) => console.warn("passageSet", e)); };
function readPhase() {
  const r = pset.rec;
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <div class="row"><span class="phase">숙독 시간 · 답변 ${fmtSec(r.answerSec)}</span> ${typeBadge("passage")}</div>
      <div class="p-head"><b>${esc(passageSchool(r))}</b> · ${esc(r.topic)}</div>
      <div class="timer-wrap"><div class="ring" id="ring"></div>
        <div class="muted">제시문과 문항을 읽고 생각을 정리하세요. 다 읽었으면 [다 읽었어요]를 누르세요. 시간이 다 되면 1번 문항으로 넘어가요.</div></div>
      <div class="passage">${mathHtml(pset.src.passage)}</div>
      <div><b>문항</b><ol class="p-list">${pset.q.map((x) => `<li>${mathHtml(x)}</li>`).join("")}</ol></div>
      <div><label>메모</label><textarea id="memo" placeholder="핵심 개념, 답변 순서, 근거…"></textarea></div>
      <div class="row"><div class="spacer"></div><button class="btn-primary" id="next">다 읽었어요 · 1번 시작</button></div>
    </div>`;
  let done = false;
  const elapsed = startTimer(r.readSec, $("#ring"), (used) => { if (used >= r.readSec) finish(); });
  function finish() {
    if (done) return; done = true; stopTimer();
    r.readUsedSec = Math.min(r.readSec, Math.round(elapsed()));
    pset.memo = $("#memo").value;
    askItem(0);
  }
  $("#next").onclick = finish;
}
// k번 문항 (0부터). 세트 시계는 pset.used 에서 이어서 셈
function askItem(k) {
  const r = pset.rec, text = pset.q[k];
  const it = { source: pset.src.source || "bank", qid: pset.src.id, type: "passage", text, pNo: k + 1, pOf: pset.n, answerSec: r.answerSec,
    ...(k === 0 ? { passage: pset.src.passage || "", prepSec: r.readSec, prepUsedSec: r.readUsedSec, prepMemo: pset.memo || "" } : {}),
    followUp: "", answer: "", usedSec: 0, followAnswer: "", followUsedSec: 0 };
  items.push(it); idx = k;
  setAnswerScreen(it, false, `${k + 1}번 문항입니다. ${text}`);
}
// 답변 화면 (문항 · 꼬리질문 공용). 남은 답변 시간 = 세트 답변 시간 − 이미 쓴 시간
function setAnswerScreen(it, isFollow, say) {
  const r = pset.rec, last = !isFollow && it.pNo === pset.n;
  const qText = isFollow ? it.followUp : it.text;
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <div class="row"><span class="phase">${isFollow ? "꼬리질문" : `${it.pNo}번 문항 · ${it.pNo}/${pset.n}`} · 답변 시간 ${fmtSec(r.answerSec)} (문항 모두 합쳐서)</span> ${typeBadge("passage")}</div>
      <div class="question pre">${mathHtml(qText)}</div>
      <details><summary class="muted">제시문 다시 보기</summary><div class="passage" style="margin-top:8px">${mathHtml(pset.src.passage)}</div></details>
      ${pset.memo ? `<details><summary class="muted">내 메모</summary><div class="pre" style="margin-top:6px">${esc(pset.memo)}</div></details>` : ""}
      <div class="timer-wrap"><div class="ring" id="ring"></div>
        <div><div class="muted">남은 답변 시간이에요. 다 되면 그 자리에서 끝나고 남은 문항은 건너뛰어요.</div>
        <div class="mic" id="mic" ${settings.stt && SR ? "" : "hidden"}><span class="dot"></span> 받아쓰기</div></div></div>
      <div>
        <textarea class="answer-box" id="answer" placeholder="${settings.stt && SR ? "말하면 여기에 받아써집니다. 직접 고쳐도 돼요." : "답변을 입력하세요."}"></textarea>
        <div class="interim" id="interim"></div>
      </div>
      <div class="row">
        ${hasTTS && settings.tts ? `<button id="replay" class="btn-sm">🔊 문항 다시 듣기</button>` : ""}
        <div class="spacer"></div>
        <button class="btn-primary" id="done">${isFollow || last ? "답변 마치기" : `다음 문항 (${it.pNo + 1}번) →`}</button>
      </div>
    </div>`;
  const ta = $("#answer");
  const sayText = speakText(say || qText);     // 수식 부분은 '수식'으로 읽음
  speak(sayText);
  $("#replay") && ($("#replay").onclick = () => speak(sayText));
  const sttDelay = settings.tts && hasTTS ? Math.min(6000, 800 + sayText.length * 90) : 0;
  const sttTimer = setTimeout(() => startDictation(ta, $("#interim"), $("#mic")), sttDelay);
  const start = pset.used;
  let ended = false;
  const elapsed = startTimer(r.answerSec, $("#ring"), (used) => { if (used >= r.answerSec) end(true); }, start);
  function end(timeUp) {
    if (ended) return; ended = true;
    clearTimeout(sttTimer);
    stopDictation(); stopTimer(); if (hasTTS) speechSynthesis.cancel();
    const pending = $("#interim").textContent.trim();
    const text = (ta.value.trim() + (pending ? " " + pending : "")).trim();
    const total = Math.min(r.answerSec, elapsed());
    const used = Math.max(0, Math.round(total - start));
    if (isFollow) { it.followAnswer = text; it.followUsedSec = used; } else { it.answer = text; it.usedSec = used; }
    pset.used = total; r.answerUsedSec = Math.round(total);
    if (timeUp) { r.timeUp = true; it.timeUp = true; }
    r.done = items.length === pset.n && !!items[pset.n - 1]?.answer;
    save().catch(() => {}); saveSet();
    if (timeUp) return timeUpScreen();
    if (!isFollow && it.pNo < pset.n) return askItem(it.pNo);
    if (!isFollow) return afterItems();
    pset.followNow = false; reviewPhase();
  }
  $("#done").onclick = () => end(false);
}
// 마지막 문항까지 답함 → 시간이 1분 넘게 남았고 등록된 꼬리질문이 있으면 하나
function afterItems() {
  const r = pset.rec, left = r.answerSec - pset.used, fu = pset.src.followUps || [];
  if (settings.follow && fu.length && left >= FOLLOW_MIN_LEFT) {
    const it = items[items.length - 1];
    it.followUp = fu[Math.floor(Math.random() * fu.length)];
    pset.followNow = true;
    return setAnswerScreen(it, true);
  }
  reviewPhase();
}
// 답변 시간이 다 됨 — 말하던 답변은 거기까지 저장하고, 남은 문항은 건너뜀
function timeUpScreen() {
  const inFollow = pset.followNow;
  pset.followNow = false; phaseDone = true;
  const left = pset.n - items.length;
  speak(TIME_UP_LINE);
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <div class="p-end">${TIME_UP_LINE}</div>
      <p class="muted" style="margin:0">${left ? `${items.length + 1}${left > 1 ? `~${pset.n}` : ""}번 문항은 묻지 않고 넘어가요. ` : ""}${inFollow ? "꼬리질문" : `${items.length}번`} 답변은 여기까지 저장했어요.</p>
      <div class="row"><div class="spacer"></div><button class="btn-primary" id="toReview">결과 보기</button></div>
    </div>`;
  $("#toReview").onclick = () => reviewPhase();
}

// ---------- 타이머
let timer = null;
function startTimer(total, el, onTick, offset = 0) {   // offset: 이미 쓴 시간(초) — 제시문 세트는 문항이 바뀌어도 한 시계로 셈
  stopTimer();
  const t0 = performance.now() - offset * 1000;
  const R = 42, C = 2 * Math.PI * R;
  el.innerHTML = `<svg width="96" height="96"><circle cx="48" cy="48" r="${R}" fill="none" stroke="#e2e5ec" stroke-width="7"/>
    <circle class="bar" cx="48" cy="48" r="${R}" fill="none" stroke="#41639b" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><div class="num"></div>`;
  const bar = el.querySelector(".bar"), num = el.querySelector(".num");
  let beeped = false;
  const tick = () => {
    const used = (performance.now() - t0) / 1000;
    const left = total - used;
    num.textContent = fmtSec(left);
    bar.style.strokeDashoffset = String(C * Math.min(1, used / total));
    el.classList.toggle("warn", left <= 10 && left > 0);
    el.classList.toggle("over", left <= 0);
    bar.setAttribute("stroke", left <= 0 ? "#c2453c" : left <= 10 ? "#95590a" : "#41639b");
    if (left <= 0 && !beeped) { beeped = true; beep(); }
    onTick?.(used);
  };
  tick();
  timer = setInterval(tick, 250);
  return () => (performance.now() - t0) / 1000;
}
function stopTimer() { if (timer) clearInterval(timer); timer = null; }
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 660; g.gain.value = 0.08; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.35);
  } catch (_) {}
}

// ---------- 음성
function speak(text) {
  if (!settings.tts || !hasTTS) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ko-KR"; u.rate = 1;
  const ko = speechSynthesis.getVoices().find((v) => v.lang?.startsWith("ko"));
  if (ko) u.voice = ko;
  speechSynthesis.speak(u);
}

let rec = null, recWanted = false;
function startDictation(textarea, interimEl, micEl) {
  if (!settings.stt || !SR) return;
  stopDictation();
  recWanted = true;
  rec = new SR();
  rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = (ev) => {
    let interim = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const r = ev.results[i];
      if (r.isFinal) {
        const add = r[0].transcript.trim();
        if (add) textarea.value = (textarea.value.trim() ? textarea.value.trim() + " " : "") + add;
      } else interim += r[0].transcript;
    }
    interimEl.textContent = interim;
  };
  rec.onstart = () => micEl.classList.add("on");
  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      recWanted = false; toast("마이크 권한이 없어 받아쓰기를 끕니다. 직접 입력하세요.", "error", 5000);
    }
  };
  // 크롬은 침묵이 길면 인식을 멈추므로, 답변 중이면 다시 켠다.
  rec.onend = () => { micEl.classList.remove("on"); if (recWanted) { try { rec.start(); } catch (_) {} } };
  try { rec.start(); } catch (_) {}
}
function stopDictation() {
  recWanted = false;
  if (rec) { try { rec.stop(); } catch (_) {} rec = null; }
}

// ---------- 문항 진행
function progressBar() {
  if (pset) return `<div class="p-steps">${Array.from({ length: pset.n }, (_, k) => { const it = items[k];
    const st = it && (k < items.length - 1 || phaseDone || pset.followNow) ? "done" : it ? "now" : phaseDone ? "skip" : "";
    return `<span class="${st}">${k + 1}번${st === "done" ? " ✓" : ""}</span>`; }).join("")}${pset.followNow ? '<span class="now">꼬리질문</span>' : ""}</div>`;
  return `<div class="progress">${items.map((_, i) => `<span class="${i < idx ? "done" : i === idx ? "now" : ""}"></span>`).join("")}</div>`;
}

function runItem() {
  const it = items[idx];
  if (it.prepSec > 0 && it.passage) prepPhase(it); else answerPhase(it, "main");
}

function prepPhase(it) {
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <div class="row"><span class="phase">준비 시간 · 문항 ${idx + 1}/${items.length}</span> ${typeBadge(it.type)}</div>
      <div class="timer-wrap"><div class="ring" id="ring"></div>
        <div class="muted">제시문을 읽고 답변을 구상하세요. 메모는 답변 중에도 볼 수 있어요.</div></div>
      <div class="passage">${esc(it.passage)}</div>
      <div><b>문항</b><div class="pre">${esc(it.text)}</div></div>
      <div><label>메모</label><textarea id="memo" placeholder="핵심 개념, 답변 순서, 근거…"></textarea></div>
      <div class="row"><div class="spacer"></div><button class="btn-primary" id="next">준비 끝 · 답변 시작</button></div>
    </div>`;
  const ring = $("#ring");
  let done = false;
  const finish = () => { if (done) return; done = true; stopTimer(); it.prepMemo = $("#memo").value; save().catch(() => {}); answerPhase(it, "main"); };
  startTimer(it.prepSec, ring, (used) => { if (used >= it.prepSec) finish(); });
  $("#next").onclick = finish;
}

function answerPhase(it, which) {
  const isFollow = which === "follow";
  const limit = isFollow ? Math.round(60 * settings.timeScale) : it.answerSec;
  const qText = isFollow ? it.followUp : it.text;
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <div class="row"><span class="phase">${isFollow ? "꼬리질문" : "답변"} · 문항 ${idx + 1}/${items.length}</span> ${typeBadge(it.type)}</div>
      ${isFollow ? `<div class="muted">앞 질문: ${esc(it.text)}</div>` : ""}
      <div class="question pre">${esc(qText)}</div>
      ${!isFollow && it.passage ? `<details ${it.prepSec ? "" : "open"}><summary class="muted">제시문 ${it.prepSec ? "다시 보기" : ""}</summary><div class="passage" style="margin-top:8px">${esc(it.passage)}</div></details>` : ""}
      ${it.prepMemo && !isFollow ? `<details><summary class="muted">내 메모</summary><div class="pre" style="margin-top:6px">${esc(it.prepMemo)}</div></details>` : ""}
      <div class="timer-wrap"><div class="ring" id="ring"></div>
        <div><div class="muted">제한 ${fmtSec(limit)} · 시간이 지나도 계속 말할 수 있지만 초과 시간이 기록돼요.</div>
        <div class="mic" id="mic" ${settings.stt && SR ? "" : "hidden"}><span class="dot"></span> 받아쓰기</div></div></div>
      <div>
        <textarea class="answer-box" id="answer" placeholder="${settings.stt && SR ? "말하면 여기에 받아써집니다. 직접 고쳐도 돼요." : "답변을 입력하세요."}"></textarea>
        <div class="interim" id="interim"></div>
      </div>
      <div class="row">
        ${hasTTS && settings.tts ? `<button id="replay" class="btn-sm">🔊 질문 다시 듣기</button>` : ""}
        <div class="spacer"></div>
        <button class="btn-primary" id="done">답변 완료</button>
      </div>
    </div>`;
  const ta = $("#answer");
  ta.value = isFollow ? it.followAnswer : it.answer;
  speak(qText);
  $("#replay") && ($("#replay").onclick = () => speak(qText));
  // 질문 읽는 동안은 받아쓰기가 면접관 음성을 잡지 않도록 잠시 뒤에 시작
  const sttDelay = settings.tts && hasTTS ? Math.min(6000, 800 + qText.length * 90) : 0;
  const sttTimer = setTimeout(() => startDictation(ta, $("#interim"), $("#mic")), sttDelay);
  const elapsed = startTimer(limit, $("#ring"));

  $("#done").onclick = () => {
    clearTimeout(sttTimer);
    stopDictation(); stopTimer(); if (hasTTS) speechSynthesis.cancel();
    // 받아쓰기 도중 남은 임시 결과도 답변에 포함
    const pending = $("#interim").textContent.trim();
    const text = (ta.value.trim() + (pending ? " " + pending : "")).trim();
    const used = Math.round(elapsed());
    if (isFollow) { it.followAnswer = text; it.followUsedSec = used; }
    else { it.answer = text; it.usedSec = used; }
    save().catch(() => {});
    if (!isFollow && it.followUp) return answerPhase(it, "follow");
    idx++;
    if (idx < items.length) runItem(); else reviewPhase();
  };
}

// 생기부 근거 — 연습 기록에는 남기지 않고, 불러온 예상질문에서 찾아 확인 화면에만 보여 준다
const basisOf = (it) => (mode === "personal" && pool.find((q) => q.id === it.qid)?.basis) || "";
function reviewPhase() {
  if (pset) phaseDone = true;
  const skipped = pset ? pset.q.slice(items.length) : [];
  app.innerHTML = `${progressBar()}
    <div class="card stack">
      <h1>수고했어요!</h1>
      ${pset ? `<div class="p-head"><b>${esc(passageSchool(pset.src))}</b> · ${esc(pset.src.topic || "")}<br>
        숙독 ${fmtSec(pset.rec.readUsedSec)} / ${fmtSec(pset.rec.readSec)} · 답변 ${fmtSec(pset.rec.answerUsedSec)} / ${fmtSec(pset.rec.answerSec)} · 문항 ${pset.n}개 중 ${items.filter((x) => x.answer).length}개 답변${pset.rec.timeUp ? " · 시간이 다 돼서 마침" : ""}</div>` : ""}
      <p class="muted">받아쓰기가 틀린 부분은 고쳐도 됩니다. 단, 내용을 새로 덧붙이진 마세요 — 실제로 말한 답변이 피드백 대상이에요.</p>
      ${items.map((it, i) => `
        <div class="q-item">
          <div class="row">${typeBadge(it.type)} <span class="muted">${it.pNo ? `${it.pNo}번 · ${fmtSec(it.usedSec)}${it.timeUp ? ' <span class="badge badge-orange">시간 끝에서 끊김</span>' : ""}`
            : `Q${i + 1} · ${it.usedSec}초 / ${it.answerSec}초 ${it.usedSec > it.answerSec ? '<span class="badge badge-red">시간 초과</span>' : ""}`}</span></div>
          <div class="q-text" style="margin:6px 0">${it.pNo ? mathHtml(it.text) : esc(it.text)}</div>
          ${basisOf(it) ? `<div class="basis-box">${icon("note", 17)}<span><b>생기부 근거</b> · ${esc(basisOf(it))}</span></div>` : ""}
          <textarea data-i="${i}" data-f="answer">${esc(it.answer)}</textarea>
          ${it.followUp ? `<div style="margin:8px 0 4px"><b>꼬리질문</b> ${esc(it.followUp)}</div><textarea data-i="${i}" data-f="followAnswer">${esc(it.followAnswer)}</textarea>` : ""}
        </div>`).join("")}
      ${skipped.map((q, k) => `<div class="q-item"><div class="row">${typeBadge("passage")} <span class="muted">${items.length + k + 1}번 · 시간이 다 돼서 못 했어요</span></div><div class="q-text muted" style="margin-top:6px">${mathHtml(q)}</div></div>`).join("")}
      ${items.some(basisOf) ? '<p class="muted" style="margin:0">근거는 답을 다 한 뒤에만 보여요. 내 답이 생기부 내용을 잘 담았는지 비교해 보세요.</p>' : ""}
      <div class="grid grid-2">
        <div><label>잘한 점</label><textarea id="good" placeholder="예: 두괄식으로 결론부터 말했다"></textarea></div>
        <div><label>아쉬운 점</label><textarea id="improve" placeholder="예: 실험 수치를 구체적으로 말하지 못했다"></textarea></div>
      </div>
      <div class="row"><div class="spacer"></div><button class="btn-primary btn-lg" id="submit">제출하기</button></div>
    </div>`;
  document.querySelectorAll("textarea[data-i]").forEach((ta) => ta.oninput = () => { items[ta.dataset.i][ta.dataset.f] = ta.value; });
  $("#submit").onclick = async () => {
    $("#submit").disabled = true;
    try {
      await updateDoc(sessionRef, {
        items, ...(pset ? { passageSet: pset.rec } : {}), reflection: { good: $("#good").value.trim(), improve: $("#improve").value.trim() },
        status: "submitted", submittedAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      try { localStorage.removeItem(LS_KEY()); } catch (_) {}
      finished = true;
      toast("제출했어요. 선생님 피드백을 기다려 주세요.");
      setTimeout(() => location.href = "student.html", 900);
    } catch (e) {
      showError(e, "제출");
      $("#submit").disabled = false;
    }
  };
}

let finished = false;
$("#quit").onclick = () => {
  if (sessionRef && !finished && !confirm("그만하시겠어요? 지금까지 답변은 '미완료'로 저장됩니다.")) return;
  stopDictation(); stopTimer(); if (hasTTS) speechSynthesis.cancel();
  finished = true;
  location.href = "student.html";
};
window.addEventListener("beforeunload", (e) => {
  if (sessionRef && !finished) { e.preventDefault(); e.returnValue = ""; }
});
</script>
</body>
</html>
