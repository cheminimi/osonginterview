<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오송고 면접 스튜디오 · 로그인</title>
<link rel="icon" type="image/png" href="osong-logo.png">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .login { width: 100%; max-width: 400px; }
  .hero { text-align: center; margin-bottom: 22px; }
  .hero .logo { display: block; width: 96px; height: 96px; margin: 0 auto 14px; filter: drop-shadow(0 4px 12px rgba(24, 48, 141, .18)); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #eceef2; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: none; background: none; color: var(--ink-3); justify-content: center; }
  .seg button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .login.loading .card { pointer-events: none; opacity: .6; }
  .keep { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 2px 0 14px; }
  .keep input { width: auto; }
</style>
<script>
/* 새 버전 확인 (수정 금지 · 모든 화면 공통)
   GitHub Pages는 파일을 10분간 캐시해서, 업데이트 직후 옛 파일과 새 파일이 섞이면 화면이 멈출 수 있다.
   화면 코드를 실행하기 전에 쓰는 파일을 서버에 한 번씩 확인(재검증)해 항상 같은 버전으로 맞추고,
   열어 둔 화면은 10분마다 확인해 새 버전이 올라오면 새로고침 안내를 띄운다.
   index.html?reset=1 → 이 사이트에 저장된 데이터(로그인 포함)를 지우고 처음부터 다시 연다. */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("reset")) {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    var jobs = [];
    try { if (window.indexedDB) jobs.push(new Promise(function (ok) { var r = indexedDB.deleteDatabase("firebaseLocalStorageDb"); r.onsuccess = r.onerror = r.onblocked = function () { ok(); }; })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(function () { location.replace(location.pathname + "?resetdone=1"); });
    return;
  }
  var RX = /(?:import|export)\s[^;]*?from\s*["'](\.\/[^"']+)["']|import\(\s*["'](\.\/[^"']+)["']\s*\)/g;
  function deps(text) { var out = [], m; RX.lastIndex = 0; while ((m = RX.exec(text))) out.push(m[1] || m[2]); return out; }
  function check(files, seen, sig) {
    files = files.filter(function (f) { if (seen[f]) return false; seen[f] = 1; return true; });
    if (!files.length) return Promise.resolve();
    return Promise.all(files.map(function (f) {
      return fetch(f, { cache: "no-cache" }).then(function (r) {
        sig[f] = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return /\.js$/.test(f) ? r.text().then(deps) : [];
      }).catch(function () { return []; });
    })).then(function (lists) { return check([].concat.apply([], lists), seen, sig); });
  }
  // 화면 코드가 오류로 멈추면 안내 (하얀 화면·눌리지 않는 화면 방지)
  var failShown = false;
  function failBar(msg) {
    if (failShown) return; failShown = true;
    var lock = document.querySelector(".login.loading");
    if (lock) lock.classList.remove("loading");   // 로그인 화면은 일단 쓸 수 있게
    var sub = document.getElementById("submit"); if (sub) sub.disabled = false;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#d33a3a;color:#fff;padding:10px 14px;font-size:.92rem;line-height:1.5";
    d.innerHTML = '화면을 제대로 불러오지 못했어요. <b>새로고침</b>해 보고, 그래도 같으면 <a href="index.html?reset=1" style="color:#fff">여기를 눌러 초기화</a>하세요.<br><span style="opacity:.85;font-size:.85rem"></span>';
    var text = String(msg || "");
    if (/gstatic|googleapis|firebase/i.test(text) || blockedFirebase) {
      d.querySelector("b").insertAdjacentHTML("afterend", " · 브라우저 확장 프로그램(광고 차단 등)이나 보안 프로그램이 firebase 파일을 막고 있을 수 있어요.");
    }
    d.querySelector("span").textContent = text.slice(0, 140);
    (document.body || document.documentElement).appendChild(d);
  }
  // Firebase 파일을 받을 수 있는지 미리 확인 (확장 프로그램·보안 프로그램 차단 진단용)
  var blockedFirebase = false;
  try {
    fetch("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js", { method: "GET", mode: "no-cors" })
      .catch(function () { blockedFirebase = true; });
  } catch (e) { blockedFirebase = true; }
  addEventListener("error", function (e) { if (e && (e.message || e.error)) failBar(e.message || e.error); }, true);
  addEventListener("unhandledrejection", function (e) { failBar(e.reason && (e.reason.message || e.reason)); });
  function sigText(sig) { return Object.keys(sig).sort().map(function (k) { return k + "=" + sig[k]; }).join("|"); }
  function banner() {
    if (document.getElementById("newVersionBar")) return;
    var d = document.createElement("div");
    d.id = "newVersionBar";
    d.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#1b1f27;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.92rem;max-width:92vw";
    d.innerHTML = '<span>새 버전이 올라왔어요. 저장할 내용이 있으면 먼저 저장하세요.</span><button type="button" style="background:#fff;color:#1b1f27;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap">새로고침</button>';
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  function start() {
    var mains = [].slice.call(document.querySelectorAll('script[type="app-module"]'));
    var page = location.pathname.split("/").pop() || "index.html";
    var initial = ["style.css", page];
    mains.forEach(function (s) { initial = initial.concat(deps(s.textContent)); });
    var sig = {}, done = false;
    function go() {
      if (done) return; done = true;
      var first = sigText(sig);
      // 화면(HTML) 자체가 옛 버전이면 한 번만 새로 불러온다
      fetch(page, { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (html) {
        var cur = mains.map(function (s) { return s.textContent.trim(); }).join("\n");
        var key = "reloadedFor:" + page;
        if (cur && html.indexOf(cur) < 0 && sessionStorage.getItem(key) !== sig[page]) {
          sessionStorage.setItem(key, sig[page] || "1");
          location.reload();
          return true;
        }
      }).catch(function () {}).then(function (reloading) {
        if (reloading) return;
        // 앱 파일이 바뀌면 이 기기에 저장해 둔 화면용 데이터를 비운다 (옛 형식이 남아 생기는 오류 방지)
        try {
          var sigKey = "appSig:" + page, prevSig = localStorage.getItem(sigKey);
          if (prevSig && prevSig !== first) {   // 이 화면이 업데이트됐을 때만 정리
            [localStorage, sessionStorage].forEach(function (st) {
              Object.keys(st).filter(function (k) { return k.indexOf("c1:") === 0; }).forEach(function (k) { st.removeItem(k); });
            });
          }
          if (prevSig !== first) localStorage.setItem(sigKey, first);
        } catch (e) {}
        var css = document.querySelector('link[rel="stylesheet"][href^="style.css"]');
        if (css && sig["style.css"]) css.href = "style.css?v=" + encodeURIComponent(sig["style.css"]).replace(/%/g, "");
        mains.forEach(function (old) { var s = document.createElement("script"); s.type = "module"; s.textContent = old.textContent; old.replaceWith(s); });
        setInterval(function () {
          if (document.visibilityState !== "visible" || document.getElementById("newVersionBar")) return;
          var s2 = {};
          check(initial, {}, s2).then(function () { if (Object.keys(s2).length && sigText(s2) !== first) banner(); });
        }, 10 * 60 * 1000);
      });
    }
    check(initial, {}, sig).then(go, go);
    setTimeout(go, 5000);
    // 로그인 화면이 계속 잠겨 있으면(코드가 안 돌면) 8초 뒤 풀어 준다
    setTimeout(function () { if (document.querySelector(".login.loading")) failBar("화면 준비가 끝나지 않았습니다."); }, 8000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</head>
<body>
<div class="login loading">
  <div class="hero">
    <img class="logo" src="osong-logo.png" alt="오송고등학교 로고">
    <h1>오송고 면접 스튜디오</h1>
    <div class="muted">2027학년도 대입 대비 오송고등학교 면접 준비반</div>
  </div>
  <div class="card" id="already" hidden>
    <p style="margin-top:0"><b id="alreadyWho"></b>(으)로 로그인되어 있어요.</p>
    <div class="row">
      <button class="btn-primary" id="goOn" style="flex:1;justify-content:center">계속하기</button>
      <button id="outBtn" style="flex:1;justify-content:center">로그아웃</button>
    </div>
    <p class="muted" style="margin:10px 0 0">다른 사람이 쓰던 컴퓨터라면 로그아웃한 뒤 내 계정으로 로그인하세요.</p>
  </div>
  <div class="card" id="loginCard">
    <div class="seg">
      <button type="button" class="active" data-role="student">학생</button>
      <button type="button" data-role="staff">선생님</button>
    </div>
    <form id="form" onsubmit="return false">
      <div class="field">
        <label id="idLabel" for="id">학번</label>
        <input id="id" autocomplete="username" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <label class="keep"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지 <span class="muted">(내 휴대폰·개인 PC만)</span></label>
      <button class="btn-primary btn-lg" style="width:100%;justify-content:center" id="submit" disabled>로그인</button>
    </form>
    <p class="muted" id="hint" style="margin:12px 0 0">처음이면 선생님께 받은 초기 비밀번호로 로그인한 뒤 바꿔 주세요.</p>
    <p class="muted" style="margin:6px 0 0">체크하지 않으면 브라우저를 닫거나 60분 동안 사용하지 않을 때 자동으로 로그아웃됩니다.</p>
  </div>
  <p class="muted" style="text-align:center;margin-top:14px;font-size:.85rem">화면이 이상하거나 로그인이 계속 안 되면 <a href="index.html?reset=1">여기를 눌러 초기화</a></p>
</div>
<script type="app-module">
import { auth, signIn, signOut, resolveLoginEmail, showError, toast, loginLabel, $, $$ } from "./common.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let kind = "student";
$$(".seg button").forEach((b) => b.onclick = () => {
  kind = b.dataset.role;
  $$(".seg button").forEach((x) => x.classList.toggle("active", x === b));
  $("#idLabel").textContent = kind === "student" ? "학번" : "교사 ID";
  $("#id").inputMode = kind === "student" ? "numeric" : "text";
  $("#hint").textContent = kind === "student"
    ? "처음이면 선생님께 받은 초기 비밀번호로 로그인한 뒤 바꿔 주세요."
    : "관리자에게 받은 ID로 로그인합니다. (최고 관리자는 이메일 입력)";
});

const qs = new URLSearchParams(location.search);
if (qs.has("out")) toast("로그아웃했습니다.");
if (qs.has("idle")) toast("오랫동안 사용하지 않아 자동으로 로그아웃했습니다.", "ok", 6000);
if (qs.has("resetdone")) toast("이 기기에 저장된 사이트 데이터를 지웠어요. 다시 로그인하세요.", "ok", 6000);
if (qs.has("out") || qs.has("idle") || qs.has("resetdone")) history.replaceState(null, "", "index.html");

// 이미 로그인된 상태면 바로 넘어가지 않고 누구로 로그인됐는지 보여 준다 (공용 PC에서 남의 계정으로 들어가는 것 방지)
const unsub = onAuthStateChanged(auth, (u) => {
  unsub();
  if (!u) return;
  $("#alreadyWho").textContent = loginLabel(u.email);
  $("#already").hidden = false;
  $("#loginCard").hidden = true;
});
$("#goOn").onclick = () => location.replace("teacher.html");   // 학생 계정이면 학생 화면으로 자동 이동
$("#outBtn").onclick = async () => {
  try { await signOut(auth); sessionStorage.clear(); localStorage.removeItem("keepLogin"); } catch (e) { showError(e, "로그아웃"); }
  $("#already").hidden = true; $("#loginCard").hidden = false;
  toast("로그아웃했습니다.");
};

$("#submit").disabled = false;  // 준비가 끝나야 로그인 화면을 누를 수 있다
document.querySelector(".login").classList.remove("loading");
$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const id = $("#id").value.trim(), pw = $("#pw").value;
  $("#submit").disabled = true;
  try {
    const email = await resolveLoginEmail(kind, id);
    await signIn(email, pw, $("#keep").checked);
    location.replace(kind === "student" ? "student.html" : "teacher.html");
  } catch (err) {
    showError(err, "로그인");
    $("#submit").disabled = false;
  }
};
</script>
</body>
</html>
