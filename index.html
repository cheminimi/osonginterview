<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오송고 면접 스튜디오 · 로그인</title>
<link rel="icon" type="image/png" href="osong-logo.png">
<link rel="stylesheet" href="style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px 16px; }
  .login { width: 100%; max-width: 400px; }
  .hero { text-align: center; margin-bottom: 22px; }
  .hero .logo { display: block; width: 96px; height: 96px; margin: 0 auto 14px; filter: drop-shadow(0 4px 12px rgba(24, 48, 141, .18)); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: #eceef2; border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .seg button { border: none; background: none; color: var(--ink-3); justify-content: center; }
  .seg button.active { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .keep { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 2px 0 14px; }
  .keep input { width: auto; }
</style>
</head>
<body>
<div class="login">
  <div class="hero">
    <img class="logo" src="osong-logo.png" alt="오송고등학교 로고">
    <h1>오송고 면접 스튜디오</h1>
    <div class="muted">2027학년도 대입 대비 오송고등학교 면접 대비</div>
  </div>
  <div class="card" id="already" hidden>
    <p style="margin-top:0"><b id="alreadyWho"></b>(으)로 로그인되어 있어요.</p>
    <div class="row">
      <button class="btn-primary" id="goOn" style="flex:1;justify-content:center">계속하기</button>
      <button id="outBtn" style="flex:1;justify-content:center">로그아웃</button>
    </div>
    <p class="muted" style="margin:10px 0 0">다른 사람이 쓰던 컴퓨터라면 로그아웃한 뒤 내 계정으로 로그인하세요.</p>
  </div>
  <div class="card" id="loginCard">
    <div class="seg">
      <button type="button" class="active" data-role="student">학생</button>
      <button type="button" data-role="staff">선생님</button>
    </div>
    <form id="form">
      <div class="field">
        <label id="idLabel" for="id">학번</label>
        <input id="id" autocomplete="username" inputmode="numeric" required>
      </div>
      <div class="field">
        <label for="pw">비밀번호</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <label class="keep"><input type="checkbox" id="keep"> 이 기기에서 로그인 유지 <span class="muted">(내 휴대폰·개인 PC만)</span></label>
      <button class="btn-primary btn-lg" style="width:100%;justify-content:center" id="submit">로그인</button>
    </form>
    <p class="muted" id="hint" style="margin:12px 0 0">처음이면 선생님께 받은 초기 비밀번호로 로그인한 뒤 바꿔 주세요.</p>
    <p class="muted" style="margin:6px 0 0">체크하지 않으면 브라우저를 닫거나 60분 동안 사용하지 않을 때 자동으로 로그아웃됩니다.</p>
  </div>
</div>
<script type="module">
import { auth, signIn, signOut, resolveLoginEmail, showError, toast, loginLabel, $, $$ } from "./common.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

let kind = "student";
$$(".seg button").forEach((b) => b.onclick = () => {
  kind = b.dataset.role;
  $$(".seg button").forEach((x) => x.classList.toggle("active", x === b));
  $("#idLabel").textContent = kind === "student" ? "학번" : "교사 ID";
  $("#id").inputMode = kind === "student" ? "numeric" : "text";
  $("#hint").textContent = kind === "student"
    ? "처음이면 선생님께 받은 초기 비밀번호로 로그인한 뒤 바꿔 주세요."
    : "관리자에게 받은 ID로 로그인합니다. (최고 관리자는 이메일 입력)";
});

const qs = new URLSearchParams(location.search);
if (qs.has("out")) toast("로그아웃했습니다.");
if (qs.has("idle")) toast("오랫동안 사용하지 않아 자동으로 로그아웃했습니다.", "ok", 6000);
if (qs.has("out") || qs.has("idle")) history.replaceState(null, "", "index.html");

// 이미 로그인된 상태면 바로 넘어가지 않고 누구로 로그인됐는지 보여 준다 (공용 PC에서 남의 계정으로 들어가는 것 방지)
const unsub = onAuthStateChanged(auth, (u) => {
  unsub();
  if (!u) return;
  $("#alreadyWho").textContent = loginLabel(u.email);
  $("#already").hidden = false;
  $("#loginCard").hidden = true;
});
$("#goOn").onclick = () => location.replace("teacher.html");   // 학생 계정이면 학생 화면으로 자동 이동
$("#outBtn").onclick = async () => {
  try { await signOut(auth); sessionStorage.clear(); localStorage.removeItem("keepLogin"); } catch (e) { showError(e, "로그아웃"); }
  $("#already").hidden = true; $("#loginCard").hidden = false;
  toast("로그아웃했습니다.");
};

$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const id = $("#id").value.trim(), pw = $("#pw").value;
  $("#submit").disabled = true;
  try {
    const email = await resolveLoginEmail(kind, id);
    await signIn(email, pw, $("#keep").checked);
    location.replace(kind === "student" ? "student.html" : "teacher.html");
  } catch (err) {
    showError(err, "로그인");
    $("#submit").disabled = false;
  }
};
</script>
</body>
</html>
