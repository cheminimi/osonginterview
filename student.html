<html lang="ko">
<head>
<meta charset="utf-8">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
<style>
  .univ { font-size: .9rem; padding: 6px 0; border-bottom: 1px solid var(--line-3); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .univ:last-child { border-bottom: none; }
  .mode { cursor: pointer; transition: transform .1s, border-color .1s; display: flex; flex-direction: column; gap: 6px; position: relative; }
  .mode:hover { border-color: var(--accent); transform: translateY(-1px); }
  .mode .count { font-size: .85rem; color: var(--ink-3); }
  .mode.disabled { opacity: .5; pointer-events: none; }
  .mode .title { font-weight: 700; font-size: 1.05rem; }
  .mode .rec { position: absolute; top: 12px; right: 12px; }
  .clickable-card { cursor: pointer; } .clickable-card:hover { border-color: var(--accent); }
  .fb-box { background: var(--accent-faint); border: 1px solid var(--accent-line); border-radius: 10px; padding: 12px 14px; margin-top: 8px; }
  .ans { background: #faf8f7; border-radius: 8px; padding: 10px 12px; margin-top: 6px; white-space: pre-wrap; }
  .kv dd { white-space: pre-wrap; }
  @media (max-width: 720px) {
    .mode .title { font-size: 1rem; }
    .mode { gap: 4px; }
  }
</style>
<script>
/* 새 버전 확인 (수정 금지 · 모든 화면 공통)
   GitHub Pages는 파일을 10분간 캐시해서, 업데이트 직후 옛 파일과 새 파일이 섞이면 화면이 멈출 수 있다.
   화면 코드를 실행하기 전에 쓰는 파일을 서버에 한 번씩 확인(재검증)해 항상 같은 버전으로 맞추고,
   열어 둔 화면은 10분마다 확인해 새 버전이 올라오면 새로고침 안내를 띄운다.
   index.html?reset=1 → 이 사이트에 저장된 데이터(로그인 포함)를 지우고 처음부터 다시 연다. */
(function () {
  var q = new URLSearchParams(location.search);
  if (q.has("reset")) {
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    var jobs = [];
    try { if (window.indexedDB) jobs.push(new Promise(function (ok) { var r = indexedDB.deleteDatabase("firebaseLocalStorageDb"); r.onsuccess = r.onerror = r.onblocked = function () { ok(); }; })); } catch (e) {}
    try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
    Promise.all(jobs).then(function () { location.replace(location.pathname + "?resetdone=1"); });
    return;
  }
  var RX = /(?:import|export)\s[^;]*?from\s*["'](\.\/[^"']+)["']|import\(\s*["'](\.\/[^"']+)["']\s*\)/g;
  function deps(text) { var out = [], m; RX.lastIndex = 0; while ((m = RX.exec(text))) out.push(m[1] || m[2]); return out; }
  function check(files, seen, sig) {
    files = files.filter(function (f) { if (seen[f]) return false; seen[f] = 1; return true; });
    if (!files.length) return Promise.resolve();
    return Promise.all(files.map(function (f) {
      return fetch(f, { cache: "no-cache" }).then(function (r) {
        sig[f] = r.headers.get("etag") || r.headers.get("last-modified") || "";
        return /\.js$/.test(f) ? r.text().then(deps) : [];
      }).catch(function () { return []; });
    })).then(function (lists) { return check([].concat.apply([], lists), seen, sig); });
  }
  // 화면 코드가 오류로 멈추면 안내 (하얀 화면·눌리지 않는 화면 방지)
  var failShown = false;
  function failBar(msg) {
    if (failShown) return; failShown = true;
    var lock = document.querySelector(".login.loading");
    if (lock) lock.classList.remove("loading");   // 로그인 화면은 일단 쓸 수 있게
    var sub = document.getElementById("submit"); if (sub) sub.disabled = false;
    var d = document.createElement("div");
    d.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;background:#c2453c;color:#fff;padding:10px 14px;font-size:.92rem;line-height:1.5";
    d.innerHTML = '화면을 제대로 불러오지 못했어요. <b>새로고침</b>해 보고, 그래도 같으면 <a href="index.html?reset=1" style="color:#fff">여기를 눌러 초기화</a>하세요.<br><span style="opacity:.85;font-size:.85rem"></span>';
    var text = String(msg || "");
    if (/gstatic|googleapis|firebase/i.test(text) || blockedFirebase) {
      d.querySelector("b").insertAdjacentHTML("afterend", " · 브라우저 확장 프로그램(광고 차단 등)이나 보안 프로그램이 firebase 파일을 막고 있을 수 있어요.");
    }
    d.querySelector("span").textContent = text.slice(0, 140);
    (document.body || document.documentElement).appendChild(d);
  }
  // Firebase 파일을 받을 수 있는지 미리 확인 (확장 프로그램·보안 프로그램 차단 진단용)
  var blockedFirebase = false;
  try {
    fetch("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js", { method: "GET", mode: "no-cors" })
      .catch(function () { blockedFirebase = true; });
  } catch (e) { blockedFirebase = true; }
  addEventListener("error", function (e) { if (e && (e.message || e.error)) failBar(e.message || e.error); }, true);
  addEventListener("unhandledrejection", function (e) { failBar(e.reason && (e.reason.message || e.reason)); });
  function sigText(sig) { return Object.keys(sig).sort().map(function (k) { return k + "=" + sig[k]; }).join("|"); }
  function banner() {
    if (document.getElementById("newVersionBar")) return;
    var d = document.createElement("div");
    d.id = "newVersionBar";
    d.style.cssText = "position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;background:#24262a;color:#fff;padding:10px 12px 10px 16px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;font-size:.92rem;max-width:92vw";
    d.innerHTML = '<span>새 버전이 올라왔어요. 저장할 내용이 있으면 먼저 저장하세요.</span><button type="button" style="background:#fff;color:#24262a;border:none;border-radius:8px;padding:6px 12px;font-weight:700;cursor:pointer;white-space:nowrap">새로고침</button>';
    d.querySelector("button").onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  function start() {
    var mains = [].slice.call(document.querySelectorAll('script[type="app-module"]'));
    var page = location.pathname.split("/").pop() || "index.html";
    var initial = ["style.css", page];
    mains.forEach(function (s) { initial = initial.concat(deps(s.textContent)); });
    var sig = {}, done = false;
    function go() {
      if (done) return; done = true;
      var first = sigText(sig);
      // 화면(HTML) 자체가 옛 버전이면 한 번만 새로 불러온다
      fetch(page, { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (html) {
        var cur = mains.map(function (s) { return s.textContent.trim(); }).join("\n");
        var key = "reloadedFor:" + page;
        if (cur && html.indexOf(cur) < 0 && sessionStorage.getItem(key) !== sig[page]) {
          sessionStorage.setItem(key, sig[page] || "1");
          location.reload();
          return true;
        }
      }).catch(function () {}).then(function (reloading) {
        if (reloading) return;
        // 앱 파일이 바뀌면 이 기기에 저장해 둔 화면용 데이터를 비운다 (옛 형식이 남아 생기는 오류 방지)
        try {
          var sigKey = "appSig:" + page, prevSig = localStorage.getItem(sigKey);
          if (prevSig && prevSig !== first) {   // 이 화면이 업데이트됐을 때만 정리
            [localStorage, sessionStorage].forEach(function (st) {
              Object.keys(st).filter(function (k) { return k.indexOf("c1:") === 0; }).forEach(function (k) { st.removeItem(k); });
            });
          }
          if (prevSig !== first) localStorage.setItem(sigKey, first);
        } catch (e) {}
        var css = document.querySelector('link[rel="stylesheet"][href^="style.css"]');
        if (css && sig["style.css"]) css.href = "style.css?v=" + encodeURIComponent(sig["style.css"]).replace(/%/g, "");
        mains.forEach(function (old) { var s = document.createElement("script"); s.type = "module"; s.textContent = old.textContent; old.replaceWith(s); });
        setInterval(function () {
          if (document.visibilityState !== "visible" || document.getElementById("newVersionBar")) return;
          var s2 = {};
          check(initial, {}, s2).then(function () { if (Object.keys(s2).length && sigText(s2) !== first) banner(); });
        }, 10 * 60 * 1000);
      });
    }
    check(initial, {}, sig).then(go, go);
    setTimeout(go, 5000);
    // 10초가 지나도 화면이 비어 있으면 안내
    setTimeout(function () {
      var m = document.querySelector("main");
      var filled = m && m.querySelector(".card, .q-item, table, .stage, .mode, #app > *");
      if (m && !filled) failBar("화면 내용을 불러오지 못했습니다.");
    }, 10000);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();
})();
</script>
</head>
<body>
<header class="topbar"><div class="inner">
  <div class="brand">면접 스튜디오<small>학생</small></div>
  <div class="spacer"></div>
  <div class="row" id="acct"></div>
</div></header>

<nav class="tabbar" id="tabs" hidden></nav>

<main class="wrap" id="main" hidden>
  <section data-panel="home">
    <div id="pwaTip"></div>
    <div id="homeBody"></div>
  </section>

  <section data-panel="practice" hidden>
    <div id="pracHome">
      <p class="muted" style="margin:0 0 10px">혼자 말로 답해 보고, 답변을 선생님께 보낼 수 있어요.</p>
      <div class="grid grid-4" id="modes"></div>
      <div class="list-card" style="margin-top:14px" id="pracLinks"></div>
    </div>
    <div id="pracMine" hidden>
      <div class="sub-head"><button class="btn-sm btn-back" data-back="1"></button><h2 style="margin:0">내 예상질문</h2></div>
      <div class="row" style="margin-bottom:10px">
        <span class="muted">실전 연습 전에 꼬리질문을 먼저 보면 연습 효과가 떨어져요.</span>
        <div class="spacer"></div>
        <label class="row" style="margin:0;font-weight:500"><input type="checkbox" id="showIntent" style="width:auto"> 꼬리질문 보기</label>
      </div>
      <div id="mine"></div>
    </div>
    <div id="pracHist" hidden>
      <div class="sub-head"><button class="btn-sm btn-back" data-back="1"></button><h2 style="margin:0">지난 연습 기록</h2></div>
      <div id="history"></div>
    </div>
  </section>

  <section data-panel="schedule" hidden><div id="schedule"></div></section>
  <section data-panel="feedback" hidden><div id="feedback"></div></section>
</main>

<div class="modal-bg" id="modal" hidden><div class="modal">
  <div class="modal-head"><h2 id="mTitle"></h2><button id="mClose">닫기</button></div>
  <div id="mBody"></div>
</div></div>

<script type="app-module">
import {
  db, requireRole, mountAccountMenu, collection, getDocs, query, where, onSnapshot, esc, $, $$, toast, showError, loadInterviewsFor, cachedCollection,
  CRITERIA, STAGES, fmtDate, fmtDay, typeBadge, dday, nextInterview, recommendedModes, icon, isoDay
} from "./common.js";
import { mountSchedule, BOOK_STAGES, stageTeachers, ACTIVE, STATUS } from "./schedule.js";
import { registerSW, mountInstallTip, showInstallTipAgain, isStandalone } from "./pwa.js";

const ctx = await requireRole("student");
const { user, profile: me } = ctx;

let personal = [], bank = [], sessions = [], meetings = [];
try {
  // 연습 기록·대면 피드백은 아래 실시간 구독이 처음 한 번 읽어 온다 (중복 읽기 없음)
  const [pq, qb, iv] = await Promise.all([
    getDocs(collection(db, "students", me.studentNo, "personalQuestions")),
    cachedCollection("questions"),   // 질문은행: 바뀌었을 때만 서버에서 받음
    loadInterviewsFor(me.studentNo)
  ]);
  me.universities = iv;
  const rows = (s) => s.docs.map((d) => ({ id: d.id, ...d.data() }));
  personal = rows(pq); bank = qb;
} catch (e) { showError(e, "데이터 불러오기"); }
$("#main").hidden = false;
$("#tabs").hidden = false;

// ---- 계정 메뉴 (오른쪽 위 동그라미)
const teacherLine = BOOK_STAGES.map((sg) => { const t = stageTeachers(me, sg.key); return t.length ? `${sg.short} ${t.join("·")}` : ""; }).filter(Boolean).join(", ");
mountAccountMenu(ctx, $("#acct"), {
  subtitle: `${me.studentNo}${me.track ? " · " + me.track : ""}`,
  items: [
    teacherLine ? { icon: "user", label: "내 담당 선생님", desc: teacherLine, info: true } : null,
    me.sheetUrl ? { icon: "sheet", label: "내 준비 시트 열기", href: me.sheetUrl } : null,
    isStandalone() ? null : { icon: "phone", label: "홈 화면에 앱으로 추가", onClick: () => { switchTab("home"); showInstallTipAgain($("#pwaTip")); } }
  ]
});

// ---- 연습 모드
const relevant = (q) => !q.majors?.length || (me.universities || []).some((u) => q.majors.some((m) => (u.dept || "").includes(m)));
const rec = recommendedModes(me);
const modes = [
  { mode: "personal", title: "내 생기부 면접", desc: "선생님이 준비한 나만의 예상질문", n: personal.length, badge: "document" },
  { mode: "document", title: "학생부 공통 질문", desc: "지원동기·학업계획·활동 질문", n: bank.filter((q) => q.type === "document" && relevant(q)).length, badge: "document" },
  { mode: "passage", title: "제시문 면접", desc: "준비시간 동안 제시문 읽고 답변", n: bank.filter((q) => q.type === "passage").length, badge: "passage" },
  { mode: "personality", title: "기본 인성 · MMI", desc: "가치관·경험·상황 판단 질문", n: bank.filter((q) => q.type === "personality" || q.type === "mmi").length, badge: "personality" }
].sort((a, b) => (rec.includes(b.mode) ? 1 : 0) - (rec.includes(a.mode) ? 1 : 0));
$("#modes").innerHTML = modes.map((m) => `
  <div class="card mode ${m.n ? "" : "disabled"}" data-mode="${m.mode}">
    ${rec.includes(m.mode) ? '<span class="badge badge-blue rec">내 트랙 추천</span>' : ""}
    <div>${typeBadge(m.badge)}</div>
    <div class="title">${m.title}</div>
    <div class="muted">${m.desc}</div>
    <div class="count">${m.n ? `질문 ${m.n}개` : "아직 질문이 없어요"}</div>
  </div>`).join("");
$$(".mode").forEach((el) => el.onclick = () => location.href = `interview.html?mode=${el.dataset.mode}`);

// 연습 탭 아래 줄: 내 예상질문 · 지난 연습 기록 (같은 탭 안 하위 화면)
function renderPracLinks() {
  $("#pracLinks").innerHTML = [
    { sub: "mine", ic: "note", t: "내 예상질문", d: personal.length ? `선생님이 올린 질문 ${personal.length}개` : "아직 올라온 질문이 없어요" },
    { sub: "hist", ic: "list", t: "지난 연습 기록", d: sessions.length ? `연습 ${sessions.length}회` : "아직 연습 기록이 없어요" }
  ].map((x) => `<button type="button" class="list-row" data-sub="${x.sub}">
      <span class="r-ic">${icon(x.ic, 20)}</span>
      <span class="r-tx"><b>${x.t}</b><span class="muted">${x.d}</span></span>
      <span class="r-end">${icon("chevron", 18)}</span></button>`).join("");
  $$("#pracLinks [data-sub]").forEach((b) => b.onclick = () => showPracSub(b.dataset.sub));
}
function showPracSub(name) {
  $("#pracHome").hidden = !!name;
  $("#pracMine").hidden = name !== "mine";
  $("#pracHist").hidden = name !== "hist";
  window.scrollTo({ top: 0, behavior: "instant" });
}
$$("[data-back]").forEach((b) => { b.innerHTML = `${icon("back", 18)} 연습`; b.onclick = () => showPracSub(""); });
renderPracLinks();

// ---- 모의면접 일정 (달력: 다른 학생 일정도 보여서 같은 선생님·같은 장소 겹침을 피할 수 있음)
let bookings = [], blockLabelOf = () => "", homeReady = false;
const sched = mountSchedule($("#schedule"), {
  role: "student", student: me,
  onBadge: (n) => setDot("#scDot", n),
  onData: (d) => { bookings = d.bookings || []; blockLabelOf = d.blockLabel; renderHome(); }
});

// ---- 탭 (좁은 화면은 아래 고정 탭바)
registerSW();
mountInstallTip($("#pwaTip"));
document.body.classList.add("has-tabbar");

const TABS = [
  { key: "home", label: "홈", ic: "home" },
  { key: "practice", label: "연습", ic: "mic" },
  { key: "schedule", label: "일정", ic: "calendar", dot: "scDot" },
  { key: "feedback", label: "피드백", ic: "chat", dot: "fbDot" }
];
$("#tabs").innerHTML = TABS.map((t, i) => `<button type="button" class="${i ? "" : "active"}" data-tab="${t.key}">
  ${icon(t.ic, 22)}<span>${t.label}</span>${t.dot ? `<span class="tb-dot" id="${t.dot}"></span>` : ""}</button>`).join("");
function setDot(sel, n) { const el = $(sel); if (el) el.textContent = n ? String(n) : ""; }
function switchTab(key) {
  $$("#tabs button").forEach((x) => x.classList.toggle("active", x.dataset.tab === key));
  $$("[data-panel]").forEach((p) => p.hidden = p.dataset.panel !== key);
  if (key === "practice") showPracSub("");
  if (key === "feedback") markFeedbackSeen();
  window.scrollTo({ top: 0, behavior: "instant" });
}
$$("#tabs button").forEach((b) => b.onclick = () => switchTab(b.dataset.tab));

// ---- 홈: 오늘 할 일 · 잡힌 일정
const SEEN_KEY = `seenFb:${me.studentNo}`;
const readSeen = () => { try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); } catch (e) { return new Set(); } };
let seenFb = readSeen();
const feedbackIds = () => [...meetings.map((m) => "m" + m.id), ...sessions.filter((s) => s.reviewedAt).map((s) => "s" + s.id)];
const unseenFb = () => feedbackIds().filter((k) => !seenFb.has(k));
function markFeedbackSeen() {
  const all = feedbackIds();
  if (!all.length || !unseenFb().length) return;
  seenFb = new Set(all);
  try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seenFb])); } catch (e) {}
  renderHome(); renderFeedback();
}

// ---- 홈: 화면 너비에 따라 구성이 갈린다 (데이터·구독은 공유, 그리는 부분만 분리)
//   · 720px 이하(휴대폰) → homeNarrow() : 예전 구성 (D-day 카드 → 오늘 할 일 → 잡힌 일정 → 지원 대학)
//   · 721px 이상(컴퓨터) → homeWide()   : 새 구성 (인사말 → 연습/다가오는 면접 → 여정 → 피드백/자료)
// 한 번에 한 쪽만 #homeBody 안에 들어가므로 id 가 겹치지 않는다.
const WIDE = window.matchMedia("(min-width: 721px)");
let wasWide = WIDE.matches;
{   // 너비가 바뀔 때 한 번만 다시 그린다 (리스너 1개, 구독은 건드리지 않음)
  const onWide = () => { if (WIDE.matches === wasWide) return; wasWide = WIDE.matches; renderHome(); };
  WIDE.addEventListener ? WIDE.addEventListener("change", onWide) : WIDE.addListener(onWide);
}

// 두 화면이 함께 쓰는 값
function homeData() {
  const today = isoDay();
  const now = new Date();
  const next = nextInterview(me);
  const nd = next ? dday(next) : null;
  const nextU = (me.universities || []).find((u) => u.date && next && isoDay(u.date) === isoDay(next));
  const up = (bookings || []).filter((b) => ACTIVE(b.status) && b.date >= today)
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  return { today, now, next, nd, nextU, up };
}

function renderHome() {
  if (!homeReady) return;   // 아래 준비가 끝나기 전에 일정 달력이 먼저 그려질 수 있음
  const d = homeData();
  $("#homeBody").innerHTML = WIDE.matches ? homeWide(d) : homeNarrow(d);
  const box = $("#homeBody");
  // 두 화면 공통 연결
  $$("[data-go]", box).forEach((b) => b.onclick = () => switchTab(b.dataset.go));
  $$("[data-mode]", box).forEach((b) => b.onclick = () => location.href = `interview.html?mode=${b.dataset.mode}`);
  $$("[data-stage]", box).forEach((b) => b.onclick = () => { switchTab("schedule"); sched.focusStage(Number(b.dataset.stage)); });
  if (WIDE.matches) bindWide(box); else bindNarrow(box);
}

// ================= 컴퓨터 화면 (721px 이상) =================
function homeWide({ now, next, nd, nextU, up }) {
  const WEEK = "일월화수목금토";
  const nb = up[0];

  // 차수별 진행 상태
  const stageState = BOOK_STAGES.map((sg) => {
    const done = meetings.find((m) => Number(m.stage) === sg.key);
    const bk = (bookings || []).filter((b) => b.stage === sg.key && ACTIVE(b.status))
      .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start))[0];
    const teachers = stageTeachers(me, sg.key);
    if (done) return { sg, cls: "done", label: `완료 · ${fmtDay(done.date).replace(/\(.\)$/, "")}` };
    if (bk) return { sg, cls: "now", label: `${fmtDay(bk.date).replace(/\(.\)$/, "")} ${bk.status === "confirmed" ? "예정" : "요청 중"}` };
    return { sg, cls: "", label: teachers.length ? "아직 신청 전" : "선생님 미배정" };
  });
  const doneCount = stageState.filter((x) => x.cls === "done").length;
  const barPct = Math.max(0, Math.min(100, (doneCount + (stageState.some((x) => x.cls === "now") ? 0.5 : 0)) / 2 * 100));

  const fb = recentFeedback()[0];
  const unread = unseenFb().length;
  const best = modes.find((m) => m.n > 0);

  return `
    <div class="greet">
      <div style="flex:1;min-width:0">
        <div class="greet-date">${now.getMonth() + 1}월 ${now.getDate()}일 ${WEEK[now.getDay()]}요일</div>
        <div class="greet-h">${esc(me.name || "")}, 오늘도 힘내라!</div>
        <div class="greet-s">연습, 또 연습! 지칠 때까지 연습하자!</div>
      </div>
      ${next ? `<div class="dday-chip ${nd != null && nd <= 7 ? "urgent" : ""}">
        <div class="n">${nd === 0 ? "D-DAY" : "D-" + nd}</div>
        <div class="t">${nextU ? esc(nextU.univ) + " " + esc(nextU.dept || "") : "대학 면접"}<br>
          ${fmtDay(next)}${nextU?.admission ? " · " + esc(nextU.admission) : ""}</div></div>` : ""}
    </div>

    <div class="cols">
      <section class="hero">
        <div class="eyebrow">오늘의 면접 연습</div>
        <h2>스스로 연습하기</h2>
        <p>${best ? "선생님이 보내준 질문으로 연습해봅시다." : "아직 준비된 질문이 없어요. 선생님께 예상질문을 부탁해 보세요."}</p>
        <div class="acts">
          <button type="button" class="btn-primary" ${best ? `data-mode="${best.mode}"` : "disabled"}>면접 연습 시작하기 →</button>
          <button type="button" class="again" data-go="practice">다른 유형 고르기</button>
        </div>
        <svg class="art" width="112" height="112" viewBox="0 0 24 24" fill="none" stroke="var(--accent-line)"
          stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      </section>

      <section class="card next-card">
        <div class="top"><h3>다가오는 모의면접</h3>
          ${nb ? `<span class="badge badge-${nb.status === "confirmed" ? "green" : "orange"}">${nb.status === "confirmed" ? "확정" : "요청 중"}</span>` : ""}</div>
        ${nb ? `
          <div class="next-big"><span class="ic">${icon("calendar", 28)}</span><b>${fmtDay(nb.date)}</b></div>
          <div class="meta">
            <div><span class="ic">${icon("clock", 17)}</span>${esc(blockLabelOf(nb.block) || "")} · ${esc(nb.start)} – ${esc(nb.end)}</div>
            <div><span class="ic">${icon("user", 17)}</span>${nb.stage}차 · ${esc((nb.teachers || []).join(", "))} 선생님</div>
            <div><span class="ic">${icon("pin", 17)}</span>${esc(nb.room || "장소 미정")}</div>
          </div>`
        : `<p class="muted" style="margin:14px 0">아직 잡힌 모의면접이 없어요.<br>달력에서 선생님과 시간을 정해 보세요.</p>`}
        <div class="card-foot"><button type="button" class="go" data-go="schedule">${nb ? "일정 확인 →" : "시간 신청하기 →"}</button></div>
      </section>
    </div>

    <section class="card journey">
      <h3>나의 모의면접 여정</h3>
      <div class="steps">
        <div class="bar"><i style="width:${barPct}%"></i></div>
        ${stageState.map(({ sg, cls, label }) => `<button type="button" class="step" data-stage="${sg.key}">
          <span class="dot ${cls}">${cls === "done" ? icon("check", 15) : ""}</span>
          <b>${esc(sg.label)}</b><span>${esc(label)}</span></button>`).join("")}
      </div>
    </section>

    <div class="cols-half">
      <section class="card">
        <div class="head-row"><h3>최근 피드백</h3>${unread ? `<span class="badge badge-red">새 ${unread}</span>` : ""}
          <button type="button" class="go" data-go="feedback">전체 보기 →</button></div>
        ${fb ? `
          <div class="fb-title"><i></i>${esc(String(fb.title).slice(0, 60))}</div>
          <div class="fb-sub">${esc(fb.sub)}</div>
          ${fb.quote ? `<div class="quote">${esc(fb.quote)}</div>` : '<div style="height:12px"></div>'}
          <button type="button" class="go" data-go="feedback" style="font-size:.92rem">피드백 확인하기 →</button>`
        : `<div class="empty">아직 받은 피드백이 없어요.<br>연습을 제출하거나 면접을 보면 여기에 보여요.</div>`}
      </section>

      <section class="card">
        <div class="head-row"><h3>나의 준비 자료</h3>
          <button type="button" class="go" data-go="practice">전체 보기 →</button></div>
        ${docRowsHtml()}
      </section>
    </div>

    ${univHtml()}`;
}
function bindWide() { /* 컴퓨터 화면 전용 클릭은 없음 (모두 data-go / data-mode / data-stage) */ }

// ================= 휴대폰 화면 (720px 이하) — 예전 구성 =================
function homeNarrow({ today, next, nd, nextU }) {
  const todos = [];
  // 1) 아직 신청하지 않은 차수
  BOOK_STAGES.forEach((sg) => {
    const ts = stageTeachers(me, sg.key);
    if (!ts.length) return;
    if (bookings.some((b) => b.stage === sg.key && ACTIVE(b.status))) return;
    const nm = /면접$/.test(sg.label) ? sg.label : `${sg.label} 면접`;
    todos.push({ ic: "calendar", t: `${nm}을 신청하지 않았어요`, d: `${ts.join("·")} 선생님`,
      cta: "시간 신청하기", attr: `data-stage="${sg.key}"` });
  });
  // 2) 새로 온 피드백
  const nf = unseenFb().length;
  if (nf) todos.push({ ic: "chat", t: `새 피드백 ${nf}개`, d: "선생님이 남긴 피드백을 아직 보지 않았어요",
    cta: "보기", attr: 'data-go="feedback"' });
  // 3) 아직 해 보지 않은 연습
  const donePersonal = sessions.some((s) => s.mode === "personal");
  if (personal.length && !donePersonal) todos.push({ ic: "mic", t: `내 생기부 질문 ${personal.length}개 준비됨`,
    d: "아직 연습하지 않았어요", cta: "연습", attr: 'data-mode="personal"' });
  else if (!sessions.length) todos.push({ ic: "mic", t: "말하기 연습을 아직 해 보지 않았어요",
    d: "혼자 말로 답해 보고 선생님께 보낼 수 있어요", cta: "연습", attr: 'data-go="practice"' });

  const up = bookings.filter((b) => ACTIVE(b.status) && b.date >= today)
    .sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start)).slice(0, 5);

  const todoHtml = !todos.length
    ? `<div class="list-card"><div class="empty"><b style="display:block;color:var(--ink);font-size:1rem">지금 할 일은 없어요</b>
        <span style="display:block;margin-top:4px">면접 일정도 연습도 모두 챙겼어요. 아래 일정만 확인하세요.</span></div></div>`
    : (() => {
        const [first, ...rest] = todos;
        return `
      <div class="todo-main">
        <span class="t-ic">${icon(first.ic, 20)}</span>
        <div style="flex:1;min-width:0"><b>${esc(first.t)}</b><span class="muted">${esc(first.d)}</span>
          <button type="button" class="btn-primary" ${first.attr}>${esc(first.cta)}</button></div>
      </div>
      ${rest.length ? `<div class="list-card">${rest.map((x) => `
        <div class="list-row" style="cursor:default">
          <span class="r-ic">${icon(x.ic, 20)}</span>
          <span class="r-tx"><b>${esc(x.t)}</b><span class="muted">${esc(x.d)}</span></span>
          <button type="button" class="btn-sm" ${x.attr}>${esc(x.cta)}</button>
        </div>`).join("")}</div>` : ""}`;
      })();

  return `
    <div class="me-row">
      <div style="flex:1;min-width:0">
        <div class="me-name">${esc(me.name || "")}</div>
        <div class="me-sub">${esc(me.studentNo)}${me.track ? " · " + esc(me.track) : ""}${me.special && me.special !== "없음" ? " · " + esc(me.special) : ""}</div>
      </div>
    </div>

    ${next ? `<div class="dday-card ${nd != null && nd <= 7 ? "urgent" : ""}">
      <div class="d-box"><div class="d-lab">다음 면접</div><div class="d-n">${nd === 0 ? "D-DAY" : "D-" + nd}</div></div>
      <div class="d-body"><b>${nextU ? esc(nextU.univ) + " " + esc(nextU.dept || "") : "대학 면접"}</b>
        <span class="muted">${fmtDay(next)}${nextU?.admission ? " · " + esc(nextU.admission) : ""}</span></div>
    </div>`
    : `<div class="dday-card"><div class="d-body" style="border:none;padding:0"><b>면접일이 등록되지 않았어요</b>
        <span class="muted">선생님께 지원 대학·면접일 등록을 부탁하세요.</span></div></div>`}

    <div class="sec-head"><h2>오늘 할 일</h2><span class="n">${todos.length || ""}</span></div>
    ${todoHtml}

    <div class="sec-head"><h2>잡힌 일정</h2><div class="spacer"></div>
      <button class="btn-sm" data-go="schedule">일정 전체 보기</button></div>
    ${up.length ? `<div class="list-card">${up.map((b) => {
      const dt = new Date(b.date.replace(/-/g, "/"));
      const [lab, cls] = STATUS[b.status] || ["", "gray"];
      return `<button type="button" class="list-row" data-go="schedule">
        <span class="r-day"><b>${dt.getMonth() + 1}/${dt.getDate()}</b><span>${"일월화수목금토"[dt.getDay()]} ${esc(blockLabelOf(b.block) || "")}</span></span>
        <span class="r-tx"><b>${b.stage}차</b> ${esc((b.teachers || []).join("·"))}
          <span class="muted">${esc(b.room || "장소 미정")} · ${esc(b.start)}–${esc(b.end)}</span></span>
        <span class="badge badge-${cls}" style="flex:none">${esc(lab)}</span></button>`;
    }).join("")}</div>` : `<div class="list-card"><div class="empty">잡힌 면접 일정이 없어요.</div></div>`}

    ${(me.universities || []).length ? `
      <div class="sec-head"><h2>지원 대학</h2><span class="n">${me.universities.length}곳</span></div>
      <div class="list-card" style="padding:4px 16px">${univRowsHtml()}</div>` : ""}`;
}
function bindNarrow() { /* 휴대폰 화면 전용 클릭은 없음 */ }

// ---- 두 화면이 같이 쓰는 조각
function recentFeedback() {
  return [
    ...meetings.map((m) => ({ at: toDateSafe(m.date)?.getTime() || 0,
      title: m.improve || m.good || m.nextGoal || "대면 모의면접 피드백",
      sub: `${stageLabel(m.stage)} · ${(m.teachers || []).join(", ")} 선생님 · ${fmtDay(m.date).replace(/\(.\)$/, "")}`,
      quote: m.questions ? `“${m.questions}”` : (m.good ? `잘한 점: ${m.good}` : "") })),
    ...sessions.filter((x) => x.reviewedAt).map((x) => ({ at: (x.reviewedAt?.seconds || 0) * 1000,
      title: x.teacherFeedback?.comment || "말하기 연습 피드백",
      sub: `${x.modeLabel || x.mode} · ${x.reviewedBy || ""} 선생님`, quote: "" }))
  ].sort((a, b) => b.at - a.at);
}
function docRowsHtml() {
  return `${me.sheetUrl ? `<a class="doc-row" href="${esc(me.sheetUrl)}" target="_blank" rel="noopener">
      <span class="doc-ic">${icon("sheet", 18)}</span>
      <span class="tx"><b>내 준비 시트 열기</b><small>구글 시트에 정리한 내 답변</small></span>
      <span class="end">${icon("chevron", 18)}</span></a>` : ""}
    ${["personal", "personality"].map((k) => modes.find((m) => m.mode === k)).filter(Boolean).map((m) => `
      <button type="button" class="doc-row" data-mode="${m.mode}">
        <span class="doc-ic">${icon("note", 18)}</span>
        <span class="tx"><b>${esc(m.title)}</b><small>${m.n ? `${esc(m.desc)} · ${m.n}문항` : "아직 질문이 없어요"}</small></span>
        <span class="end">${icon("chevron", 18)}</span></button>`).join("")}`;
}
function univRowsHtml() {
  return (me.universities || []).map((u) => {
    const d = dday(u.date);
    return `<div class="univ" style="${d != null && d < 0 ? "opacity:.5" : ""}"><b>${u.date ? fmtDay(u.date) : "-"}</b> ${esc(u.univ)} <span>${esc(u.dept)}</span> <span class="muted">${esc(u.admission)} · ${esc(u.format)}</span></div>`;
  }).join("");
}
function univHtml() {
  if (!(me.universities || []).length) return "";
  return `<section class="card" style="margin-top:14px">
    <div class="head-row"><h3>지원 대학</h3><span class="n">${me.universities.length}곳</span></div>
    ${univRowsHtml()}</section>`;
}

// ---- 선생님 피드백 (대면 모의면접 + 말하기 연습 피드백을 한곳에)
const stageLabel = (k) => STAGES.find((s) => s.key === Number(k))?.label || "";
const tsSec = (t) => t?.seconds || (typeof t === "number" ? t / 1000 : 0);
function renderFeedback() {
  const reviewed = sessions.filter((s) => s.reviewedAt);
  setDot("#fbDot", unseenFb().length);   // 아직 안 본 피드백만 숫자로
  const cards = [
    ...meetings.map((m) => ({ at: (toDateSafe(m.date)?.getTime() || 0) / 1000, html: `
      <div class="card">
        <div class="row"><span class="badge badge-violet">대면 모의면접</span><b>${fmtDay(m.date)} · ${esc(stageLabel(m.stage))}</b><span class="badge">${esc(m.type)}</span><span class="muted">${esc((m.teachers || []).join(", "))} 선생님</span></div>
        <dl class="kv" style="margin-top:10px">
          ${m.questions ? `<dt>받은 질문</dt><dd>${esc(m.questions)}</dd>` : ""}
          ${m.good ? `<dt>잘한 점</dt><dd>${esc(m.good)}</dd>` : ""}
          ${m.improve ? `<dt>보완할 점</dt><dd><b>${esc(m.improve)}</b></dd>` : ""}
          ${m.nextGoal ? `<dt>다음 목표</dt><dd>${esc(m.nextGoal)}</dd>` : ""}
        </dl>
        <p class="muted" style="margin:10px 0 0">받은 피드백은 내 준비 시트의 '모의면접 피드백 및 수정 기록'에도 옮겨 적고 답변을 고쳐 보세요.</p>
      </div>` })),
    ...reviewed.map((x) => {
      const avg = avgScore(x), fb = x.teacherFeedback || {};
      return { at: tsSec(x.reviewedAt), html: `
      <div class="card clickable-card" data-sid="${x.id}">
        <div class="row"><span class="badge badge-blue">말하기 연습</span><b>${esc(x.modeLabel || x.mode)}</b><span class="muted">${fmtDate(x.startedAt)} 연습 · ${esc(x.reviewedBy || "")} 선생님</span>
          <div class="spacer"></div>${avg != null ? `<b>${avg.toFixed(1)}</b><span class="muted">/5</span>` : ""}</div>
        ${fb.comment ? `<div class="pre" style="margin-top:8px">${esc(fb.comment)}</div>` : ""}
        <div class="muted" style="margin-top:6px">눌러서 문항별 코멘트 보기 ›</div>
      </div>` };
    })
  ].sort((a, b) => b.at - a.at);
  $("#feedback").innerHTML = cards.length ? cards.map((c) => c.html).join("") : `<div class="card empty">아직 받은 피드백이 없어요.<br>말하기 연습을 제출하거나 대면 모의면접을 하면 선생님 피드백이 여기에 보여요.</div>`;
  $$("#feedback [data-sid]").forEach((el) => el.onclick = () => openSession(sessions.find((x) => x.id === el.dataset.sid)));
}
function toDateSafe(v) { const m = String(v || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }

// ---- 연습 기록
function avgScore(s) {
  const sc = s.teacherFeedback?.scores; if (!sc || !s.reviewedAt) return null;
  const v = CRITERIA.map((c) => sc[c.key]).filter((x) => typeof x === "number");
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function renderHistory() {
  if (!sessions.length) { $("#history").innerHTML = `<div class="card empty">아직 연습 기록이 없어요. 위에서 말하기 연습을 시작해 보세요.</div>`; return; }
  $("#history").innerHTML = `<div class="card table-wrap"><table>
    <thead><tr><th>날짜</th><th>유형</th><th>문항</th><th>상태</th><th>점수</th></tr></thead>
    <tbody>${sessions.map((s) => {
      const st = s.status !== "submitted" ? `<span class="badge badge-gray">미완료</span>`
        : s.reviewedAt ? `<span class="badge badge-green">피드백 도착</span>` : `<span class="badge badge-orange">검토 대기</span>`;
      const avg = avgScore(s);
      return `<tr class="clickable" data-id="${s.id}"><td>${fmtDate(s.startedAt)}</td><td>${esc(s.modeLabel || s.mode)}</td>
        <td>${(s.items || []).filter((i) => i.answer).length}/${(s.items || []).length}</td><td>${st}</td><td>${avg != null ? avg.toFixed(1) : "-"}</td></tr>`;
    }).join("")}</tbody></table></div>`;
  $$("#history tr[data-id]").forEach((tr) => tr.onclick = () => openSession(sessions.find((s) => s.id === tr.dataset.id)));
}
renderHistory();
renderFeedback();
homeReady = true; renderHome();

// ---- 새로고침 없이 피드백 반영 (선생님이 공개하면 바로 뜸)
{
  let firstS = true, firstM = true;
  const notify = () => toast("선생님 피드백이 도착했어요. 아래 '피드백' 탭을 확인하세요.", "ok", 6000);
  onSnapshot(query(collection(db, "sessions"), where("studentUid", "==", user.uid)), (snap) => {
    const before = new Set(sessions.filter((x) => x.reviewedAt).map((x) => x.id));
    sessions = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.startedAt?.seconds || 0) - (a.startedAt?.seconds || 0));
    if (!firstS && sessions.some((x) => x.reviewedAt && !before.has(x.id))) notify();
    firstS = false; renderHistory(); renderFeedback(); renderPracLinks(); renderHome();
  }, (e) => console.warn("연습 피드백 실시간", e));
  onSnapshot(query(collection(db, "meetings"), where("studentUid", "==", user.uid), where("shared", "==", true)), (snap) => {
    const before = new Set(meetings.map((x) => x.id));
    meetings = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    if (!firstM && meetings.some((x) => !before.has(x.id))) notify();
    firstM = false; renderFeedback(); renderHome();
  }, (e) => console.warn("대면 피드백 실시간", e));
}

function openSession(s) {
  $("#mTitle").textContent = `${s.modeLabel || s.mode} · ${fmtDate(s.startedAt)}`;
  const fb = s.reviewedAt ? (s.teacherFeedback || {}) : {};
  const scores = fb.scores ? `<div class="grid grid-4" style="margin:6px 0 4px">${CRITERIA.map((c) =>
      `<div><div class="muted">${c.label}</div><div class="stat">${fb.scores[c.key] ?? "-"}<span class="muted">/5</span></div></div>`).join("")}</div>` : "";
  $("#mBody").innerHTML = `
    ${s.reviewedAt ? `<div class="fb-box"><h3>선생님 피드백</h3>${scores}${fb.comment ? `<div class="pre">${esc(fb.comment)}</div>` : ""}</div>` : `<p class="muted">${s.status === "submitted" ? "선생님 검토를 기다리는 중이에요." : "완료되지 않은 연습입니다."}</p>`}
    ${s.reviewedAt && s.aiFeedback ? `<div class="fb-box" style="background:#f8f5ff;border-color:#e6dcfb"><h3>AI 피드백</h3><div class="pre">${esc(s.aiFeedback)}</div></div>` : ""}
    ${(s.items || []).map((it, i) => `
      <div class="q-item" style="margin-top:12px">
        <div class="row">${typeBadge(it.type)} <span class="muted">Q${i + 1} · ${it.usedSec ?? 0}초 사용 / 제한 ${it.answerSec}초</span></div>
        <div class="q-text pre" style="margin-top:6px">${esc(it.text)}</div>
        <div class="ans">${esc(it.answer) || '<span class="muted">(답변 없음)</span>'}</div>
        ${it.followUp ? `<div style="margin-top:8px"><b>꼬리질문</b> ${esc(it.followUp)}</div><div class="ans">${esc(it.followAnswer) || '<span class="muted">(답변 없음)</span>'}</div>` : ""}
        ${fb.itemComments?.[i] ? `<div class="fb-box"><b>선생님</b> <span class="pre">${esc(fb.itemComments[i])}</span></div>` : ""}
      </div>`).join("")}
    ${s.reflection ? `<div class="q-item" style="margin-top:12px"><b>나의 돌아보기</b><div class="pre muted">잘한 점: ${esc(s.reflection.good)}\n아쉬운 점: ${esc(s.reflection.improve)}</div></div>` : ""}`;
  $("#modal").hidden = false;
}
$("#mClose").onclick = () => $("#modal").hidden = true;
$("#modal").onclick = (e) => { if (e.target.id === "modal") $("#modal").hidden = true; };

// ---- 내 예상질문
function renderMine() {
  const show = $("#showIntent").checked;
  if (!personal.length) { $("#mine").innerHTML = `<div class="card empty">아직 선생님이 예상질문을 올리지 않았어요.</div>`; return; }
  $("#mine").innerHTML = personal.map((q, i) => `
    <div class="q-item">
      <div class="q-text pre">${i + 1}. ${esc(q.text)}</div>
      <div class="q-meta">${esc(q.category || "")}${q.basis ? ` · ${esc(q.basis)}` : ""}</div>
      ${show && q.followUps?.length ? `<ul class="follow">${q.followUps.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>` : ""}
    </div>`).join("");
}
$("#showIntent").onchange = renderMine;
renderMine();
</script>
